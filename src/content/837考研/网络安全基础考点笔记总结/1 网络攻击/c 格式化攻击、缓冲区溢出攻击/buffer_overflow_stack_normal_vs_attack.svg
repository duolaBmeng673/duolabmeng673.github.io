<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" width="720" height="564" role="img">
  <title>缓冲区溢出前后栈帧布局对比</title>
  <desc>对比正常栈帧与栈溢出攻击后的栈帧结构，说明 buf 溢出如何覆盖旧 EBP 与返回地址，进而跳转至 NOP Sled 并执行 Shellcode 获取 Shell。</desc>
  <defs>
    <marker id="bof-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="bof-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Left: Normal stack -->
    <text x="192" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">正常栈布局</text>
    <text x="34" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">高地址</text>
    <line x1="34" y1="340" x2="34" y2="70" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#bof-k)"/>
    <text x="34" y="364" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">低地址</text>

    <rect x="68" y="42" width="248" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="192" y="70" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">参数</text>

    <rect x="68" y="92" width="248" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="192" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">返回地址 0x08041234（正常）</text>

    <rect x="68" y="146" width="248" height="44" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="192" y="174" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">旧 EBP（帧指针）</text>

    <rect x="68" y="196" width="248" height="178" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="192" y="290" text-anchor="middle" font-size="15" font-weight="600" fill="#4b5563">buf[64]</text>

    <rect x="68" y="390" width="248" height="44" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="192" y="418" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">ret → 正常返回 0x08041234</text>

    <!-- Divider -->
    <line x1="344" y1="16" x2="344" y2="440" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Right: Overflowed stack -->
    <text x="530" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">溢出攻击后栈布局</text>
    <text x="380" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">高地址</text>
    <line x1="380" y1="344" x2="380" y2="70" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#bof-k)"/>
    <text x="380" y="368" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">低地址</text>

    <rect x="414" y="42" width="276" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="552" y="70" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">参数</text>

    <rect x="414" y="92" width="276" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="552" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">返回地址 → 0xbfff1200（NOP）</text>

    <rect x="414" y="146" width="276" height="44" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="552" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">旧 EBP → BBBB</text>

    <rect x="414" y="196" width="276" height="44" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="552" y="224" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">重复返回地址 0xbfff1200 × N</text>

    <rect x="414" y="244" width="276" height="64" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="552" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">Shellcode</text>
    <text x="552" y="292" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">execve("/bin/sh")</text>

    <rect x="414" y="312" width="276" height="62" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="552" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">NOP Sled（滑雪板）</text>
    <text x="552" y="361" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">\x90\x90… ← buf[0] 起始</text>

    <line x1="704" y1="368" x2="704" y2="98" stroke="#ef4444" stroke-width="1.5" marker-end="url(#bof-r)"/>

    <rect x="414" y="390" width="276" height="44" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="552" y="418" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">ret → 跳到 0xbfff1200（NOP 区）</text>

    <!-- Attack execution flow strip -->
    <text x="8" y="462" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">攻击执行路径：</text>
    <rect x="8" y="474" width="158" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="87" y="504" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">① 跳入 NOP Sled</text>
    <line x1="166" y1="498" x2="188" y2="498" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bof-k)"/>
    <rect x="192" y="474" width="156" height="48" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="270" y="504" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">② 滑入 Shellcode</text>
    <line x1="348" y1="498" x2="370" y2="498" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bof-k)"/>
    <rect x="374" y="474" width="150" height="48" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="449" y="504" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">③ 执行 /bin/sh</text>
    <line x1="524" y1="498" x2="546" y2="498" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bof-k)"/>
    <rect x="550" y="474" width="162" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="631" y="504" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">④ 获取 Shell 成功</text>

    <text x="360" y="550" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">红色：被覆盖的控制数据；黄色：攻击者注入的数据；右侧红箭头：输入填充方向</text>
  </g>
</svg>
