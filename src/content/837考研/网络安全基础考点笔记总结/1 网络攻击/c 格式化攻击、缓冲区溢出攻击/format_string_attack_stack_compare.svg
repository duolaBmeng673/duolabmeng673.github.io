<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 482" width="720" height="482" role="img">
  <title>格式化字符串正常调用与攻击栈帧对比</title>
  <desc>对比 printf("%d %d", a, b) 与 printf(buf) 且 buf="%x%x%x" 时的栈帧参数游标读取范围，说明缺失实参如何导致栈数据泄露。</desc>
  <defs>
    <marker id="fsa-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="fsa-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Left: Normal call -->
    <text x="176" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">正常调用 printf("%d %d", a, b)</text>
    <text x="31" y="56" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">高地址</text>
    <line x1="31" y1="308" x2="31" y2="72" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fsa-k)"/>
    <text x="31" y="332" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">低地址</text>

    <rect x="64" y="44" width="256" height="48" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="192" y="74" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">（更高栈帧内容）</text>

    <rect x="64" y="102" width="256" height="48" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="192" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">参数 b ← 第 2 个 %d</text>

    <rect x="64" y="158" width="256" height="48" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="192" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">参数 a ← 第 1 个 %d</text>

    <rect x="64" y="214" width="256" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="192" y="244" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">格式串地址 → "%d %d"</text>

    <rect x="64" y="270" width="256" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="192" y="298" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">返回地址</text>

    <line x1="334" y1="226" x2="334" y2="122" stroke="#1f2937" stroke-width="1.5" marker-end="url(#fsa-k)"/>

    <rect x="64" y="348" width="256" height="48" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="192" y="378" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">输出 a、b 的值</text>

    <line x1="352" y1="16" x2="352" y2="412" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Right: Attack call -->
    <text x="536" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">攻击调用 printf(buf), buf="%x%x%x"</text>
    <text x="392" y="56" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">高地址</text>
    <line x1="392" y1="308" x2="392" y2="72" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#fsa-k)"/>
    <text x="392" y="332" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">低地址</text>

    <rect x="426" y="44" width="272" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="562" y="74" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">栈上其他数据 ← 第 3 个 %x</text>

    <rect x="426" y="100" width="272" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="562" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">栈上其他数据 ← 第 2 个 %x</text>

    <rect x="426" y="156" width="272" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="562" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">栈上其他数据 ← 第 1 个 %x</text>

    <rect x="426" y="214" width="272" height="48" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="562" y="244" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">格式串地址 → "%x%x%x"</text>

    <rect x="426" y="270" width="272" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="562" y="298" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">返回地址</text>

    <line x1="712" y1="226" x2="712" y2="62" stroke="#ef4444" stroke-width="1.5" marker-end="url(#fsa-r)"/>

    <rect x="426" y="348" width="272" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="562" y="378" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">泄露栈上 3 个值</text>

    <text x="360" y="438" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">细箭头：参数游标方向，每遇到一个格式符上移一格；右图因无实参直接读取上层栈帧</text>
    <text x="360" y="468" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">若格式串含 %n，还会将已输出字符数写入栈上对应地址（任意写）</text>
  </g>
</svg>
