<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="450" rx="12" fill="#FAFAFA" stroke="#DDD"/>

  <!-- left: inputs -->
  <rect x="30" y="60" width="200" height="100" rx="10" fill="#E8F0FE" stroke="#3A6FD8" stroke-width="2"/>
  <text x="130" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F4FA8">训练数据</text>
  <text x="130" y="116" text-anchor="middle" font-size="14" fill="#333">14 个样本</text>
  <text x="130" y="140" text-anchor="middle" font-size="14" fill="#333">Yes 9 · No 5</text>

  <rect x="30" y="250" width="200" height="140" rx="10" fill="#FFF1CC" stroke="#D19A00" stroke-width="2"/>
  <text x="130" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#8A6400">新样本 X</text>
  <text x="130" y="304" text-anchor="middle" font-size="13" fill="#333">Outlook = Sunny</text>
  <text x="130" y="326" text-anchor="middle" font-size="13" fill="#333">Temperature = Cool</text>
  <text x="130" y="348" text-anchor="middle" font-size="13" fill="#333">Humidity = High</text>
  <text x="130" y="370" text-anchor="middle" font-size="13" fill="#333">Wind = Strong</text>

  <!-- bus: both inputs feed both class cards -->
  <line x1="250" y1="110" x2="250" y2="320" stroke="#555" stroke-width="2"/>
  <circle cx="250" cy="110" r="4" fill="#555"/>
  <circle cx="250" cy="320" r="4" fill="#555"/>
  <line x1="230" y1="110" x2="266" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="320" x2="266" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- middle: class Yes -->
  <rect x="270" y="30" width="330" height="160" rx="10" fill="#E6F4EA" stroke="#2E8B57" stroke-width="2"/>
  <text x="286" y="58" font-size="16" font-weight="bold" fill="#1E6B43">类 Yes（9 个样本）</text>
  <text x="286" y="88" font-size="14" fill="#333">① 先验　P(Yes) = 9/14</text>
  <text x="286" y="114" font-size="14" fill="#333">⑤ 条件概率　2/9 · 3/9 · 3/9 · 3/9</text>
  <text x="286" y="134" font-size="12" fill="#777">依次对应 Sunny · Cool · High · Strong</text>
  <text x="286" y="164" font-size="14" fill="#333">④ 连乘　P(X|Yes) = 2/243 ≈ 0.0082</text>

  <!-- middle: class No -->
  <rect x="270" y="240" width="330" height="160" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
  <text x="286" y="268" font-size="16" font-weight="bold" fill="#A32B1F">类 No（5 个样本）</text>
  <text x="286" y="298" font-size="14" fill="#333">① 先验　P(No) = 5/14</text>
  <text x="286" y="324" font-size="14" fill="#333">⑤ 条件概率　3/5 · 1/5 · 4/5 · 3/5</text>
  <text x="286" y="344" font-size="12" fill="#777">依次对应 Sunny · Cool · High · Strong</text>
  <text x="286" y="374" font-size="14" fill="#333">④ 连乘　P(X|No) = 36/625 = 0.0576</text>

  <!-- right: scores -->
  <line x1="600" y1="110" x2="646" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="320" x2="646" y2="320" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="65" width="220" height="90" rx="10" fill="#CFEBD9" stroke="#2E8B57" stroke-width="2"/>
  <text x="760" y="95" text-anchor="middle" font-size="13" fill="#1E6B43">③ 分子　P(X|Yes)·P(Yes)</text>
  <text x="760" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E6B43">1/189 ≈ 0.0053</text>

  <rect x="650" y="275" width="220" height="90" rx="10" fill="#F9D7D3" stroke="#C0392B" stroke-width="2"/>
  <text x="760" y="305" text-anchor="middle" font-size="13" fill="#A32B1F">③ 分子　P(X|No)·P(No)</text>
  <text x="760" y="337" text-anchor="middle" font-size="17" font-weight="bold" fill="#A32B1F">18/875 ≈ 0.0206</text>

  <!-- decision -->
  <line x1="760" y1="155" x2="760" y2="181" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="275" x2="760" y2="249" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="185" width="220" height="60" rx="10" fill="#5B3FA0" stroke="#3E2A73" stroke-width="2"/>
  <text x="760" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">0.0206 &gt; 0.0053</text>
  <text x="760" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">分类为 No</text>

  <!-- caption -->
  <text x="450" y="430" text-anchor="middle" font-size="13" fill="#666">分母 P(X) 对两类相同，只需比较分子，取最大者</text>
</svg>
