<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 628" width="720" height="628" role="img">
  <title>朴素贝叶斯分类计算流程</title>
  <desc>展示给定 14 条训练样本与新样本 X 的 4 个特征时，朴素贝叶斯分别计算类 Yes 和类 No 的先验概率、条件概率连乘及后验分子并判别分类的完整过程。</desc>
  <defs>
    <marker id="nb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="328" height="140" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="172" y="42" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">训练数据</text>
    <text x="172" y="78" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">14 个样本</text>
    <text x="172" y="106" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Yes 9 · No 5</text>
    <rect x="384" y="8" width="328" height="140" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="548" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">新样本 X</text>
    <text x="548" y="64" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Outlook = Sunny</text>
    <text x="548" y="86" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Temperature = Cool</text>
    <text x="548" y="108" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Humidity = High</text>
    <text x="548" y="130" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">Wind = Strong</text>
    <line x1="172" y1="148" x2="172" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#nb-arrow)"/>
    <line x1="548" y1="148" x2="548" y2="196" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#nb-arrow)"/>
    <line x1="172" y1="168" x2="548" y2="168" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="172" cy="168" r="3" fill="#94a3b8"/>
    <circle cx="548" cy="168" r="3" fill="#94a3b8"/>
    <rect x="8" y="200" width="328" height="164" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="26" y="228" font-size="16" font-weight="600" fill="#115e59">类 Yes（9 个样本）</text>
    <text x="26" y="258" font-size="15" font-weight="400" fill="#1f2937">① 先验　P(Yes) = 9/14</text>
    <text x="26" y="284" font-size="15" font-weight="400" fill="#1f2937">⑤ 条件概率　2/9 · 3/9 · 3/9 · 3/9</text>
    <text x="26" y="308" font-size="15" font-weight="400" fill="#4b5563">依次对应 Sunny · Cool · High · Strong</text>
    <text x="26" y="338" font-size="15" font-weight="400" fill="#1f2937">④ 连乘　P(X|Yes) = 2/243 ≈ 0.0082</text>
    <rect x="384" y="200" width="328" height="164" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="402" y="228" font-size="16" font-weight="600" fill="#991b1b">类 No（5 个样本）</text>
    <text x="402" y="258" font-size="15" font-weight="400" fill="#1f2937">① 先验　P(No) = 5/14</text>
    <text x="402" y="284" font-size="15" font-weight="400" fill="#1f2937">⑤ 条件概率　3/5 · 1/5 · 4/5 · 3/5</text>
    <text x="402" y="308" font-size="15" font-weight="400" fill="#4b5563">依次对应 Sunny · Cool · High · Strong</text>
    <text x="402" y="338" font-size="15" font-weight="400" fill="#1f2937">④ 连乘　P(X|No) = 36/625 = 0.0576</text>
    <line x1="172" y1="364" x2="172" y2="396" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#nb-arrow)"/>
    <line x1="548" y1="364" x2="548" y2="396" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#nb-arrow)"/>
    <rect x="8" y="400" width="328" height="76" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="172" y="428" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">③ 分子　P(X|Yes)·P(Yes)</text>
    <text x="172" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">1/189 ≈ 0.0053</text>
    <rect x="384" y="400" width="328" height="76" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="548" y="428" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">③ 分子　P(X|No)·P(No)</text>
    <text x="548" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">18/875 ≈ 0.0206</text>
    <path d="M172 476 V496 H300 V516" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#nb-arrow)"/>
    <path d="M548 476 V496 H420 V516" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#nb-arrow)"/>
    <rect x="196" y="520" width="328" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="360" y="546" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">0.0206 &gt; 0.0053</text>
    <text x="360" y="570" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">分类为 No</text>
    <text x="360" y="616" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">分母 P(X) 对两类相同，只需比较分子，取最大者</text>
  </g>
</svg>
