<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 526" width="720" height="526" role="img">
  <title>Libpcap 抓包函数调用流程</title>
  <desc>按顺序列出 Libpcap 的 6 个核心调用步骤：选设备、打开设备、编译过滤规则、设置过滤规则、循环抓包配合回调函数处理以及关闭释放资源。</desc>
  <defs>
    <marker id="pcap-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="380" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="198" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">1. pcap_lookupdev</text>
    <text x="198" y="58" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">选设备：返回可用网卡名称</text>
    <line x1="198" y1="72" x2="198" y2="92" stroke="#1f2937" stroke-width="1.5" marker-end="url(#pcap-k)"/>

    <rect x="8" y="96" width="380" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="198" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">2. pcap_open_live</text>
    <text x="198" y="146" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">打开设备：准备获取网络数据</text>
    <line x1="198" y1="160" x2="198" y2="180" stroke="#1f2937" stroke-width="1.5" marker-end="url(#pcap-k)"/>

    <rect x="8" y="184" width="380" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="198" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">3. pcap_compile</text>
    <text x="198" y="234" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">过滤准备：编译 BPF 过滤规则</text>
    <line x1="198" y1="248" x2="198" y2="268" stroke="#1f2937" stroke-width="1.5" marker-end="url(#pcap-k)"/>

    <rect x="8" y="272" width="380" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="198" y="298" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">4. pcap_setfilter</text>
    <text x="198" y="322" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">过滤生效：将规则绑定到抓包句柄</text>
    <line x1="198" y1="336" x2="198" y2="356" stroke="#1f2937" stroke-width="1.5" marker-end="url(#pcap-k)"/>

    <rect x="8" y="360" width="380" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="198" y="388" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">5. pcap_loop</text>
    <text x="198" y="414" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">抓包：循环抓取数据包</text>

    <line x1="392" y1="394" x2="432" y2="394" stroke="#1f2937" stroke-width="1.5" marker-start="url(#pcap-k)" marker-end="url(#pcap-k)"/>

    <rect x="436" y="360" width="276" height="68" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="574" y="388" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">回调函数（callback）</text>
    <text x="574" y="414" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">处理：每捕获一个报文调用</text>

    <line x1="198" y1="428" x2="198" y2="448" stroke="#1f2937" stroke-width="1.5" marker-end="url(#pcap-k)"/>

    <rect x="8" y="452" width="380" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="198" y="478" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">6. pcap_close</text>
    <text x="198" y="502" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">关闭：释放设备句柄与过滤资源</text>
  </g>
</svg>
