<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 682" width="720" height="682" role="img">
  <title>BM 算法匹配主流程</title>
  <desc>展示 BM 字符串匹配算法主流程：预处理 bmBc 与 bmGs，从右向左逐字符比较，匹配成功按 bmGs[0] 移位，失配取坏字符与好后缀启发式的最大移位。</desc>
  <defs>
    <marker id="bmf-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="bmf-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="bmf-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="200" y="8" width="320" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="360" y="39" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">预处理：求 bmBc[ ]、bmGs[ ]</text>
    <line x1="360" y1="58" x2="360" y2="80" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bmf-k)"/>

    <rect x="200" y="84" width="320" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="360" y="115" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">s = 0（模式串与文本串左对齐）</text>
    <line x1="360" y1="134" x2="360" y2="158" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bmf-k)"/>

    <polygon points="360,162 490,196 360,230 230,196" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="360" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">s ≤ n − m ?</text>

    <line x1="490" y1="196" x2="554" y2="196" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bmf-k)"/>
    <text x="520" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">否</text>
    <rect x="558" y="171" width="144" height="50" rx="25" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="630" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">匹配结束</text>

    <line x1="360" y1="230" x2="360" y2="256" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bmf-k)"/>
    <text x="376" y="248" text-anchor="start" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">是</text>

    <rect x="190" y="260" width="340" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="360" y="291" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">j = m − 1（从右端开始比较）</text>
    <line x1="360" y1="310" x2="360" y2="334" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bmf-k)"/>

    <polygon points="360,338 524,376 360,414 196,376" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="360" y="382" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">j ≥ 0 且 P[j] = T[s+j] ?</text>

    <line x1="196" y1="376" x2="146" y2="376" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#bmf-t)"/>
    <text x="172" y="364" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">是</text>
    <rect x="8" y="351" width="134" height="50" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="75" y="382" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">j = j − 1</text>
    <path d="M75 351 V324 H354" fill="none" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#bmf-t)"/>

    <line x1="360" y1="414" x2="360" y2="442" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bmf-k)"/>
    <text x="376" y="434" text-anchor="start" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">否</text>

    <polygon points="360,446 508,482 360,518 212,482" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="360" y="488" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">j &lt; 0 ?（全部匹配）</text>

    <path d="M212 482 H164 V536" fill="none" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#bmf-t)"/>
    <text x="188" y="470" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">是</text>
    <rect x="24" y="540" width="280" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="164" y="566" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">报告匹配位置 s</text>
    <text x="164" y="592" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">shift = bmGs[0]</text>

    <path d="M508 482 H524 V520" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bmf-k)"/>
    <text x="536" y="498" text-anchor="start" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">否</text>
    <rect x="348" y="524" width="354" height="86" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="525" y="548" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">失配：shift = max(bc, gs, 1)</text>
    <text x="525" y="573" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">bc = bmBc[T[s+j]] − (m−1−j)</text>
    <text x="525" y="597" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">gs = bmGs[j]</text>

    <path d="M164 608 V653 H256" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bmf-k)"/>
    <path d="M525 610 V653 H464" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#bmf-k)"/>
    <rect x="260" y="632" width="200" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="360" y="659" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">s = s + shift</text>
    <path d="M460 666 H712 V148 H366" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#bmf-b)"/>
  </g>
</svg>
