</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="1" y="1" width="598" height="658" rx="10" fill="#fafafa" stroke="#e5e7eb"/><text x="20" y="28" class="tb">图 6  BM 匹配主流程</text><rect x="130.0" y="44.0" width="260" height="36" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5"/><text x="260" y="66" class="t c">预处理：求 bmBc[ ]、bmGs[ ]</text><line x1="260" y1="80" x2="260" y2="102" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="130.0" y="102.0" width="260" height="36" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="260" y="124" class="t c">s = 0（模式串与文本串左对齐）</text><line x1="260" y1="138" x2="260" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><polygon points="260,160.0 345.0,196 260,232.0 175.0,196" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="260" y="200" class="t c">s ≤ n − m ?</text><line x1="260" y1="232" x2="260" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="268" y="252" class="s">是</text><line x1="345" y1="196" x2="445" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="360" y="188" class="s">否</text><rect x="445.0" y="178.0" width="120" height="36" rx="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/><text x="505" y="200" class="t c">匹配结束</text><rect x="130.0" y="262.0" width="260" height="36" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="260" y="284" class="t c">j = m − 1（从右端开始比较）</text><line x1="260" y1="298" x2="260" y2="322" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><polygon points="260,322.0 375.0,358 260,394.0 145.0,358" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="260" y="353" class="t c">j ≥ 0 且</text><text x="260" y="371" class="t c">P[j] = T[s+j] ?</text><text x="268" y="408" class="s">否</text><line x1="375" y1="358" x2="445" y2="358" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="388" y="350" class="s">是</text><rect x="445.0" y="340.0" width="120" height="36" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="505" y="362" class="t c">j = j − 1</text><path d="M505 340 L505 310 L260 310" fill="none" stroke="#475569" stroke-width="1.5"/><line x1="260" y1="394" x2="260" y2="424" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><polygon points="260,424.0 360.0,460 260,496.0 160.0,460" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="260" y="455" class="t c">j &lt; 0 ?</text><text x="260" y="473" class="t c">（全部匹配）</text><line x1="260" y1="496" x2="260" y2="526" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="268" y="516" class="s">否</text><line x1="360" y1="460" x2="445" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="372" y="452" class="s">是</text><rect x="445.0" y="434.0" width="120" height="52" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="505" y="455" class="t c">报告匹配位置 s</text><text x="505" y="473" class="t c">shift = bmGs[0]</text><rect x="70.0" y="524.0" width="380" height="52" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="260" y="545" class="t c">失配：shift = max( bc, gs, 1 )</text><text x="260" y="563" class="t c">bc = bmBc[T[s+j]] − (m−1−j)，gs = bmGs[j]</text><path d="M505 486 L505 600 L320 600" fill="none" stroke="#475569" stroke-width="1.5"/><line x1="260" y1="576" x2="260" y2="603" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="130.0" y="603.0" width="260" height="34" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="260" y="624" class="t c">s = s + shift</text><path d="M320 600 L320 603" fill="none" stroke="#475569" stroke-width="1.5"/><path d="M130 620 L28 620 L28 196 L175 196" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/></svg>