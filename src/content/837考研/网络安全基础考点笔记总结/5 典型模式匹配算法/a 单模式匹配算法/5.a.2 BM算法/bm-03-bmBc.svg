<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" width="720" height="568" role="img">
  <title>bmBc 数组的构造与位移公式</title>
  <desc>展示模式串 P=NEDLEE 的 bmBc 坏字符数组构造方法、字符位移查询表及 shift = bmBc[c] - d 的几何含义。</desc>
  <defs>
    <marker id="bm03-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="8" y="24" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">① 逐位记录“到模式串右端的距离” m−1−i</text>
    <text x="8" y="46" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">同字符取最右出现，末位不参与</text>
    <text x="64" y="114" text-anchor="end" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">下标 i</text>
    <rect x="78" y="88" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="105" y="77" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">0</text>
    <text x="105" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">N</text>
    <rect x="132" y="88" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="159" y="77" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">1</text>
    <text x="159" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">E</text>
    <rect x="186" y="88" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="213" y="77" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">2</text>
    <text x="213" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">D</text>
    <rect x="240" y="88" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="267" y="77" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">3</text>
    <text x="267" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">L</text>
    <rect x="294" y="88" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="321" y="77" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">4</text>
    <text x="321" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">E</text>
    <rect x="348" y="88" width="54" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="375" y="77" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">5</text>
    <text x="375" y="114" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">E</text>
    <text x="418" y="114" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">← 末位 E 不参与</text>
    <text x="64" y="156" text-anchor="end" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">m−1−i</text>
    <text x="105" y="156" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">5</text>
    <text x="159" y="156" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">4</text>
    <text x="213" y="156" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">3</text>
    <text x="267" y="156" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">2</text>
    <text x="321" y="156" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">1</text>
    <text x="375" y="156" text-anchor="middle" font-size="16" font-weight="600" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">0</text>
    <text x="418" y="156" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">末位忽略</text>
    <text x="8" y="200" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">② 得到 bmBc 表（不在模式中的字符 = m = 6）</text>
    <text x="8" y="222" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">E 取 i=4 的 1，而不是末位的 0</text>
    <rect x="8" y="238" width="117" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="66.5" y="264" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">c</text>
    <rect x="8" y="278" width="117" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="66.5" y="304" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">bmBc</text>
    <rect x="125" y="238" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="183.5" y="264" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">N</text>
    <rect x="125" y="278" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="183.5" y="304" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">5</text>
    <rect x="242" y="238" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="300.5" y="264" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">E</text>
    <rect x="242" y="278" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="300.5" y="304" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">1</text>
    <rect x="359" y="238" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="417.5" y="264" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">D</text>
    <rect x="359" y="278" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="417.5" y="304" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">3</text>
    <rect x="476" y="238" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="534.5" y="264" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">L</text>
    <rect x="476" y="278" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="534.5" y="304" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">2</text>
    <rect x="593" y="238" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="651.5" y="264" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">其他</text>
    <rect x="593" y="278" width="117" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="651.5" y="304" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">6</text>
    <text x="8" y="358" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">③ 实际位移 shift = bmBc[c] − d</text>
    <text x="8" y="380" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">其中 d = m−1−j 是失配位置到模式串右端的距离</text>
    <text x="64" y="450" text-anchor="end" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">P</text>
    <rect x="78" y="424" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="105" y="413" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">0</text>
    <text x="105" y="450" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">N</text>
    <rect x="132" y="424" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="159" y="413" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">1</text>
    <text x="159" y="450" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">E</text>
    <rect x="186" y="424" width="54" height="40" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="213" y="413" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">2</text>
    <text x="213" y="450" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">D</text>
    <rect x="240" y="424" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="267" y="413" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">3</text>
    <text x="267" y="450" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">L</text>
    <rect x="294" y="424" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="321" y="413" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">4</text>
    <text x="321" y="450" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">E</text>
    <rect x="348" y="424" width="54" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="375" y="413" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">5</text>
    <text x="375" y="450" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">E</text>
    <path d="M190 476 V484 H398 V476" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="418" y="486" font-size="15" font-weight="400" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">d = m−1−j = 3（j=2 到右端）</text>
    <path d="M82 508 V516 H398 V508" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="418" y="518" font-size="15" font-weight="400" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">bmBc[N] = m−1−i = 5（最右 N 到右端）</text>
    <text x="8" y="556" font-size="15" font-weight="400" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">两段距离之差即模式串要右移的位数：shift = 5 − 3 = 2；若差 ≤ 0（规则 2b），改取 1</text>
  </g>
</svg>
