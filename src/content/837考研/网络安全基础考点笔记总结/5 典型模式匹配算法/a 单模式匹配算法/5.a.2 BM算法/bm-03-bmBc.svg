</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="1" y="1" width="698" height="508" rx="10" fill="#fafafa" stroke="#e5e7eb"/><text x="20" y="28" class="tb">图 3  bmBc 数组的构造与位移公式（P = NEDLEE）</text><text x="20" y="62" class="t">① 逐位记录“到模式串右端的距离”m−1−i，同字符取最右出现，末位不参与</text><text x="108" y="128" class="s r">下标 i</text><rect x="120" y="100" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="142.0" y="123.0" class="m" style="font-size:17px;fill:#111827">N</text><text x="142.0" y="95" class="i">0</text><rect x="164" y="100" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="186.0" y="123.0" class="m" style="font-size:17px;fill:#111827">E</text><text x="186.0" y="95" class="i">1</text><rect x="208" y="100" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="230.0" y="123.0" class="m" style="font-size:17px;fill:#111827">D</text><text x="230.0" y="95" class="i">2</text><rect x="252" y="100" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="274.0" y="123.0" class="m" style="font-size:17px;fill:#111827">L</text><text x="274.0" y="95" class="i">3</text><rect x="296" y="100" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="318.0" y="123.0" class="m" style="font-size:17px;fill:#111827">E</text><text x="318.0" y="95" class="i">4</text><rect x="340" y="100" width="44" height="44" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="362.0" y="123.0" class="m" style="font-size:17px;fill:#111827">E</text><text x="362.0" y="95" class="i">5</text><text x="142.0" y="164" class="m" style="font-size:14px;fill:#2563eb">5</text><text x="186.0" y="164" class="m" style="font-size:14px;fill:#2563eb">4</text><text x="230.0" y="164" class="m" style="font-size:14px;fill:#2563eb">3</text><text x="274.0" y="164" class="m" style="font-size:14px;fill:#2563eb">2</text><text x="318.0" y="164" class="m" style="font-size:14px;fill:#2563eb">1</text><text x="362.0" y="164" class="m" style="font-size:14px;fill:#9ca3af">0</text><text x="108" y="168" class="s r">m−1−i</text><text x="398" y="168" class="s">末位忽略</text><text x="398" y="124" class="s">← 末位 E 不参与</text><text x="20" y="200" class="t">② 得到 bmBc 表（E 取 i=4 的 1，而不是末位的 0；不在模式中的字符 = m = 6）</text><rect x="90" y="222" width="70" height="32" rx="0" fill="#e0e7ff" stroke="#94a3b8" stroke-width="1"/><rect x="90" y="254" width="70" height="32" rx="0" fill="#e0e7ff" stroke="#94a3b8" stroke-width="1"/><text x="125.0" y="243" class="t c" style="font-weight:700">c</text><text x="125.0" y="275" class="t c" style="font-weight:700">bmBc</text><rect x="160" y="222" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><rect x="160" y="254" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="195.0" y="243" class="t c" style="font-weight:700">N</text><text x="195.0" y="275" class="t c" style="font-weight:700">5</text><rect x="230" y="222" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><rect x="230" y="254" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="265.0" y="243" class="t c" style="font-weight:700">E</text><text x="265.0" y="275" class="t c" style="font-weight:700">1</text><rect x="300" y="222" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><rect x="300" y="254" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="335.0" y="243" class="t c" style="font-weight:700">D</text><text x="335.0" y="275" class="t c" style="font-weight:700">3</text><rect x="370" y="222" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><rect x="370" y="254" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="405.0" y="243" class="t c" style="font-weight:700">L</text><text x="405.0" y="275" class="t c" style="font-weight:700">2</text><rect x="440" y="222" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><rect x="440" y="254" width="70" height="32" rx="0" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="475.0" y="243" class="t c" style="font-weight:700">其他</text><text x="475.0" y="275" class="t c" style="font-weight:700">6</text><text x="20" y="322" class="t">③ 实际位移 shift = bmBc[c] − d，其中 d = m−1−j 是失配位置到模式串右端的距离</text><rect x="120" y="356" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="142.0" y="379.0" class="m" style="font-size:17px;fill:#111827">N</text><text x="142.0" y="351" class="i">0</text><rect x="164" y="356" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="186.0" y="379.0" class="m" style="font-size:17px;fill:#111827">E</text><text x="186.0" y="351" class="i">1</text><rect x="208" y="356" width="44" height="44" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="230.0" y="379.0" class="m" style="font-size:17px;fill:#111827">D</text><text x="230.0" y="351" class="i">2</text><rect x="252" y="356" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="274.0" y="379.0" class="m" style="font-size:17px;fill:#111827">L</text><text x="274.0" y="351" class="i">3</text><rect x="296" y="356" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="318.0" y="379.0" class="m" style="font-size:17px;fill:#111827">E</text><text x="318.0" y="351" class="i">4</text><rect x="340" y="356" width="44" height="44" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="362.0" y="379.0" class="m" style="font-size:17px;fill:#111827">E</text><text x="362.0" y="351" class="i">5</text><text x="108" y="384" class="s r">P</text><path d="M212 410 L212 416 L380 416 L380 410" fill="none" stroke="#475569" stroke-width="1.5"/><text x="394" y="420" class="t">d = m−1−j = 3（j=2 到右端）</text><path d="M124 438 L124 444 L380 444 L380 438" fill="none" stroke="#475569" stroke-width="1.5"/><text x="394" y="448" class="t">bmBc[N] = m−1−i = 5（最右的 N 到右端）</text><text x="20" y="484" class="t">两段距离之差即模式串要右移的位数：shift = 5 − 3 = 2；若差 ≤ 0（规则 2b），改取 1</text></svg>