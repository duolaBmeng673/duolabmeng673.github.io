<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" width="720" height="472" role="img">
  <title>KMP 算法失配右滑过程示例</title>
  <desc>展示主串 S="abaabaabc" 与模式串 T="abaabc" 在 j=5 处失配后，利用 next[5]=2 右滑 3 位并保持主串指针 i=5 不回退的匹配过程。</desc>
  <defs>
    <marker id="kmps-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">失配：S[5]='a' ≠ T[5]='c'；前 5 个字符已匹配，T[0..4]="abaab"</text>

    <text x="130" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">0</text>
    <text x="198" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">1</text>
    <text x="266" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">2</text>
    <text x="334" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">3</text>
    <text x="402" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">4</text>
    <text x="470" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">5</text>
    <text x="538" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">6</text>
    <text x="606" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">7</text>
    <text x="674" y="54" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">8</text>

    <text x="48" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">主串 S</text>
    <rect x="96" y="70" width="612" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="group"/>
    <path d="M97 71 H163 V111 H97 Z" fill="#f0fdfa"/>
    <text x="130" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">a</text>
    <path d="M165 71 H231 V111 H165 Z" fill="#f0fdfa"/>
    <line x1="164" y1="70" x2="164" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="198" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">b</text>
    <path d="M233 71 H299 V111 H233 Z" fill="#f0fdfa"/>
    <line x1="232" y1="70" x2="232" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="266" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">a</text>
    <path d="M301 71 H367 V111 H301 Z" fill="#f0fdfa"/>
    <line x1="300" y1="70" x2="300" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="334" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">a</text>
    <path d="M369 71 H435 V111 H369 Z" fill="#f0fdfa"/>
    <line x1="368" y1="70" x2="368" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="402" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">b</text>
    <path d="M437 71 H503 V111 H437 Z" fill="#fef2f2"/>
    <line x1="436" y1="70" x2="436" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="470" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">a</text>
    <path d="M505 71 H571 V111 H505 Z" fill="#f8fafc"/>
    <line x1="504" y1="70" x2="504" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="538" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">a</text>
    <path d="M573 71 H639 V111 H573 Z" fill="#f8fafc"/>
    <line x1="572" y1="70" x2="572" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="606" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">b</text>
    <path d="M641 71 H707 V111 H641 Z" fill="#f8fafc"/>
    <line x1="640" y1="70" x2="640" y2="112" stroke="#94a3b8" stroke-width="1"/>
    <text x="674" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">c</text>

    <text x="48" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">T(旧)</text>
    <rect x="96" y="120" width="408" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="group"/>
    <path d="M97 121 H163 V161 H97 Z" fill="#eff6ff"/>
    <text x="130" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">a</text>
    <path d="M165 121 H231 V161 H165 Z" fill="#eff6ff"/>
    <line x1="164" y1="120" x2="164" y2="162" stroke="#94a3b8" stroke-width="1"/>
    <text x="198" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">b</text>
    <path d="M233 121 H299 V161 H233 Z" fill="#f8fafc"/>
    <line x1="232" y1="120" x2="232" y2="162" stroke="#94a3b8" stroke-width="1"/>
    <text x="266" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">a</text>
    <path d="M301 121 H367 V161 H301 Z" fill="#f0fdfa"/>
    <line x1="300" y1="120" x2="300" y2="162" stroke="#94a3b8" stroke-width="1"/>
    <text x="334" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">a</text>
    <path d="M369 121 H435 V161 H369 Z" fill="#f0fdfa"/>
    <line x1="368" y1="120" x2="368" y2="162" stroke="#94a3b8" stroke-width="1"/>
    <text x="402" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">b</text>
    <path d="M437 121 H503 V161 H437 Z" fill="#fef2f2"/>
    <line x1="436" y1="120" x2="436" y2="162" stroke="#94a3b8" stroke-width="1"/>
    <text x="470" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">c</text>

    <path d="M104 170 V178 H224 V170" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="164" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">前缀 ab</text>
    <path d="M308 170 V178 H428 V170" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="368" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">后缀 ab</text>
    <text x="470" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">失配 j=5</text>

    <path d="M164 214 V246 H368 V284" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#kmps-a)"/>
    <text x="384" y="264" text-anchor="start" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">next[5] = 2：右滑 j − k = 5 − 2 = 3 位</text>

    <text x="48" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">T(新)</text>
    <rect x="300" y="292" width="408" height="42" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="group"/>
    <path d="M301 293 H367 V333 H301 Z" fill="#f0fdfa"/>
    <text x="334" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">a</text>
    <path d="M369 293 H435 V333 H369 Z" fill="#f0fdfa"/>
    <line x1="368" y1="292" x2="368" y2="334" stroke="#94a3b8" stroke-width="1"/>
    <text x="402" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">b</text>
    <path d="M437 293 H503 V333 H437 Z" fill="#eff6ff"/>
    <line x1="436" y1="292" x2="436" y2="334" stroke="#94a3b8" stroke-width="1"/>
    <text x="470" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">a</text>
    <path d="M505 293 H571 V333 H505 Z" fill="#f8fafc"/>
    <line x1="504" y1="292" x2="504" y2="334" stroke="#94a3b8" stroke-width="1"/>
    <text x="538" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">a</text>
    <path d="M573 293 H639 V333 H573 Z" fill="#f8fafc"/>
    <line x1="572" y1="292" x2="572" y2="334" stroke="#94a3b8" stroke-width="1"/>
    <text x="606" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">b</text>
    <path d="M641 293 H707 V333 H641 Z" fill="#f8fafc"/>
    <line x1="640" y1="292" x2="640" y2="334" stroke="#94a3b8" stroke-width="1"/>
    <text x="674" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">c</text>

    <path d="M308 342 V350 H428 V342" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="368" y="376" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">已对齐，无需再比</text>
    <line x1="470" y1="364" x2="470" y2="340" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#kmps-a)"/>
    <text x="540" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">从 T[2] 继续比 S[5]</text>

    <rect x="8" y="414" width="704" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="444" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">指针 i 始终停在 5，没有回退；只有 j 从 5 变成 2</text>
  </g>
</svg>
