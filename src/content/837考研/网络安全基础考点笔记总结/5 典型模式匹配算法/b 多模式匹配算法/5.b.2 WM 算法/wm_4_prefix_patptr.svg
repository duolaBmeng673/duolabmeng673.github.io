<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" width="720" height="358" role="img">
  <title>Wu-Manber 算法 PAT_PTR、PREFIX 与 HASH 非空项表</title>
  <desc>并排展示 PAT_PTR 完整模式表、PREFIX 前缀哈希表和 HASH 非空入口表，同色关联同一模式并说明搜索过滤与逐字校验顺序。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="123" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">PAT_PTR（编号→串）</text>
    <rect x="8" y="38" width="230" height="228" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="group"/>
    <path d="M9 39 H237 V76 H9 Z" fill="#eff6ff"/>
    <text x="42" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">编号</text>
    <line x1="76" y1="38" x2="76" y2="266" stroke="#94a3b8" stroke-width="1"/>
    <text x="157" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">完整模式串</text>
    <path d="M9 76 H237 V113 H9 Z" fill="#eff6ff"/>
    <line x1="8" y1="76" x2="238" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <text x="42" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">0</text>
    <text x="157" y="101" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">thinner</text>
    <path d="M9 114 H237 V151 H9 Z" fill="#f0fdfa"/>
    <line x1="8" y1="114" x2="238" y2="114" stroke="#94a3b8" stroke-width="1"/>
    <text x="42" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">1</text>
    <text x="157" y="139" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">shining</text>
    <path d="M9 152 H237 V189 H9 Z" fill="#fffbeb"/>
    <line x1="8" y1="152" x2="238" y2="152" stroke="#94a3b8" stroke-width="1"/>
    <text x="42" y="177" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">2</text>
    <text x="157" y="177" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">church</text>
    <path d="M9 190 H237 V227 H9 Z" fill="#fef2f2"/>
    <line x1="8" y1="190" x2="238" y2="190" stroke="#94a3b8" stroke-width="1"/>
    <text x="42" y="215" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">3</text>
    <text x="157" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">touching</text>
    <path d="M9 228 H237 V265 H9 Z" fill="#f8fafc"/>
    <line x1="8" y1="228" x2="238" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <text x="42" y="253" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">4</text>
    <text x="157" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">thinking</text>
    <text x="373" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">PREFIX（前 B′=2 字符）</text>
    <rect x="250" y="38" width="246" height="228" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="group"/>
    <path d="M251 39 H495 V76 H251 Z" fill="#eff6ff"/>
    <text x="284" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">编号</text>
    <line x1="318" y1="38" x2="318" y2="266" stroke="#94a3b8" stroke-width="1"/>
    <text x="364" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">前2字</text>
    <line x1="410" y1="38" x2="410" y2="266" stroke="#94a3b8" stroke-width="1"/>
    <text x="453" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">hash</text>
    <path d="M251 76 H495 V113 H251 Z" fill="#eff6ff"/>
    <line x1="250" y1="76" x2="496" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <text x="284" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">0</text>
    <text x="364" y="101" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">th</text>
    <text x="453" y="101" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">26</text>
    <path d="M251 114 H495 V151 H251 Z" fill="#f0fdfa"/>
    <line x1="250" y1="114" x2="496" y2="114" stroke="#94a3b8" stroke-width="1"/>
    <text x="284" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">1</text>
    <text x="364" y="139" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">sh</text>
    <text x="453" y="139" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">25</text>
    <path d="M251 152 H495 V189 H251 Z" fill="#fffbeb"/>
    <line x1="250" y1="152" x2="496" y2="152" stroke="#94a3b8" stroke-width="1"/>
    <text x="284" y="177" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">2</text>
    <text x="364" y="177" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">ch</text>
    <text x="453" y="177" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">9</text>
    <path d="M251 190 H495 V227 H251 Z" fill="#fef2f2"/>
    <line x1="250" y1="190" x2="496" y2="190" stroke="#94a3b8" stroke-width="1"/>
    <text x="284" y="215" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">3</text>
    <text x="364" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">to</text>
    <text x="453" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">4</text>
    <path d="M251 228 H495 V265 H251 Z" fill="#f8fafc"/>
    <line x1="250" y1="228" x2="496" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <text x="284" y="253" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">4</text>
    <text x="364" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">th</text>
    <text x="453" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">26</text>
    <text x="610" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">HASH 非空项</text>
    <rect x="508" y="38" width="204" height="228" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="group"/>
    <path d="M509 39 H711 V76 H509 Z" fill="#eff6ff"/>
    <text x="555" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">hash</text>
    <line x1="602" y1="38" x2="602" y2="266" stroke="#94a3b8" stroke-width="1"/>
    <text x="657" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">模式编号</text>
    <path d="M509 76 H711 V113 H509 Z" fill="#fffbeb"/>
    <line x1="508" y1="76" x2="712" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <text x="555" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">9</text>
    <text x="657" y="101" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">P2</text>
    <path d="M509 114 H711 V151 H509 Z" fill="#fef2f2"/>
    <line x1="508" y1="114" x2="712" y2="114" stroke="#94a3b8" stroke-width="1"/>
    <text x="555" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">15</text>
    <text x="657" y="139" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">P3</text>
    <path d="M509 152 H711 V189 H509 Z" fill="#eff6ff"/>
    <line x1="508" y1="152" x2="712" y2="152" stroke="#94a3b8" stroke-width="1"/>
    <text x="555" y="177" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">17</text>
    <text x="657" y="177" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">P0</text>
    <path d="M509 190 H711 V227 H509 Z" fill="#f8fafc"/>
    <line x1="508" y1="190" x2="712" y2="190" stroke="#94a3b8" stroke-width="1"/>
    <text x="555" y="215" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">18</text>
    <text x="657" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">P4</text>
    <path d="M509 228 H711 V265 H509 Z" fill="#f0fdfa"/>
    <line x1="508" y1="228" x2="712" y2="228" stroke="#94a3b8" stroke-width="1"/>
    <text x="555" y="253" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">21</text>
    <text x="657" y="253" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">P1</text>
    <rect x="8" y="282" width="704" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="308" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">HASH[h] → 候选编号 → PREFIX[编号] 与窗口前缀 hash 比较 → PAT_PTR[编号] 逐字比对</text>
    <text x="360" y="334" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">PAT_PTR 存未截断原模式串（如 thinner）；同色行代表同一模式</text>
  </g>
</svg>
