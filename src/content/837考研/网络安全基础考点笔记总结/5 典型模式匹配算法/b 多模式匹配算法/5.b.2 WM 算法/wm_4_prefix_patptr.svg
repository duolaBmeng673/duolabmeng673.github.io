-anchor="middle" dominant-baseline="central">P1</text><text x="20" y="286" font-size="12" fill="#6b7280" text-anchor="start" dominant-baseline="central">HASH[h] → 候选模式编号 → PREFIX[编号] 与窗口前缀 hash 比较（过滤）→ PAT_PTR[编号] 取出完整模式串逐字比较</text><text x="20" y="306" font-size="12" fill="#6b7280" text-anchor="start" dominant-baseline="central">PAT_PTR 存的是未截断的原模式串（如 thinner）；行颜色相同 = 同一个模式</text></svg>