<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 575" width="720" height="575" role="img">
  <title>Wu-Manber 算法模式截断与分块哈希示例</title>
  <desc>展示 5 个模式串按最短模式长度 m=6 截断、按块大小 B=2 切分并取字母序号和 mod 29 的哈希计算过程。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">m=6（最短 church），B=2；hash(xy) = (x序号 + y序号) mod 29（a=0 … z=25）</text>
    <text x="175" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">q=2 (m−q=4)</text>
    <text x="295" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">q=3 (m−q=3)</text>
    <text x="415" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">q=4 (m−q=2)</text>
    <text x="535" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">q=5 (m−q=1)</text>
    <text x="655" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">q=6 (m−q=0)</text>
    <rect x="8" y="70" width="104" height="86" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="104" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">P0</text>
    <text x="60" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">thinne<tspan fill="#4b5563" font-weight="400">r</tspan></text>
    <rect x="118" y="70" width="114" height="86" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="175" y="97" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">th</text>
    <text x="175" y="119" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">19+7=26</text>
    <text x="175" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">h = 26</text>
    <rect x="238" y="70" width="114" height="86" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="295" y="97" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">hi</text>
    <text x="295" y="119" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">7+8=15</text>
    <text x="295" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">h = 15</text>
    <rect x="358" y="70" width="114" height="86" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="415" y="97" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">in</text>
    <text x="415" y="119" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">8+13=21</text>
    <text x="415" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">h = 21</text>
    <rect x="478" y="70" width="114" height="86" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="535" y="97" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">nn</text>
    <text x="535" y="119" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">13+13=26</text>
    <text x="535" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">h = 26</text>
    <rect x="598" y="70" width="114" height="86" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="655" y="97" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">ne</text>
    <text x="655" y="119" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">13+4=17</text>
    <text x="655" y="141" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">h = 17</text>
    <rect x="8" y="166" width="104" height="86" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="60" y="200" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">P1</text>
    <text x="60" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">shinin<tspan fill="#4b5563" font-weight="400">g</tspan></text>
    <rect x="118" y="166" width="114" height="86" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="175" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">sh</text>
    <text x="175" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">18+7=25</text>
    <text x="175" y="237" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">h = 25</text>
    <rect x="238" y="166" width="114" height="86" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="295" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">hi</text>
    <text x="295" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">7+8=15</text>
    <text x="295" y="237" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">h = 15</text>
    <rect x="358" y="166" width="114" height="86" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="415" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">in</text>
    <text x="415" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">8+13=21</text>
    <text x="415" y="237" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">h = 21</text>
    <rect x="478" y="166" width="114" height="86" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="535" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">ni</text>
    <text x="535" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">13+8=21</text>
    <text x="535" y="237" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">h = 21</text>
    <rect x="598" y="166" width="114" height="86" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="655" y="193" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">in</text>
    <text x="655" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">8+13=21</text>
    <text x="655" y="237" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">h = 21</text>
    <rect x="8" y="262" width="104" height="86" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="296" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">P2</text>
    <text x="60" y="324" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">church</text>
    <rect x="118" y="262" width="114" height="86" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="175" y="289" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">ch</text>
    <text x="175" y="311" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">2+7=9</text>
    <text x="175" y="333" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">h = 9</text>
    <rect x="238" y="262" width="114" height="86" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="295" y="289" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">hu</text>
    <text x="295" y="311" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">7+20=27</text>
    <text x="295" y="333" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">h = 27</text>
    <rect x="358" y="262" width="114" height="86" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="415" y="289" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">ur</text>
    <text x="415" y="311" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">20+17=37</text>
    <text x="415" y="333" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">h = 8</text>
    <rect x="478" y="262" width="114" height="86" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="535" y="289" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">rc</text>
    <text x="535" y="311" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">17+2=19</text>
    <text x="535" y="333" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">h = 19</text>
    <rect x="598" y="262" width="114" height="86" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="655" y="289" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">ch</text>
    <text x="655" y="311" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">2+7=9</text>
    <text x="655" y="333" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">h = 9</text>
    <rect x="8" y="358" width="104" height="86" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="60" y="392" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">P3</text>
    <text x="60" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">touchi<tspan fill="#4b5563" font-weight="400">ng</tspan></text>
    <rect x="118" y="358" width="114" height="86" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="175" y="385" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">to</text>
    <text x="175" y="407" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">19+14=33</text>
    <text x="175" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">h = 4</text>
    <rect x="238" y="358" width="114" height="86" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="295" y="385" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">ou</text>
    <text x="295" y="407" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">14+20=34</text>
    <text x="295" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">h = 5</text>
    <rect x="358" y="358" width="114" height="86" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="415" y="385" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">uc</text>
    <text x="415" y="407" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">20+2=22</text>
    <text x="415" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">h = 22</text>
    <rect x="478" y="358" width="114" height="86" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="535" y="385" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">ch</text>
    <text x="535" y="407" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">2+7=9</text>
    <text x="535" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">h = 9</text>
    <rect x="598" y="358" width="114" height="86" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="655" y="385" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">hi</text>
    <text x="655" y="407" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">7+8=15</text>
    <text x="655" y="429" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">h = 15</text>
    <rect x="8" y="454" width="104" height="86" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="60" y="488" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">P4</text>
    <text x="60" y="516" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">thinki<tspan fill="#4b5563" font-weight="400">ng</tspan></text>
    <rect x="118" y="454" width="114" height="86" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="175" y="481" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">th</text>
    <text x="175" y="503" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">19+7=26</text>
    <text x="175" y="525" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">h = 26</text>
    <rect x="238" y="454" width="114" height="86" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="295" y="481" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">hi</text>
    <text x="295" y="503" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">7+8=15</text>
    <text x="295" y="525" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">h = 15</text>
    <rect x="358" y="454" width="114" height="86" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="415" y="481" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">in</text>
    <text x="415" y="503" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">8+13=21</text>
    <text x="415" y="525" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">h = 21</text>
    <rect x="478" y="454" width="114" height="86" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="535" y="481" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">nk</text>
    <text x="535" y="503" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">13+10=23</text>
    <text x="535" y="525" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">h = 23</text>
    <rect x="598" y="454" width="114" height="86" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="655" y="481" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">ki</text>
    <text x="655" y="503" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">10+8=18</text>
    <text x="655" y="525" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">h = 18</text>
    <text x="360" y="562" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">粗边框（q=6, m−q=0）= 模式最后 B 个字符（决定 HASH 入口）；灰色后缀为截去部分</text>
