<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" width="720" height="650" role="img">
  <title>Wu-Manber 四张表搜索阶段协作流程</title>
  <desc>展示搜索阶段文本窗口如何依次查 SHIFT、判断 SHIFT>0 跳移、若为 0 则算前缀哈希查 HASH 并用 PREFIX 过滤，最后查 PAT_PTR 逐字验证。</desc>
  <defs>
    <marker id="wm5-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="wm5-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="wm5-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="116" y="8" width="336" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="284" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">取文本窗口末 B 字符 X</text>
    <text x="284" y="58" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">h = hash(X)，文本指针 pos 从 m 开始</text>
    <line x1="284" y1="72" x2="284" y2="96" stroke="#1f2937" stroke-width="1.5" marker-end="url(#wm5-k)"/>

    <rect x="116" y="100" width="336" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="284" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">查 SHIFT[h]</text>
    <text x="284" y="150" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">得到可安全跳过的字符数</text>
    <line x1="284" y1="164" x2="284" y2="188" stroke="#1f2937" stroke-width="1.5" marker-end="url(#wm5-k)"/>

    <polygon points="284,192 424,232 284,272 144,232" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="284" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">SHIFT[h] &gt; 0 ?</text>

    <line x1="424" y1="232" x2="496" y2="232" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#wm5-a)"/>
    <text x="460" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">是</text>
    <rect x="500" y="200" width="212" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="606" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">文本指针右移</text>
    <text x="606" y="250" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">SHIFT[h] 位</text>
    <path d="M606 200 V40 H458" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#wm5-a)"/>

    <line x1="284" y1="272" x2="284" y2="304" stroke="#1f2937" stroke-width="1.5" marker-end="url(#wm5-k)"/>
    <text x="300" y="292" text-anchor="start" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">否（= 0）</text>

    <rect x="116" y="308" width="336" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="284" y="334" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">算窗口前缀 hash</text>
    <text x="284" y="358" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">窗口起点向右取 B′ = 2 个字符</text>
    <line x1="284" y1="372" x2="284" y2="396" stroke="#1f2937" stroke-width="1.5" marker-end="url(#wm5-k)"/>

    <rect x="116" y="400" width="336" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="284" y="426" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">查 HASH[h]，比 PREFIX</text>
    <text x="284" y="450" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">前缀 hash 不等的候选被淘汰</text>
    <line x1="284" y1="464" x2="284" y2="488" stroke="#1f2937" stroke-width="1.5" marker-end="url(#wm5-k)"/>

    <rect x="116" y="492" width="336" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="284" y="518" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">查 PAT_PTR，逐字比较</text>
    <text x="284" y="542" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">完全一致则输出该模式</text>
    <line x1="284" y1="556" x2="284" y2="574" stroke="#1f2937" stroke-width="1.5" marker-end="url(#wm5-k)"/>

    <rect x="116" y="578" width="336" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="284" y="604" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">文本指针右移 1 位</text>
    <text x="284" y="628" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">无论是否匹配都右移 1</text>

    <path d="M452 432 H530 V610 H458" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#wm5-r)"/>
    <text x="544" y="520" text-anchor="start" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">前缀不等（淘汰）</text>

    <path d="M116 610 H9 V40 H110" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#wm5-k)"/>
  </g>
</svg>
