<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img">
  <title>UDP 套接字（SOCK_DGRAM）编程流程图</title>
  <desc>对比 UDP 客户端与服务器端的套接字调用顺序，展示无握手下的请求与应答数据报交互以及阻塞 recvfrom 循环服务机制。</desc>
  <defs>
    <marker id="socket-udp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="120" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">客户端 CLIENT</text>
    <text x="524" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">服务器 SERVER</text>

    <!-- Client boxes (x=8..232, w=224) -->
    <g stroke-width="1.5">
      <rect x="8" y="44" width="224" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="8" y="176" width="224" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="8" y="242" width="224" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="8" y="308" width="224" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600">
      <text x="120" y="72" fill="#1e40af">s = socket(SOCK_DGRAM)</text>
      <text x="120" y="204" fill="#1e40af">sendto(s, ...)</text>
      <text x="120" y="270" fill="#92400e">recvfrom(s, ...) *</text>
      <text x="120" y="336" fill="#1e40af">closesocket(s)</text>
    </g>

    <!-- Server boxes (x=412..636, w=224) -->
    <g stroke-width="1.5">
      <rect x="412" y="44" width="224" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="412" y="110" width="224" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="412" y="176" width="224" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="412" y="242" width="224" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600">
      <text x="524" y="72" fill="#115e59">s = socket(SOCK_DGRAM)</text>
      <text x="524" y="138" fill="#115e59">bind(s, 端口)</text>
      <text x="524" y="204" fill="#92400e">recvfrom(s, ...) *</text>
      <text x="524" y="270" fill="#115e59">sendto(s, ...)</text>
    </g>

    <g stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-udp-arrow)">
      <line x1="120" y1="88" x2="120" y2="172"/>
      <line x1="120" y1="220" x2="120" y2="238"/>
      <line x1="120" y1="286" x2="120" y2="304"/>
      <line x1="524" y1="88" x2="524" y2="106"/>
      <line x1="524" y1="154" x2="524" y2="172"/>
      <line x1="524" y1="220" x2="524" y2="238"/>
    </g>

    <!-- Server loop arrow -->
    <path d="M636 264 H668 V198 H640" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-udp-arrow)"/>
    <text x="678" y="226" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">循环</text>
    <text x="678" y="248" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">服务</text>

    <!-- Cross arrows -->
    <line x1="232" y1="198" x2="408" y2="198" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#socket-udp-arrow)"/>
    <text x="322" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">① 请求数据报</text>
    <text x="322" y="185" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">(无握手)</text>

    <line x1="412" y1="264" x2="236" y2="264" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#socket-udp-arrow)"/>
    <text x="322" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">② 应答数据报</text>

    <rect x="8" y="362" width="704" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="389" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">黄色带 * 为阻塞调用；无 connect / listen / accept，一个套接字即可服务所有客户</text>
  </g>
</svg>
