<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 760 455" width="760" height="455" role="img">
  <title>UDP 套接字（SOCK_DGRAM）编程流程图</title>
  <desc>对比 UDP 客户端与服务器端的套接字调用顺序，展示无握手下的请求与应答数据报交互以及阻塞 recvfrom 循环服务机制。</desc>
  <defs>
    <marker id="socket-udp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">UDP 套接字（SOCK_DGRAM）编程流程</text>

    <text x="140" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">客户端 CLIENT</text>
    <text x="532" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">服务器 SERVER</text>

    <!-- Client boxes (x=40..240, w=200) -->
    <g stroke-width="1.5">
      <rect x="40" y="92" width="200" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="40" y="212" width="200" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="40" y="272" width="200" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="40" y="332" width="200" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    </g>
    <g text-anchor="middle" font-size="12" font-weight="600">
      <text x="140" y="115" fill="#1e40af">s = socket(SOCK_DGRAM)</text>
      <text x="140" y="235" fill="#1e40af">sendto(s, ...)</text>
      <text x="140" y="295" fill="#92400e">recvfrom(s, ...) *</text>
      <text x="140" y="355" fill="#1e40af">closesocket(s)</text>
    </g>

    <!-- Server boxes (x=432..632, w=200) -->
    <g stroke-width="1.5">
      <rect x="432" y="92" width="200" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="432" y="152" width="200" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="432" y="212" width="200" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="432" y="272" width="200" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
    </g>
    <g text-anchor="middle" font-size="12" font-weight="600">
      <text x="532" y="115" fill="#115e59">s = socket(SOCK_DGRAM)</text>
      <text x="532" y="175" fill="#115e59">bind(s, 端口)</text>
      <text x="532" y="235" fill="#92400e">recvfrom(s, ...) *</text>
      <text x="532" y="295" fill="#115e59">sendto(s, ...)</text>
    </g>

    <!-- Vertical arrows -->
    <g stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-udp-arrow)">
      <line x1="140" y1="128" x2="140" y2="208"/>
      <line x1="140" y1="248" x2="140" y2="268"/>
      <line x1="140" y1="308" x2="140" y2="328"/>
      <line x1="532" y1="128" x2="532" y2="148"/>
      <line x1="532" y1="188" x2="532" y2="208"/>
      <line x1="532" y1="248" x2="532" y2="268"/>
    </g>

    <!-- Server loop arrow -->
    <path d="M632 290 H676 V230 H636" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-udp-arrow)"/>
    <text x="688" y="254" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">循环</text>
    <text x="688" y="274" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">服务</text>

    <!-- Cross arrows -->
    <line x1="240" y1="230" x2="428" y2="230" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#socket-udp-arrow)"/>
    <text x="336" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">① 请求数据报（无握手）</text>

    <line x1="432" y1="290" x2="244" y2="290" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#socket-udp-arrow)"/>
    <text x="336" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">② 应答数据报</text>

    <!-- Bottom note block -->
    <rect x="24" y="392" width="712" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="417" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">黄色带 * 为阻塞调用；无 connect / listen / accept，一个套接字即可服务所有客户</text>
  </g>
</svg>
