<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" width="720" height="568" role="img">
  <title>TCP 套接字（SOCK_STREAM）编程流程图</title>
  <desc>展示 TCP 客户端与服务器端的套接字建立、监听、三次握手阻塞连接、请求响应收发及关闭流程。</desc>
  <defs>
    <marker id="socket-tcp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="112" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">客户端 CLIENT</text>
    <text x="524" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">服务器 SERVER</text>

    <!-- Client boxes (x=8..216, w=208) -->
    <g stroke-width="1.5">
      <rect x="8" y="44" width="208" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="8" y="102" width="208" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
      <rect x="8" y="218" width="208" height="72" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="8" y="308" width="208" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="8" y="366" width="208" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="8" y="424" width="208" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600">
      <text x="112" y="71" fill="#1e40af">s = socket()</text>
      <text x="112" y="129" fill="#4b5563">bind()（可选）</text>
      <text x="112" y="260" fill="#92400e">connect(s) *</text>
      <text x="112" y="335" fill="#1e40af">send(s)</text>
      <text x="112" y="393" fill="#92400e">recv(s) *</text>
      <text x="112" y="451" fill="#1e40af">closesocket(s)</text>
    </g>

    <!-- Server boxes (x=420..628, w=208) -->
    <g stroke-width="1.5">
      <rect x="420" y="44" width="208" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="420" y="102" width="208" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="420" y="160" width="208" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="420" y="218" width="208" height="72" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="420" y="308" width="208" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="420" y="366" width="208" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="420" y="424" width="208" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600">
      <text x="524" y="71" fill="#115e59">s = socket()</text>
      <text x="524" y="129" fill="#115e59">bind(s)</text>
      <text x="524" y="187" fill="#115e59">listen(s)</text>
      <text x="524" y="260" fill="#92400e">ns = accept(s) *</text>
      <text x="524" y="335" fill="#92400e">recv(ns) *</text>
      <text x="524" y="393" fill="#115e59">send(ns)</text>
      <text x="524" y="451" fill="#115e59">closesocket(ns)</text>
    </g>

    <g stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-tcp-arrow)">
      <line x1="112" y1="86" x2="112" y2="98"/>
      <line x1="112" y1="144" x2="112" y2="214"/>
      <line x1="112" y1="290" x2="112" y2="304"/>
      <line x1="112" y1="350" x2="112" y2="362"/>
      <line x1="112" y1="408" x2="112" y2="420"/>

      <line x1="524" y1="86" x2="524" y2="98"/>
      <line x1="524" y1="144" x2="524" y2="156"/>
      <line x1="524" y1="202" x2="524" y2="214"/>
      <line x1="524" y1="290" x2="524" y2="304"/>
      <line x1="524" y1="350" x2="524" y2="362"/>
      <line x1="524" y1="408" x2="524" y2="420"/>
    </g>

    <path d="M628 445 H656 V254 H632" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-tcp-arrow)"/>
    <text x="664" y="320" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">循环：</text>
    <text x="664" y="342" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">处理</text>
    <text x="664" y="364" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">下一个</text>
    <text x="664" y="386" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">客户</text>

    <!-- Cross arrows (well spaced inside y=218..290) -->
    <line x1="216" y1="234" x2="416" y2="234" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#socket-tcp-arrow)"/>
    <text x="318" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">① 连接请求（SYN）</text>

    <line x1="420" y1="280" x2="220" y2="280" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#socket-tcp-arrow)"/>
    <text x="318" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">连接确认（三次握手）</text>

    <line x1="216" y1="329" x2="416" y2="329" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#socket-tcp-arrow)"/>
    <text x="318" y="317" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">② 发送请求</text>

    <line x1="420" y1="387" x2="220" y2="387" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#socket-tcp-arrow)"/>
    <text x="318" y="375" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">③ 接收响应</text>

    <rect x="8" y="490" width="704" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="518" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">黄色带 * 为阻塞调用；虚线框可选</text>
    <text x="360" y="544" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">WinSock 下两端首尾各调用一次 WSAStartup / WSACleanup</text>
  </g>
</svg>
