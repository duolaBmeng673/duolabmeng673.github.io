<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316" role="img">
  <title>原始套接字（SOCK_RAW）协议栈路径</title>
  <desc>对比普通流式/数据报套接字经过传输层与原始套接字绕过传输层直接访问 IP 与 ICMP 报文的协议栈路径。</desc>
  <defs>
    <marker id="socket-raw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Left: Normal TCP/UDP (x=8..296, w=288) -->
    <rect x="8" y="8" width="288" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="152" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">应用程序</text>
    <text x="152" y="58" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">（SOCK_STREAM / DGRAM）</text>

    <rect x="8" y="96" width="288" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="152" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">传输层（TCP / UDP，有端口）</text>

    <rect x="8" y="168" width="288" height="48" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="152" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">网络层（IP 数据报）</text>

    <line x1="152" y1="72" x2="152" y2="92" stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-raw-arrow)"/>
    <line x1="152" y1="144" x2="152" y2="164" stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-raw-arrow)"/>

    <!-- Right: SOCK_RAW (x=316..596, w=280) -->
    <rect x="316" y="8" width="280" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="456" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">应用程序</text>
    <text x="456" y="58" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">（SOCK_RAW，需 root）</text>

    <rect x="316" y="96" width="280" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="456" y="126" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">绕过 TCP / UDP（无端口概念）</text>

    <rect x="316" y="168" width="280" height="48" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="456" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">直接访问 IP / ICMP 报文</text>

    <path d="M596 40 H620 V192 H600" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#socket-raw-arrow)"/>
    <text x="632" y="110" text-anchor="start" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">绕过传输层</text>
    <text x="632" y="134" text-anchor="start" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">直达 IP 层</text>

    <rect x="8" y="240" width="704" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="268" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">接收时包含 IP 首部（20 B 起），需先跳过 IP 首部再解析 ICMP 等上层数据</text>
    <text x="360" y="294" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">适合 Ping、Traceroute、自定义协议与抓包分析等工具开发</text>
  </g>
</svg>
