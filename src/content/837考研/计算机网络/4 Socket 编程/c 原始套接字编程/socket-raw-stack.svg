<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" role="img">
  <title>原始套接字（SOCK_RAW）协议栈路径</title>
  <desc>对比普通流式/数据报套接字经过传输层与原始套接字绕过传输层直接访问 IP 与 ICMP 报文的协议栈路径。</desc>
  <defs>
    <marker id="socket-raw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">原始套接字（SOCK_RAW）协议栈路径</text>

    <!-- Left: Normal TCP/UDP (x=24..320, w=296) -->
    <rect x="24" y="76" width="296" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="172" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">应用程序（SOCK_STREAM / DGRAM）</text>

    <rect x="24" y="144" width="296" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="172" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">传输层（TCP / UDP，有端口）</text>

    <rect x="24" y="212" width="296" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="172" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">网络层（IP 数据报）</text>

    <line x1="172" y1="120" x2="172" y2="140" stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-raw-arrow)"/>
    <line x1="172" y1="188" x2="172" y2="208" stroke="#1f2937" stroke-width="1.5" marker-end="url(#socket-raw-arrow)"/>

    <!-- Right: SOCK_RAW (x=340..620, w=280) -->
    <rect x="340" y="76" width="280" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="480" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">应用程序（SOCK_RAW，需 root）</text>

    <rect x="340" y="144" width="280" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="480" y="171" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">绕过 TCP / UDP（无端口概念）</text>

    <rect x="340" y="212" width="280" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="480" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">直接访问 IP / ICMP 报文</text>

    <!-- Orthogonal bypass route strictly outside the right edge -->
    <path d="M620 98 H648 V234 H624" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#socket-raw-arrow)"/>
    <text x="660" y="160" text-anchor="start" font-size="12" font-weight="600" fill="#991b1b">绕过传输层</text>
    <text x="660" y="180" text-anchor="start" font-size="12" font-weight="600" fill="#991b1b">直达 IP 层</text>

    <!-- Bottom note block -->
    <rect x="24" y="272" width="712" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="293" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">接收时包含 IP 首部（20 B 起），需先跳过 IP 首部再解析 ICMP 等上层数据</text>
  </g>
</svg>
