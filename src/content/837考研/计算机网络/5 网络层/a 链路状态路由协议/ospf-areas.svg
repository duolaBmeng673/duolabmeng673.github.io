<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" width="720" height="504" role="img">
  <title>OSPF 自治系统层次区域划分示意图</title>
  <desc>展示 OSPF 自治系统 AS 内主干区域 0.0.0.0 与三个普通区域（0.0.0.1、0.0.0.2、0.0.0.3）的层次划分，以及主干路由器、区域边界路由器 ABR（R₃、R₄、R₇）与自治系统边界路由器 ASBR（R₆）。</desc>
  <defs>
    <marker id="ospf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- External AS arrow above outer AS box -->
    <line x1="484" y1="114" x2="484" y2="16" stroke="#ef4444" stroke-width="2"/>
    <line x1="484" y1="16" x2="532" y2="16" stroke="#ef4444" stroke-width="2" marker-end="url(#ospf-arrow)"/>
    <text x="542" y="22" text-anchor="start" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">至其他自治系统（AS）</text>

    <!-- Outer AS group -->
    <rect x="8" y="44" width="704" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" data-role="group"/>
    <text x="24" y="72" text-anchor="start" font-size="15" font-weight="600" fill="#1f2937">自治系统 AS</text>

    <!-- Backbone area 0.0.0.0 -->
    <rect x="148" y="56" width="424" height="114" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" data-role="group"/>
    <text x="164" y="82" text-anchor="start" font-size="15" font-weight="600" fill="#1e40af">主干区域 0.0.0.0（Backbone Area）</text>

    <!-- Sub-areas -->
    <rect x="20" y="190" width="216" height="202" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="group"/>
    <text x="128" y="378" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">区域 0.0.0.1</text>

    <rect x="252" y="190" width="216" height="202" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="group"/>
    <text x="360" y="378" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">区域 0.0.0.2</text>

    <rect x="484" y="190" width="216" height="202" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="group"/>
    <text x="592" y="378" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">区域 0.0.0.3</text>

    <!-- Orthogonal router & network links -->
    <g stroke="#4b5563" stroke-width="1.5" fill="none">
      <line x1="236" y1="130" x2="484" y2="130"/>
      <path d="M236 130 V156 H184 V190"/>
      <line x1="360" y1="130" x2="360" y2="190"/>
      <path d="M484 130 V156 H536 V190"/>

      <!-- Area 1 -->
      <path d="M184 190 V222 H172 V328 H68 V256 H172"/>
      <!-- Area 2 -->
      <line x1="360" y1="190" x2="360" y2="328"/>
      <line x1="300" y1="328" x2="420" y2="328"/>
      <!-- Area 3 -->
      <path d="M536 190 V256 H652 V328 H544 V256"/>
    </g>

    <!-- Network pills (w=72, h=40) -->
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1">
      <rect x="32" y="236" width="72" height="40" rx="8"/>
      <rect x="136" y="236" width="72" height="40" rx="8"/>
      <rect x="324" y="236" width="72" height="40" rx="8"/>
      <rect x="508" y="236" width="72" height="40" rx="8"/>
      <rect x="508" y="308" width="72" height="40" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">
      <text x="68" y="262">网 1</text>
      <text x="172" y="262">网 2</text>
      <text x="360" y="262">网 4</text>
      <text x="544" y="262">网 6</text>
      <text x="544" y="334">网 8</text>
    </g>

    <!-- Internal & Backbone Routers (r=18) -->
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
      <circle cx="68" cy="328" r="18"/>
      <circle cx="172" cy="328" r="18"/>
      <circle cx="300" cy="328" r="18"/>
      <circle cx="420" cy="328" r="18"/>
      <circle cx="652" cy="256" r="18"/>
    </g>
    <g fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5">
      <circle cx="236" cy="130" r="18"/>
      <circle cx="360" cy="130" r="18"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">
      <text x="68" y="334">R₁</text>
      <text x="172" y="334">R₂</text>
      <text x="300" y="334">R₈</text>
      <text x="420" y="334">R₉</text>
      <text x="652" y="262">R₁₀</text>
      <text x="236" y="136" fill="#1e40af">R₅</text>
      <text x="360" y="136" fill="#1e40af">R₁₁</text>
    </g>

    <!-- ABRs (R3, R4, R7) amber -->
    <g fill="#fffbeb" stroke="#f59e0b" stroke-width="2">
      <circle cx="184" cy="190" r="18"/>
      <circle cx="360" cy="190" r="18"/>
      <circle cx="536" cy="190" r="18"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">
      <text x="184" y="196">R₃</text>
      <text x="360" y="196">R₄</text>
      <text x="536" y="196">R₇</text>
    </g>

    <!-- ASBR (R6) red -->
    <circle cx="484" cy="130" r="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="484" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">R₆</text>

    <rect x="8" y="424" width="704" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="452" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">蓝：主干路由器（含 R₅、R₁₁ 及各 ABR） ｜ 黄：区域边界路由器 ABR（R₃、R₄、R₇）</text>
    <text x="360" y="478" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">红：自治系统边界路由器 ASBR（R₆）</text>
  </g>
</svg>
