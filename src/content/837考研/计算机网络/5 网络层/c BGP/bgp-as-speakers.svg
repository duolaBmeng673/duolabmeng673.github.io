<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" width="720" height="476" role="img">
  <title>BGP 发言人、自治系统 AS 关系与路径向量交换</title>
  <desc>左侧展示不同自治系统 AS 间的 BGP 发言人建立 TCP 会话，右侧展示路径向量通过记录经过的 AS 序列来避免路由环路。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Left group (a) (x=8..308, w=300) -->
    <rect x="8" y="8" width="300" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="22" y="36" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(a) BGP 发言人建 TCP 会话</text>

    <rect x="20" y="56" width="114" height="114" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" data-role="group"/>
    <text x="54" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">AS₁</text>
    <text x="58" y="110" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">运行 IGP</text>

    <rect x="182" y="56" width="114" height="114" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5" data-role="group"/>
    <text x="260" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">AS₂</text>
    <text x="256" y="110" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">运行 IGP</text>

    <rect x="44" y="216" width="228" height="92" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" data-role="group"/>
    <text x="158" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">AS₃（运行 IGP）</text>

    <g stroke="#1f2937" stroke-width="2" fill="none">
      <line x1="118" y1="138" x2="198" y2="138"/>
      <line x1="100" y1="156" x2="100" y2="230"/>
      <line x1="216" y1="156" x2="216" y2="230"/>
    </g>
    <text x="158" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">TCP</text>

    <circle cx="100" cy="138" r="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="100" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">S₁</text>

    <circle cx="216" cy="138" r="18" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="216" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">S₂</text>

    <circle cx="100" cy="248" r="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="100" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">S₃</text>

    <circle cx="216" cy="248" r="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="216" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">S₄</text>

    <text x="158" y="334" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">S₁~S₄ 为各 AS 的 BGP 发言人</text>
    <text x="158" y="356" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">（互为邻站，通过 eBGP 交换）</text>

    <!-- Right group (b) (x=320..712, w=392) -->
    <rect x="320" y="8" width="392" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="336" y="36" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(b) 路径向量防环通告示例</text>

    <g stroke="#4b5563" stroke-width="1.5" fill="none">
      <path d="M388 190 V168 H460"/>
      <path d="M388 254 V288 H460"/>
      <path d="M586 156 H598 V100 H608"/>
      <path d="M586 184 H598 V194 H608"/>
      <line x1="586" y1="288" x2="608" y2="288"/>
    </g>

    <rect x="332" y="54" width="196" height="64" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1"/>
    <text x="430" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">① AS₂ 通知 AS₁：</text>
    <text x="430" y="102" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">N₁~N₄ 可经 (AS₂)</text>

    <rect x="332" y="190" width="114" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="389" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">主干网 AS₁</text>
    <text x="389" y="240" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">BGP 发言人</text>

    <rect x="460" y="138" width="126" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="523" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">地区 ISP AS₂</text>
    <text x="523" y="188" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">BGP 发言人</text>

    <rect x="460" y="256" width="126" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="523" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">地区 ISP AS₃</text>
    <text x="523" y="306" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">BGP 发言人</text>

    <rect x="608" y="64" width="92" height="72" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="654" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">AS₄</text>
    <text x="654" y="114" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">N₁, N₂</text>

    <rect x="608" y="158" width="92" height="72" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="654" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">AS₅</text>
    <text x="654" y="208" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">N₃, N₄</text>

    <rect x="608" y="252" width="92" height="72" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="654" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">AS₆</text>
    <text x="654" y="302" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">N₅</text>

    <rect x="8" y="384" width="704" height="84" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1" data-role="note"/>
    <text x="360" y="414" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">② 主干网 AS₁ 再向 AS₃ 通告：到达 N₁~N₄ 可沿路径 (AS₁, AS₂)</text>
    <text x="360" y="446" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">路径中记录经过的 AS 序列，若含自身 AS 编号则丢弃，避免环路</text>
  </g>
</svg>
