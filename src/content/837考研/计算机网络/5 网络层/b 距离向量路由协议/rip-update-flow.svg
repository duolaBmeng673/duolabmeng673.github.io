<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img">
  <title>RIP 距离向量更新流程与路由更新规则</title>
  <desc>展示路由器收到邻居 X 的 RIP 报文后的距离加 1 与逐项比对三种更新分支、180 秒超时置 16 跳不可达规则，以及 RIP 的三要素与优缺点。</desc>
  <defs>
    <marker id="rip-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Step 1 -->
    <rect x="8" y="8" width="192" height="108" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="104" y="38" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">① 修改收到报文</text>
    <text x="104" y="66" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">下一跳全部改为 X</text>
    <text x="104" y="92" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">所有“距离”字段 + 1</text>

    <line x1="200" y1="62" x2="212" y2="62" stroke="#1f2937" stroke-width="1.5" marker-end="url(#rip-flow-arrow)"/>

    <!-- Step 2 -->
    <rect x="216" y="8" width="192" height="108" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="312" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">② 逐项比对目的网络 N</text>
    <text x="312" y="76" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">判断原路由表情况</text>

    <path d="M408 42 H424 V44 H440" fill="none" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#rip-flow-arrow)"/>
    <path d="M408 62 H424 V134 H440" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#rip-flow-arrow)"/>
    <path d="M408 82 H424 V224 H440" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#rip-flow-arrow)"/>

    <!-- Case A -->
    <rect x="444" y="8" width="268" height="72" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="578" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">无目的网络 N → 直接添加</text>
    <text x="578" y="62" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">发现新可达网络</text>

    <!-- Case B -->
    <rect x="444" y="96" width="268" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="578" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">已有 N 且下一跳 = X → 替换</text>
    <text x="578" y="150" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">以新消息为准（无论增减）</text>

    <!-- Case C -->
    <rect x="444" y="188" width="268" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="578" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">已有 N 且下一跳 ≠ X</text>
    <text x="578" y="242" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">仅当新距离 d &lt; 原距离时更新</text>
    <text x="578" y="266" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">否则保持原表项不变</text>

    <!-- Step 3 -->
    <rect x="8" y="140" width="400" height="144" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="208" y="172" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">③ 超时与不可达判定（默认 180 秒）</text>
    <text x="208" y="202" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">若 180 秒未收到邻居路由更新</text>
    <text x="208" y="228" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">→ 标记该邻居不可达（距离 = 16）</text>
    <text x="208" y="256" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">路径最多 15 跳，16 表示不可达（适于小网）</text>

    <rect x="8" y="308" width="704" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">三要素：仅和相邻路由器交换 ｜ 交换完整路由表</text>
    <text x="360" y="362" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">每隔 30 秒周期更新（拓扑变化时及时通告）</text>
    <text x="360" y="390" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">特点：实现简单、好消息传播得快；</text>
    <text x="360" y="414" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">但网络故障时会出现“坏消息传播得慢”（慢收敛至 16）</text>
  </g>
</svg>
