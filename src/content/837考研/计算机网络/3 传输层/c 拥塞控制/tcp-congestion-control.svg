<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img">
  <title>TCP 拥塞控制 cwnd 变化曲线：慢开始、拥塞避免、超时与快恢复</title>
  <desc>展示拥塞窗口 cwnd 随传输轮次的演变，包含慢开始指数增长、ssthresh 切换至拥塞避免、第 12 轮拥塞后超时重传与快恢复（TCP Reno）两条分支。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">TCP 拥塞控制：cwnd 随传输轮次的变化</text>

    <!-- Axes: origin (72, 296), x scale 20px/round (r0=72, r22=512), y scale 8px/unit (cwnd=24 -> y=104, cwnd=16 -> y=168, cwnd=12 -> y=200, cwnd=1 -> y=288) -->
    <line x1="72" y1="296" x2="548" y2="296" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="72" y1="80" x2="72" y2="296" stroke="#1f2937" stroke-width="1.5"/>
    <text x="64" y="72" text-anchor="end" font-size="12" font-weight="600" fill="#1f2937">cwnd</text>
    <text x="560" y="300" text-anchor="start" font-size="12" font-weight="600" fill="#1f2937">传输轮次 (RTT)</text>

    <!-- Horizontal guide lines -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4">
      <line x1="72" y1="104" x2="520" y2="104"/>
      <line x1="72" y1="168" x2="520" y2="168"/>
      <line x1="72" y1="200" x2="520" y2="200"/>
    </g>

    <!-- Y-axis ticks -->
    <g font-size="12" font-weight="400" fill="#4b5563" text-anchor="end">
      <text x="60" y="108">24</text>
      <text x="60" y="172">16</text>
      <text x="60" y="204">12</text>
      <text x="60" y="300">0</text>
    </g>

    <!-- X-axis ticks: r -> 72 + r * 20 -->
    <g font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">
      <text x="72" y="316">0</text>
      <text x="152" y="316">4</text>
      <text x="232" y="316">8</text>
      <text x="312" y="316">12</text>
      <text x="392" y="316">16</text>
      <text x="472" y="316">20</text>
    </g>

    <!-- Fast recovery branch (Reno, dashed teal) -->
    <polyline fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 4"
      points="312,104 332,200 352,192 372,184 392,176 412,168 432,160 452,152 472,144 492,136 512,128"/>

    <!-- Main timeout branch (solid blue) -->
    <polyline fill="none" stroke="#3b82f6" stroke-width="2"
      points="72,288 92,280 112,264 132,232 152,168 172,160 192,152 212,144 232,136 252,128 272,120 292,112 312,104 332,288 352,280 372,264 392,232 412,200 432,192 452,184 472,176 492,168 512,160"/>

    <!-- Key points -->
    <g fill="#1e40af">
      <circle cx="152" cy="168" r="3.5"/>
      <circle cx="312" cy="104" r="3.5"/>
      <circle cx="412" cy="200" r="3.5"/>
    </g>
    <circle cx="332" cy="200" r="3.5" fill="#115e59"/>

    <!-- Annotations cleanly placed with >= 6px clearance -->
    <text x="164" y="252" text-anchor="start" font-size="12" font-weight="600" fill="#115e59">慢开始 (×2 指数)</text>
    <text x="80" y="136" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">初始 ssthresh=16</text>

    <text x="220" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">拥塞避免 (+1 线性)</text>

    <rect x="332" y="60" width="280" height="36" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="472" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">第 12 轮 cwnd=24 拥塞 → ssthresh=12</text>

    <!-- Right-side branch labels -->
    <text x="532" y="120" text-anchor="start" font-size="12" font-weight="600" fill="#115e59">3 个冗余 ACK：</text>
    <text x="532" y="140" text-anchor="start" font-size="12" font-weight="600" fill="#115e59">快恢复 (cwnd=12)</text>

    <text x="532" y="168" text-anchor="start" font-size="12" font-weight="600" fill="#1e40af">超时后重新慢开始</text>
    <text x="532" y="204" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">新 ssthresh=12</text>

    <text x="492" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">超时：cwnd=1，重新慢开始</text>

    <!-- Bottom legend/note block -->
    <rect x="24" y="348" width="712" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="371" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">蓝实线：超时后重新慢开始　｜　青虚线：TCP Reno 快重传 + 快恢复（直接进入拥塞避免）</text>
  </g>
</svg>
