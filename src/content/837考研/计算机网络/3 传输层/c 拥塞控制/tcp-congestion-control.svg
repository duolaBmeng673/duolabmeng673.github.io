<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img">
  <title>TCP 拥塞控制 cwnd 变化曲线：慢开始、拥塞避免、超时与快恢复</title>
  <desc>展示拥塞窗口 cwnd 随传输轮次的演变，包含慢开始指数增长、ssthresh 切换至拥塞避免、第 12 轮拥塞后超时重传与快恢复（TCP Reno）两条分支。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Axes: origin (44, 260), x scale 20px/round (r0=44..r22=484), y scale 8px/unit (cwnd=24 -> y=68, 16 -> 132, 12 -> 164, 1 -> 252) -->
    <line x1="44" y1="260" x2="508" y2="260" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="44" y1="36" x2="44" y2="260" stroke="#1f2937" stroke-width="1.5"/>
    <text x="44" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">cwnd</text>
    <text x="518" y="265" text-anchor="start" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">传输轮次 (RTT)</text>

    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4">
      <line x1="44" y1="68" x2="492" y2="68"/>
      <line x1="44" y1="132" x2="492" y2="132"/>
      <line x1="44" y1="164" x2="492" y2="164"/>
    </g>

    <g font-size="15" font-weight="400" fill="#4b5563" text-anchor="end">
      <text x="34" y="73" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">24</text>
      <text x="34" y="137" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">16</text>
      <text x="34" y="169" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">12</text>
      <text x="34" y="264" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">0</text>
    </g>

    <g font-size="15" font-weight="400" fill="#4b5563" text-anchor="middle">
      <text x="44" y="284" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">0</text>
      <text x="124" y="284" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">4</text>
      <text x="204" y="284" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">8</text>
      <text x="284" y="284" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">12</text>
      <text x="364" y="284" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">16</text>
      <text x="444" y="284" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">20</text>
    </g>

    <!-- Fast recovery branch (Reno, dashed teal) -->
    <polyline fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 4"
      points="284,68 304,164 324,156 344,148 364,140 384,132 404,124 424,116 444,108 464,100 484,92"/>

    <!-- Main timeout branch (solid blue) -->
    <polyline fill="none" stroke="#3b82f6" stroke-width="2"
      points="44,252 64,244 84,228 104,196 124,132 144,124 164,116 184,108 204,100 224,92 244,84 264,76 284,68 304,252 324,244 344,228 364,196 384,164 404,156 424,148 444,140 464,132 484,124"/>

    <g fill="#1e40af">
      <circle cx="124" cy="132" r="4"/>
      <circle cx="284" cy="68" r="4"/>
      <circle cx="384" cy="164" r="4"/>
    </g>
    <circle cx="304" cy="164" r="4" fill="#115e59"/>

    <text x="136" y="218" text-anchor="start" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">慢开始 (×2 指数)</text>
    <text x="52" y="100" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">初始 ssthresh=16</text>
    <text x="196" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">拥塞避免 (+1 线性)</text>

    <rect x="296" y="8" width="332" height="42" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="462" y="35" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">第 12 轮 cwnd=24 拥塞 → ssthresh=12</text>

    <g text-anchor="start">
      <text x="504" y="84" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">3 个冗余 ACK：</text>
      <text x="504" y="106" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">快恢复 (cwnd=12)</text>
      <text x="504" y="144" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">超时后重新慢开始</text>
      <text x="504" y="166" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">新 ssthresh=12</text>
      <text x="504" y="212" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">超时：cwnd=1，</text>
      <text x="504" y="234" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">重新慢开始</text>
    </g>

    <rect x="8" y="302" width="704" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="328" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">蓝实线：超时后重新慢开始</text>
    <text x="360" y="352" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">青虚线：TCP Reno 快重传 + 快恢复（直接进入拥塞避免）</text>
  </g>
</svg>
