<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 354" width="720" height="354" role="img">
  <title>UDP 伪首部（12 B）与首部格式（8 B）</title>
  <desc>展示不实际发送、仅用于检验和计算的 12 字节 UDP 伪首部，以及 8 字节 UDP 首部与数据部分格式。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <g font-size="15" font-weight="400" fill="#4b5563" text-anchor="middle">
      <text x="104" y="22" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">0</text>
      <text x="408" y="22" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">15 / 16</text>
      <text x="712" y="22" text-anchor="end" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">31</text>
    </g>

    <g text-anchor="start">
      <text x="8" y="84" font-size="16" font-weight="600" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">伪首部</text>
      <text x="8" y="108" font-size="15" font-weight="400" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">12 B</text>
      <text x="8" y="130" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">(不发送)</text>

      <text x="8" y="214" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">UDP 首部</text>
      <text x="8" y="238" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">8 B</text>
    </g>

    <!-- Pseudo-header rows (x=104..712, w=608) -->
    <g stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4" fill="#fffbeb">
      <rect x="104" y="36" width="608" height="42" rx="8"/>
      <rect x="104" y="82" width="608" height="42" rx="8"/>
      <rect x="104" y="128" width="144" height="42" rx="8"/>
      <rect x="252" y="128" width="152" height="42" rx="8"/>
      <rect x="408" y="128" width="304" height="42" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">
      <text x="408" y="63">源 IP 地址（4 B）</text>
      <text x="408" y="109">目的 IP 地址（4 B）</text>
      <text x="176" y="155">全 0（1 B）</text>
      <text x="328" y="155">协议 17（1 B）</text>
      <text x="560" y="155">UDP 长度（2 B）</text>
    </g>

    <!-- UDP Header rows -->
    <g stroke="#3b82f6" stroke-width="1.5" fill="#eff6ff">
      <rect x="104" y="182" width="302" height="42" rx="8"/>
      <rect x="410" y="182" width="302" height="42" rx="8"/>
      <rect x="104" y="228" width="302" height="42" rx="8"/>
      <rect x="410" y="228" width="302" height="42" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">
      <text x="255" y="209">16 位源端口</text>
      <text x="561" y="209">16 位目的端口</text>
      <text x="255" y="255">16 位 UDP 长度</text>
      <text x="561" y="255">16 位 UDP 检验和</text>
    </g>

    <!-- Data -->
    <rect x="104" y="282" width="608" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="408" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">数据部分（如果有）</text>
    <text x="408" y="332" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">计算检验和时若为奇数字节，则在末尾补 1 个全 0 字节</text>
  </g>
</svg>
