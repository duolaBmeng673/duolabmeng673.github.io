<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img">
  <title>UDP 伪首部（12 B）与首部格式（8 B）</title>
  <desc>展示不实际发送、仅用于检验和计算的 12 字节 UDP 伪首部，以及 8 字节 UDP 首部与数据部分格式。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">UDP 伪首部（12 B）与首部格式（8 B）</text>

    <!-- Bit markers -->
    <g font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">
      <text x="168" y="76">0</text>
      <text x="448" y="76">15 / 16</text>
      <text x="728" y="76">31</text>
    </g>

    <!-- Left section labels (outside boxes, clean alignment) -->
    <g text-anchor="middle">
      <text x="88" y="132" font-size="14" font-weight="600" fill="#92400e">伪首部</text>
      <text x="88" y="152" font-size="12" font-weight="400" fill="#92400e">12 B</text>
      <text x="88" y="170" font-size="12" font-weight="400" fill="#4b5563">(不发送)</text>

      <text x="88" y="256" font-size="14" font-weight="600" fill="#1e40af">UDP 首部</text>
      <text x="88" y="276" font-size="12" font-weight="400" fill="#1e40af">8 B</text>
    </g>

    <!-- Pseudo-header rows (x=168..728, w=560) -->
    <g stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4" fill="#fffbeb">
      <rect x="168" y="88" width="560" height="40" rx="8"/>
      <rect x="168" y="132" width="560" height="40" rx="8"/>
      <rect x="168" y="176" width="136" height="40" rx="8"/>
      <rect x="308" y="176" width="136" height="40" rx="8"/>
      <rect x="448" y="176" width="280" height="40" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">
      <text x="448" y="113">源 IP 地址（4 B）</text>
      <text x="448" y="157">目的 IP 地址（4 B）</text>
      <text x="236" y="201">全 0（1 B）</text>
      <text x="376" y="201">协议 17（1 B）</text>
      <text x="588" y="201">UDP 长度（2 B）</text>
    </g>

    <!-- UDP Header rows -->
    <g stroke="#3b82f6" stroke-width="1.5" fill="#eff6ff">
      <rect x="168" y="224" width="276" height="40" rx="8"/>
      <rect x="452" y="224" width="276" height="40" rx="8"/>
      <rect x="168" y="268" width="276" height="40" rx="8"/>
      <rect x="452" y="268" width="276" height="40" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">
      <text x="306" y="249">16 位源端口</text>
      <text x="590" y="249">16 位目的端口</text>
      <text x="306" y="293">16 位 UDP 长度</text>
      <text x="590" y="293">16 位 UDP 检验和</text>
    </g>

    <!-- Data -->
    <rect x="168" y="320" width="560" height="48" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="448" y="349" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">数据部分（如果有；计算检验和时若为奇数字节则末尾补 1 个全 0 字节）</text>
  </g>
</svg>
