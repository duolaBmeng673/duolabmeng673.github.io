<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" width="720" height="476" role="img">
  <title>TCP 报文段首部格式（20 字节固定首部与可选部分）</title>
  <desc>展示 20 字节固定 TCP 首部、40 字节以内可选与填充部分，以及 6 个 1 位控制位（URG、ACK、PSH、RST、SYN、FIN）的展开结构。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <g font-size="15" font-weight="400" fill="#4b5563" text-anchor="middle">
      <text x="96" y="22" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">0</text>
      <text x="250" y="22" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">8</text>
      <text x="404" y="22" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">16</text>
      <text x="558" y="22" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">24</text>
      <text x="712" y="22" text-anchor="end" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">31</text>
    </g>

    <g text-anchor="middle">
      <text x="44" y="132" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">固定</text>
      <text x="44" y="154" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">首部</text>
      <text x="44" y="178" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">20 B</text>
    </g>

    <!-- Row 1: Ports (x=96..712, w=616) -->
    <rect x="96" y="36" width="306" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="406" y="36" width="306" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="249" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">源端口 (16 位)</text>
    <text x="559" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">目的端口 (16 位)</text>

    <!-- Row 2: seq -->
    <rect x="96" y="82" width="616" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="404" y="109" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">序号 seq (32 位)</text>

    <!-- Row 3: ack -->
    <rect x="96" y="128" width="616" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="404" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">确认号 ack (32 位)</text>

    <!-- Row 4: offset(4) + reserved(6) + 6 flags + window(16) -->
    <rect x="96" y="174" width="90" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="141" y="199" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">数据</text>
    <text x="141" y="221" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">偏移(4)</text>

    <rect x="190" y="174" width="88" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="234" y="211" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">保留(6)</text>

    <rect x="282" y="174" width="120" height="62" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="342" y="199" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">6 位控制位</text>
    <text x="342" y="221" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">(见下展开)</text>

    <rect x="406" y="174" width="306" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="559" y="211" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">窗口 rwnd (16 位)</text>

    <!-- Row 5 -->
    <rect x="96" y="240" width="306" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="406" y="240" width="306" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="249" y="267" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">检验和 (16 位)</text>
    <text x="559" y="267" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">紧急指针 (16 位)</text>

    <!-- Row 6 -->
    <rect x="96" y="286" width="468" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="568" y="286" width="144" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="330" y="313" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">选项（长度可变，最长 40 B，如 MSS）</text>
    <text x="640" y="313" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">填充</text>

    <!-- Expanded 6 flags strip -->
    <text x="44" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">控制位</text>
    <g fill="#fef2f2" stroke="#ef4444" stroke-width="1.5">
      <rect x="96" y="340" width="96" height="42" rx="8"/>
      <rect x="200" y="340" width="96" height="42" rx="8"/>
      <rect x="304" y="340" width="96" height="42" rx="8"/>
      <rect x="408" y="340" width="96" height="42" rx="8"/>
      <rect x="512" y="340" width="96" height="42" rx="8"/>
      <rect x="616" y="340" width="96" height="42" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">
      <text x="144" y="367">URG</text>
      <text x="248" y="367">ACK</text>
      <text x="352" y="367">PSH</text>
      <text x="456" y="367">RST</text>
      <text x="560" y="367">SYN</text>
      <text x="664" y="367">FIN</text>
    </g>

    <rect x="8" y="398" width="704" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="426" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">首部最短 20 B，最长 20 + 40 = 60 B；选项 + 填充须使首部为 4 B 的整数倍</text>
    <text x="360" y="452" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">TCP 检验和同样使用 12 B 伪首部（协议号改为 6，长度改为 TCP 长度）</text>
  </g>
</svg>
