<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 760 495" width="760" height="495" role="img">
  <title>TCP 报文段首部格式（20 字节固定首部与可选部分）</title>
  <desc>展示 20 字节固定 TCP 首部、40 字节以内可选与填充部分，以及 6 个 1 位控制位（URG、ACK、PSH、RST、SYN、FIN）的展开结构。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">TCP 报文段首部格式</text>

    <!-- Bit markers (grid x=144..720, width=576, 16-bit split at x=432) -->
    <g font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">
      <text x="144" y="76">0</text>
      <text x="288" y="76">8</text>
      <text x="432" y="76">16</text>
      <text x="576" y="76">24</text>
      <text x="720" y="76">31</text>
    </g>

    <!-- Fixed 20B label -->
    <g text-anchor="middle">
      <text x="80" y="172" font-size="14" font-weight="600" fill="#1e40af">固定</text>
      <text x="80" y="192" font-size="14" font-weight="600" fill="#1e40af">首部</text>
      <text x="80" y="212" font-size="12" font-weight="400" fill="#4b5563">20 B</text>
    </g>

    <!-- Row 1: Ports -->
    <rect x="144" y="88" width="284" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="436" y="88" width="284" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="286" y="111" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">源端口 (16 位)</text>
    <text x="578" y="111" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">目的端口 (16 位)</text>

    <!-- Row 2: seq -->
    <rect x="144" y="128" width="576" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="432" y="151" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">序号 seq (32 位)</text>

    <!-- Row 3: ack -->
    <rect x="144" y="168" width="576" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="432" y="191" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">确认号 ack (32 位)</text>

    <!-- Row 4: offset(4) + reserved(6) + 6 flags + window(16) -->
    <rect x="144" y="208" width="88" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="188" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">数据</text>
    <text x="188" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">偏移(4)</text>

    <rect x="236" y="208" width="84" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="278" y="239" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">保留 (6)</text>

    <rect x="324" y="208" width="108" height="52" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="378" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">6 位控制位</text>
    <text x="378" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#991b1b">（见下展开）</text>

    <rect x="436" y="208" width="284" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="578" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">窗口 rwnd (16 位)</text>

    <!-- Row 5: checksum + urgent pointer -->
    <rect x="144" y="264" width="284" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="436" y="264" width="284" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="286" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">检验和 (16 位)</text>
    <text x="578" y="287" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">紧急指针 (16 位)</text>

    <!-- Row 6: options + padding -->
    <rect x="144" y="304" width="432" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="580" y="304" width="140" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="360" y="327" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">选项（长度可变，最长 40 B，如 MSS）</text>
    <text x="650" y="327" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">填充</text>

    <!-- Expanded 6 flags strip -->
    <text x="80" y="379" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">6 位控制位</text>
    <g fill="#fef2f2" stroke="#ef4444" stroke-width="1.5">
      <rect x="144" y="356" width="92" height="36" rx="8"/>
      <rect x="240" y="356" width="92" height="36" rx="8"/>
      <rect x="336" y="356" width="92" height="36" rx="8"/>
      <rect x="432" y="356" width="92" height="36" rx="8"/>
      <rect x="528" y="356" width="92" height="36" rx="8"/>
      <rect x="628" y="356" width="92" height="36" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">
      <text x="190" y="379">URG</text>
      <text x="286" y="379">ACK</text>
      <text x="382" y="379">PSH</text>
      <text x="478" y="379">RST</text>
      <text x="574" y="379">SYN</text>
      <text x="674" y="379">FIN</text>
    </g>

    <!-- Bottom note block -->
    <rect x="24" y="408" width="712" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">首部最短 20 B，最长 20 + 40 = 60 B；选项 + 填充须使首部为 4 B 的整数倍</text>
    <text x="380" y="454" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">TCP 检验和同样使用 12 B 伪首部（协议号改为 6，长度改为 TCP 长度）</text>
  </g>
</svg>
