<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" width="720" height="564" role="img">
  <title>TCP 利用可变接收窗口 rwnd 进行流量控制</title>
  <desc>按时间顺序展示发送方 A 与接收方 B 通过 ACK 报文段携带可变接收窗口 rwnd 动态控制发送字节流的过程，包含中间分组丢失的处理。</desc>
  <defs>
    <marker id="tcp-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="156" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="86" y="35" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">主机 A（发送方）</text>

    <rect x="248" y="8" width="156" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="326" y="35" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">主机 B（接收方）</text>

    <line x1="86" y1="50" x2="86" y2="550" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="326" y1="50" x2="326" y2="550" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <rect x="416" y="8" width="296" height="548" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="564" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">窗口变化与说明</text>

    <!-- Step 1 -->
    <line x1="86" y1="92" x2="322" y2="92" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-flow-arrow)"/>
    <text x="206" y="80" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">seq=1, DATA</text>
    <text x="432" y="96" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">A 发了 1~100，还能发 300 字节</text>

    <!-- Step 2 -->
    <line x1="86" y1="152" x2="322" y2="152" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-flow-arrow)"/>
    <text x="206" y="140" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">seq=101, DATA</text>
    <text x="432" y="156" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">A 发了 101~200，还能发 200 字节</text>

    <!-- Step 3 -->
    <line x1="86" y1="212" x2="268" y2="212" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="206" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">seq=201, DATA ✗ 丢失</text>
    <text x="432" y="216" text-anchor="start" font-size="15" font-weight="400" fill="#991b1b">201~300 在途中丢失，B 未收到</text>

    <!-- Step 4 -->
    <line x1="326" y1="272" x2="90" y2="272" stroke="#ef4444" stroke-width="2" marker-end="url(#tcp-flow-arrow)"/>
    <text x="206" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">ACK=1, ack=201, rwnd=300</text>
    <text x="432" y="276" text-anchor="start" font-size="15" font-weight="600" fill="#991b1b">B 允许 A 发 201~500 共 300 字节</text>

    <!-- Step 5 -->
    <line x1="86" y1="332" x2="322" y2="332" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-flow-arrow)"/>
    <text x="206" y="320" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">seq=301, DATA</text>
    <text x="432" y="336" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">A 发了 301~400，还能发 100 字节</text>

    <!-- Step 6 -->
    <line x1="86" y1="392" x2="322" y2="392" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-flow-arrow)"/>
    <text x="206" y="380" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">seq=401, DATA</text>
    <text x="432" y="396" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">A 发了 401~500，不能再发新数据</text>

    <!-- Step 7 -->
    <line x1="326" y1="452" x2="90" y2="452" stroke="#ef4444" stroke-width="2" marker-end="url(#tcp-flow-arrow)"/>
    <text x="206" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">ACK=1, ack=501, rwnd=100</text>
    <text x="432" y="456" text-anchor="start" font-size="15" font-weight="600" fill="#991b1b">B 允许 A 发 501~600 共 100 字节</text>

    <!-- Step 8 -->
    <line x1="86" y1="518" x2="322" y2="518" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-flow-arrow)"/>
    <text x="206" y="506" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">seq=501, DATA</text>
    <text x="432" y="514" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">A 发完 501~600 后</text>
    <text x="432" y="536" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">B 回 rwnd=0，A 暂停发送</text>
  </g>
</svg>
