<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 776" width="720" height="776" role="img">
  <title>TCP 三次握手建立连接与四次挥手释放连接</title>
  <desc>上下对照展示 TCP 三次握手建立连接与四次挥手释放连接过程中的报文段序号、确认号及两端状态迁移。</desc>
  <defs>
    <marker id="tcp-hs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Top group: (a) 3-way handshake -->
    <rect x="8" y="8" width="704" height="332" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="24" y="38" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(a) 三次握手建立连接</text>

    <rect x="164" y="52" width="96" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="212" y="79" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">客户 A</text>

    <rect x="452" y="52" width="112" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="508" y="79" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">服务器 B</text>

    <line x1="212" y1="94" x2="212" y2="302" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="508" y1="94" x2="508" y2="302" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <g font-size="15" font-weight="600" fill="#991b1b" text-anchor="end">
      <text x="196" y="122">CLOSED</text>
      <text x="196" y="166">SYN-SENT</text>
      <text x="196" y="268">ESTABLISHED</text>
    </g>
    <g font-size="15" font-weight="600" fill="#991b1b" text-anchor="start">
      <text x="524" y="122">LISTEN</text>
      <text x="524" y="212">SYN-RCVD</text>
      <text x="524" y="268">ESTABLISHED</text>
    </g>

    <line x1="212" y1="136" x2="504" y2="136" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="360" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">SYN=1, seq=x</text>

    <line x1="508" y1="204" x2="216" y2="204" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="360" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">SYN=1, ACK=1, seq=y, ack=x+1</text>

    <line x1="212" y1="264" x2="504" y2="264" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="360" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">ACK=1, seq=x+1, ack=y+1</text>

    <rect x="292" y="284" width="136" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="360" y="310" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">数据传送阶段</text>

    <!-- Bottom group: (b) 4-way teardown -->
    <rect x="8" y="356" width="704" height="412" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="24" y="386" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(b) 四次挥手释放连接</text>

    <rect x="164" y="400" width="96" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="212" y="427" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">客户 A</text>

    <rect x="452" y="400" width="112" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="508" y="427" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">服务器 B</text>

    <line x1="212" y1="442" x2="212" y2="752" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="508" y1="442" x2="508" y2="752" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <g font-size="15" font-weight="600" fill="#991b1b" text-anchor="end">
      <text x="196" y="470">ESTABLISHED</text>
      <text x="196" y="512">FIN-WAIT-1</text>
      <text x="196" y="566">FIN-WAIT-2</text>
      <text x="196" y="676">TIME-WAIT</text>
      <text x="196" y="698" font-weight="400" fill="#4b5563">(等待 2MSL)</text>
      <text x="196" y="746">CLOSED</text>
    </g>
    <g font-size="15" font-weight="600" fill="#991b1b" text-anchor="start">
      <text x="524" y="470">ESTABLISHED</text>
      <text x="524" y="566">CLOSE-WAIT</text>
      <text x="524" y="630">LAST-ACK</text>
      <text x="524" y="746">CLOSED</text>
    </g>

    <line x1="212" y1="484" x2="504" y2="484" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="360" y="472" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">FIN=1, seq=u</text>

    <line x1="508" y1="548" x2="216" y2="548" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="360" y="536" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">ACK=1, seq=v, ack=u+1</text>

    <line x1="508" y1="616" x2="216" y2="616" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="360" y="604" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">FIN=1, ACK=1, seq=w, ack=u+1</text>

    <line x1="212" y1="684" x2="504" y2="684" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="360" y="672" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">ACK=1, seq=u+1, ack=w+1</text>
  </g>
</svg>
