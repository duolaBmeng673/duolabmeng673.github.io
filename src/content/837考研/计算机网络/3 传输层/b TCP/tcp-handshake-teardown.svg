<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" role="img">
  <title>TCP 三次握手建立连接与四次挥手释放连接</title>
  <desc>左右对照展示 TCP 三次握手建立连接与四次挥手释放连接过程中的报文段序号、确认号及两端状态迁移。</desc>
  <defs>
    <marker id="tcp-hs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">TCP 三次握手建立连接与四次挥手释放连接</text>

    <!-- Left group: 3-way handshake (x=24..372) -->
    <rect x="24" y="64" width="348" height="384" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="40" y="92" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(a) 三次握手建立连接</text>

    <rect x="88" y="108" width="80" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="128" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">客户 A</text>

    <rect x="228" y="108" width="96" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="276" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">服务器 B</text>

    <line x1="128" y1="144" x2="128" y2="412" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="276" y1="144" x2="276" y2="412" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- State labels (a) -->
    <g font-size="12" font-weight="600" fill="#991b1b" text-anchor="end">
      <text x="116" y="168">CLOSED</text>
      <text x="116" y="216">SYN-SENT</text>
      <text x="116" y="344">ESTABLISHED</text>
    </g>
    <g font-size="12" font-weight="600" fill="#991b1b" text-anchor="start">
      <text x="288" y="168">LISTEN</text>
      <text x="288" y="256">SYN-RCVD</text>
      <text x="288" y="344">ESTABLISHED</text>
    </g>

    <!-- Arrows (a) horizontal -->
    <line x1="128" y1="184" x2="272" y2="184" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="202" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">SYN=1, seq=x</text>

    <line x1="276" y1="256" x2="132" y2="256" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="202" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">SYN=1, ACK=1</text>
    <text x="202" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="#115e59">seq=y, ack=x+1</text>

    <line x1="128" y1="336" x2="272" y2="336" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="202" y="306" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">ACK=1</text>
    <text x="202" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">seq=x+1, ack=y+1</text>

    <rect x="148" y="376" width="112" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="204" y="399" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">数据传送阶段</text>

    <!-- Right group: 4-way teardown (x=388..736) -->
    <rect x="388" y="64" width="348" height="384" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="404" y="92" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(b) 四次挥手释放连接</text>

    <rect x="452" y="108" width="80" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="492" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">客户 A</text>

    <rect x="592" y="108" width="96" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="640" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">服务器 B</text>

    <line x1="492" y1="144" x2="492" y2="412" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="640" y1="144" x2="640" y2="412" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- State labels (b) -->
    <g font-size="12" font-weight="600" fill="#991b1b" text-anchor="end">
      <text x="480" y="168">ESTABLISHED</text>
      <text x="480" y="208">FIN-WAIT-1</text>
      <text x="480" y="256">FIN-WAIT-2</text>
      <text x="480" y="368">TIME-WAIT</text>
      <text x="480" y="388" font-weight="400" fill="#4b5563">(等待 2MSL)</text>
      <text x="480" y="424">CLOSED</text>
    </g>
    <g font-size="12" font-weight="600" fill="#991b1b" text-anchor="start">
      <text x="652" y="168">ESTABLISHED</text>
      <text x="652" y="256">CLOSE-WAIT</text>
      <text x="652" y="320">LAST-ACK</text>
      <text x="652" y="424">CLOSED</text>
    </g>

    <!-- Arrows (b) horizontal (row spacing = 56) -->
    <line x1="492" y1="184" x2="636" y2="184" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="566" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">FIN=1, seq=u</text>

    <line x1="640" y1="244" x2="496" y2="244" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="566" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">ACK=1</text>
    <text x="566" y="234" text-anchor="middle" font-size="12" font-weight="400" fill="#115e59">seq=v, ack=u+1</text>

    <line x1="640" y1="308" x2="496" y2="308" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="566" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">FIN=1, ACK=1</text>
    <text x="566" y="298" text-anchor="middle" font-size="12" font-weight="400" fill="#115e59">seq=w, ack=u+1</text>

    <line x1="492" y1="376" x2="636" y2="376" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#tcp-hs-arrow)"/>
    <text x="566" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">ACK=1</text>
    <text x="566" y="364" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">seq=u+1, ack=w+1</text>
  </g>
</svg>
