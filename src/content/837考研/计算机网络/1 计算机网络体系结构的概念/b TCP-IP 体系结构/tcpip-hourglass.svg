<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" role="img">
  <title>TCP/IP 协议族（沙漏形：IP 是核心细腰）</title>
  <desc>展示 TCP/IP 协议族的沙漏形结构：上层应用协议与运输层汇聚于网际层 IP，下层适配多种物理网络接口。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="8" y="36" text-anchor="start" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">应用层</text>
    <text x="8" y="124" text-anchor="start" font-size="15" font-weight="600" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">运输层</text>
    <text x="8" y="212" text-anchor="start" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">网际层</text>
    <text x="8" y="300" text-anchor="start" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">网络接口层</text>

    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4">
      <line x1="104" y1="74" x2="712" y2="74"/>
      <line x1="104" y1="162" x2="712" y2="162"/>
      <line x1="104" y1="250" x2="712" y2="250"/>
    </g>

    <g stroke="#94a3b8" stroke-width="1.5" fill="none">
      <path d="M164 52 V64 H276 V96"/>
      <path d="M276 52 V96"/>
      <path d="M388 52 V64 H468 V96"/>
      <path d="M500 52 V64 H468"/>
      <path d="M276 140 V154 H352 V184"/>
      <path d="M468 140 V154 H392 V184"/>
      <path d="M352 228 V242 H172 V272"/>
      <path d="M372 228 H360 V272"/>
      <path d="M392 228 V242 H548 V272"/>
    </g>

    <!-- App boxes (w=92 -> L/R >= 16 for HTTP/SMTP) -->
    <g fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5">
      <rect x="118" y="10" width="92" height="42" rx="8"/>
      <rect x="230" y="10" width="92" height="42" rx="8"/>
      <rect x="342" y="10" width="92" height="42" rx="8"/>
      <rect x="454" y="10" width="92" height="42" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">
      <text x="164" y="37">HTTP</text>
      <text x="276" y="37">SMTP</text>
      <text x="388" y="37">DNS</text>
      <text x="500" y="37">RTP</text>
    </g>
    <text x="564" y="26" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">…（Everything</text>
    <text x="572" y="48" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">over IP）</text>

    <g fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5">
      <rect x="228" y="96" width="96" height="44" rx="8"/>
      <rect x="420" y="96" width="96" height="44" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">
      <text x="276" y="124">TCP</text>
      <text x="468" y="124">UDP</text>
    </g>

    <rect x="308" y="184" width="128" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="372" y="212" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">IP</text>

    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
      <rect x="120" y="272" width="104" height="44" rx="8"/>
      <rect x="308" y="272" width="104" height="44" rx="8"/>
      <rect x="496" y="272" width="104" height="44" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">
      <text x="172" y="300">网络 1</text>
      <text x="360" y="300">网络 2</text>
      <text x="548" y="300">网络 3</text>
    </g>
    <text x="612" y="288" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">…（IP over</text>
    <text x="620" y="310" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">Everything）</text>
  </g>
</svg>
