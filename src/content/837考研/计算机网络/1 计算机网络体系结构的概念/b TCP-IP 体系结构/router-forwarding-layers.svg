<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" role="img">
  <title>TCP/IP 通信路径：路由器只处理到网际层</title>
  <desc>展示主机 A 与主机 B 在应用层和运输层进行端到端逻辑通信，而中间路由器只处理到网际层和网络接口层。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">TCP/IP 通信路径：路由器只处理到网际层</text>

    <!-- Column headers -->
    <text x="120" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">主机 A</text>
    <text x="380" y="172" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">路由器</text>
    <text x="640" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">主机 B</text>

    <!-- Host A stack -->
    <rect x="32" y="88" width="176" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="32" y="136" width="176" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="32" y="184" width="176" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <rect x="32" y="232" width="176" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <g text-anchor="middle" font-size="14" font-weight="400">
      <text x="120" y="113" fill="#1e40af">应用层</text>
      <text x="120" y="161" fill="#92400e">运输层</text>
      <text x="120" y="209" fill="#115e59">网际层</text>
      <text x="120" y="257" fill="#1f2937">网络接口层</text>
    </g>

    <!-- Router stack -->
    <rect x="292" y="184" width="176" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <rect x="292" y="232" width="176" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <g text-anchor="middle" font-size="14" font-weight="400">
      <text x="380" y="209" fill="#115e59">网际层</text>
      <text x="380" y="257" fill="#1f2937">网络接口层</text>
    </g>

    <!-- Host B stack -->
    <rect x="552" y="88" width="176" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="552" y="136" width="176" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="552" y="184" width="176" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <rect x="552" y="232" width="176" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <g text-anchor="middle" font-size="14" font-weight="400">
      <text x="640" y="113" fill="#1e40af">应用层</text>
      <text x="640" y="161" fill="#92400e">运输层</text>
      <text x="640" y="209" fill="#115e59">网际层</text>
      <text x="640" y="257" fill="#1f2937">网络接口层</text>
    </g>

    <!-- Network 1 and Network 2 nodes -->
    <rect x="192" y="304" width="120" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="252" y="329" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">网络 1</text>

    <rect x="448" y="304" width="120" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="508" y="329" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">网络 2</text>

    <!-- Orthogonal physical data flow paths -->
    <path d="M120 272 V324 H192" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M312 324 H360 V272" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M400 272 V324 H448" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M568 324 H640 V272" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Peer dashed lines -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4">
      <line x1="208" y1="108" x2="552" y2="108"/>
      <line x1="208" y1="156" x2="552" y2="156"/>
      <line x1="208" y1="204" x2="292" y2="204"/>
      <line x1="468" y1="204" x2="552" y2="204"/>
    </g>

    <rect x="24" y="380" width="712" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="406" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">图例：水平虚线表示对等层之间的逻辑通信，实线表示分组实际经过的物理传输路径</text>
  </g>
</svg>
