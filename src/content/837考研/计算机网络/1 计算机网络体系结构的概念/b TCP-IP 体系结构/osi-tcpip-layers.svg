<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img">
  <title>三种网络体系结构分层对照</title>
  <desc>对比 OSI 七层模型、TCP/IP 四层模型与教学用五层原理模型的各层对应关系。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="120" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">OSI 七层模型</text>
    <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">TCP/IP 四层模型</text>
    <text x="600" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">五层模型（原理）</text>

    <!-- OSI 7 layers (x=8, w=224; y=44..376) -->
    <g stroke-width="1.5">
      <rect x="8" y="44" width="224" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="8" y="90" width="224" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="8" y="136" width="224" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="8" y="186" width="224" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="8" y="236" width="224" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="8" y="286" width="224" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <rect x="8" y="332" width="224" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="400">
      <text x="120" y="70" fill="#1e40af">7 应用层</text>
      <text x="120" y="116" fill="#1e40af">6 表示层</text>
      <text x="120" y="162" fill="#1e40af">5 会话层</text>
      <text x="120" y="212" fill="#92400e">4 运输层</text>
      <text x="120" y="262" fill="#115e59">3 网络层</text>
      <text x="120" y="312" fill="#1f2937">2 数据链路层</text>
      <text x="120" y="358" fill="#1f2937">1 物理层</text>
    </g>

    <!-- TCP/IP 4 layers (x=248, w=224) -->
    <g stroke-width="1.5">
      <rect x="248" y="44" width="224" height="132" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="248" y="186" width="224" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="248" y="236" width="224" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="248" y="286" width="224" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    </g>
    <g text-anchor="middle">
      <text x="360" y="102" font-size="16" font-weight="600" fill="#1e40af">应用层</text>
      <text x="360" y="128" font-size="15" font-weight="400" fill="#4b5563">(HTTP、SMTP、DNS…)</text>
      <text x="360" y="212" font-size="15" font-weight="400" fill="#92400e">运输层 (TCP / UDP)</text>
      <text x="360" y="262" font-size="15" font-weight="400" fill="#115e59">网际层 (IP)</text>
      <text x="360" y="322" font-size="16" font-weight="600" fill="#1f2937">网络接口层</text>
      <text x="360" y="348" font-size="15" font-weight="400" fill="#4b5563">(链路层)</text>
    </g>

    <!-- 5-layer model (x=488, w=224) -->
    <g stroke-width="1.5">
      <rect x="488" y="44" width="224" height="132" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="488" y="186" width="224" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="488" y="236" width="224" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
      <rect x="488" y="286" width="224" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <rect x="488" y="332" width="224" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="400">
      <text x="600" y="116" fill="#1e40af">5 应用层</text>
      <text x="600" y="212" fill="#92400e">4 运输层</text>
      <text x="600" y="262" fill="#115e59">3 网络层</text>
      <text x="600" y="312" fill="#1f2937">2 数据链路层</text>
      <text x="600" y="358" fill="#1f2937">1 物理层</text>
    </g>
  </g>
</svg>
