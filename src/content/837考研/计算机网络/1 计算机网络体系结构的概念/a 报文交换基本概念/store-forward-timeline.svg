<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" role="img">
  <title>分组存储转发 + 路由器处理时延时间轴（题 18）</title>
  <desc>展示两个 1000 B 分组 P1 与 P2 经过发送、路由器单分组串行处理与转发的时间轴，总耗时 36 ms。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Row labels (x=8..108) -->
    <text x="8" y="34" text-anchor="start" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">A 发送</text>
    <text x="8" y="94" text-anchor="start" font-size="15" font-weight="600" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">路由器处理</text>
    <text x="8" y="144" text-anchor="start" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">路由器转发</text>
    <text x="8" y="166" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">(= B 接收)</text>

    <!-- Scale: x0=116, 1ms=15px (0->116, 8->236, 16->356, 18->386, 26->506, 28->536, 36->656) -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4">
      <line x1="116" y1="8" x2="116" y2="196"/>
      <line x1="236" y1="8" x2="236" y2="196"/>
      <line x1="356" y1="8" x2="356" y2="196"/>
      <line x1="386" y1="8" x2="386" y2="196"/>
      <line x1="506" y1="8" x2="506" y2="196"/>
      <line x1="536" y1="8" x2="536" y2="196"/>
      <line x1="656" y1="8" x2="656" y2="196"/>
    </g>

    <!-- Row 1: P1 (0-8ms), P2 (8-16ms) -->
    <rect x="116" y="8" width="120" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="176" y="35" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">P1 (8 ms)</text>
    <rect x="236" y="8" width="120" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="296" y="35" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">P2 (8 ms)</text>

    <!-- Row 2: P1 proc (8-18ms, w=150), P2 proc (18-28ms, w=150) -->
    <rect x="236" y="68" width="150" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="311" y="95" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">P1 处理 10ms</text>
    <rect x="386" y="68" width="150" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="461" y="95" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">P2 处理 10ms</text>

    <!-- Row 3: Router forwards P1 (18-26ms), P2 (28-36ms) -->
    <rect x="386" y="128" width="120" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="446" y="155" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">P1 (8 ms)</text>
    <rect x="536" y="128" width="120" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="596" y="155" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">P2 (8 ms)</text>

    <!-- Timeline axis -->
    <line x1="116" y1="196" x2="676" y2="196" stroke="#1f2937" stroke-width="1.5"/>
    <g stroke="#1f2937" stroke-width="1">
      <line x1="116" y1="192" x2="116" y2="200"/>
      <line x1="236" y1="192" x2="236" y2="200"/>
      <line x1="356" y1="192" x2="356" y2="200"/>
      <line x1="386" y1="192" x2="386" y2="200"/>
      <line x1="506" y1="192" x2="506" y2="200"/>
      <line x1="536" y1="192" x2="536" y2="200"/>
      <line x1="656" y1="192" x2="656" y2="200"/>
    </g>
    <g font-size="15" font-weight="400" fill="#4b5563" text-anchor="middle">
      <text x="116" y="224" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">0</text>
      <text x="236" y="224" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">8</text>
      <text x="352" y="224" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">16</text>
      <text x="390" y="224" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">18</text>
      <text x="502" y="224" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">26</text>
      <text x="540" y="224" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">28</text>
      <text x="656" y="224" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">36</text>
    </g>
    <text x="688" y="201" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">ms</text>

    <!-- Bottom note block (wrapped 2 lines inside 704w) -->
    <rect x="8" y="248" width="704" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="276" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">题 18：P2 在 16 ms 到达路由器，但路由器 18 ms 才处理完 P1，</text>
    <text x="360" y="300" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">P2 排队等待 2 ms 后串行处理转发 → 总计 36 ms</text>
  </g>
</svg>
