<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 221" width="720" height="221" role="img">
  <title>时延带宽积示意图：链路就像一根空心管道</title>
  <desc>将网络链路类比为圆柱形空心管道，横截面积表示信道带宽，长度表示传播时延，管道可容纳的比特数等于传播时延与信道带宽的乘积。</desc>
  <defs>
    <marker id="delay-bw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Dimension arrow broken around centered label -->
    <line x1="64" y1="18" x2="268" y2="18" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#delay-bw-arrow)"/>
    <line x1="452" y1="18" x2="656" y2="18" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#delay-bw-arrow)"/>
    <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">长度 = 传播时延</text>

    <rect x="64" y="46" width="592" height="100" fill="#eff6ff" stroke="none"/>
    <line x1="64" y1="46" x2="656" y2="46" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="64" y1="146" x2="656" y2="146" stroke="#3b82f6" stroke-width="1.5"/>
    <ellipse cx="64" cy="96" rx="24" ry="50" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <ellipse cx="656" cy="96" rx="24" ry="50" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>

    <text x="360" y="88" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">链路（管道体积）</text>
    <text x="360" y="116" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">可容纳比特数 = 传播时延 × 信道带宽</text>

    <text x="64" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">发送端</text>
    <text x="8" y="208" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">横截面积 = 带宽</text>

    <text x="656" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">接收端</text>
    <text x="712" y="208" text-anchor="end" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">首个比特到达时刻</text>
  </g>
</svg>
