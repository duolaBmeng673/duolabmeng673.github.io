<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" role="img">
  <title>路由聚合（构成超网）</title>
  <desc>路由器 R1 通过 R2 到达两个连续的 /17 网络，将路由表项聚合为一条 206.1.0.0/16 超网路由。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <line x1="64" y1="78" x2="244" y2="78" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M300 78 H380 V42 H464" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M380 78 V126 H464" fill="none" stroke="#1f2937" stroke-width="1.5"/>

    <circle cx="36" cy="78" r="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="36" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">R1</text>

    <circle cx="272" cy="78" r="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="272" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">R2</text>

    <rect x="464" y="8" width="248" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="588" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">网络 1</text>
    <text x="588" y="60" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">206.1.0.0/17</text>

    <rect x="464" y="92" width="248" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="588" y="120" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">网络 2</text>
    <text x="588" y="144" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">206.1.128.0/17</text>

    <rect x="8" y="188" width="368" height="76" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="192" y="218" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">R1 聚合后只需一条路由表项</text>
    <text x="192" y="246" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">206.1.0.0/16 → 下一跳 R2</text>
  </g>
</svg>
