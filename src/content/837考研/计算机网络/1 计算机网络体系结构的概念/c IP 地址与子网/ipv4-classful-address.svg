<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="720" height="368" role="img">
  <title>IPv4 分类地址结构（32 位）</title>
  <desc>展示 IPv4 A 类、B 类、C 类、D 类和 E 类地址的前缀标志位、网络号与主机号位数及首字节范围。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <g font-size="15" font-weight="400" fill="#4b5563">
      <text x="64" y="24" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">0</text>
      <text x="388" y="24" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">16 (bit)</text>
      <text x="712" y="24" text-anchor="end" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">32</text>
    </g>

    <g font-size="16" font-weight="600" fill="#1f2937" text-anchor="start">
      <text x="8" y="64" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">A 类</text>
      <text x="8" y="114" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">B 类</text>
      <text x="8" y="164" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">C 类</text>
      <text x="8" y="214" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">D 类</text>
      <text x="8" y="264" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">E 类</text>
    </g>

    <!-- Bars x=64..712 (total 648) -->
    <g stroke-width="1.5">
      <rect x="64" y="38" width="48" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <rect x="116" y="38" width="152" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="272" y="38" width="440" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>

      <rect x="64" y="88" width="56" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <rect x="124" y="88" width="216" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="344" y="88" width="368" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>

      <rect x="64" y="138" width="64" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <rect x="132" y="138" width="344" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="480" y="138" width="232" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>

      <rect x="64" y="188" width="72" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <rect x="140" y="188" width="572" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b"/>

      <rect x="64" y="238" width="72" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <rect x="140" y="238" width="572" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    </g>

    <g text-anchor="middle" font-size="15" font-weight="400">
      <text x="88" y="65" font-weight="600" fill="#1f2937">0</text>
      <text x="192" y="65" fill="#1e40af">网络号 (7位)</text>
      <text x="492" y="65" fill="#115e59">主机号 (24位)</text>

      <text x="92" y="115" font-weight="600" fill="#1f2937">10</text>
      <text x="232" y="115" fill="#1e40af">网络号 (14位)</text>
      <text x="528" y="115" fill="#115e59">主机号 (16位)</text>

      <text x="96" y="165" font-weight="600" fill="#1f2937">110</text>
      <text x="304" y="165" fill="#1e40af">网络号 (21位)</text>
      <text x="596" y="165" fill="#115e59">主机号 (8位)</text>

      <text x="100" y="215" font-weight="600" fill="#1f2937">1110</text>
      <text x="426" y="215" fill="#92400e">多播地址 (28位)</text>

      <text x="100" y="265" font-weight="600" fill="#1f2937">1111</text>
      <text x="426" y="265" fill="#4b5563">保留，留作今后使用</text>
    </g>

    <rect x="8" y="296" width="704" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="322" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">首字节范围：A 1~126（0、127 保留） · B 128~191</text>
    <text x="360" y="346" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">C 192~223 · D 224~239 · E 240~255</text>
  </g>
</svg>
