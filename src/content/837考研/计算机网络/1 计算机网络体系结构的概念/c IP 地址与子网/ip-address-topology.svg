<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 760 447" width="760" height="447" role="img">
  <title>IP 地址分配特点（同局域网同前缀 · 路由器多接口不同前缀）</title>
  <desc>展示 LAN1、LAN2、LAN3 三个局域网及点对点 /31 链路 N1、N2、N3 上主机与路由器接口的 IP 地址分配特点。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">IP 地址分配特点（同局域网同前缀 · 路由器多接口不同前缀）</text>

    <!-- LAN1 Group -->
    <rect x="24" y="64" width="216" height="128" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="40" y="92" text-anchor="start" font-size="16" font-weight="600" fill="#1e40af">LAN₁: 1.1.1.0/29</text>
    <rect x="88" y="128" width="88" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="132" y="151" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">交换机</text>
    <text x="40" y="132" text-anchor="start" font-size="12" font-weight="400" fill="#1e40af">1.1.1.3</text>
    <text x="184" y="132" text-anchor="start" font-size="12" font-weight="400" fill="#1e40af">1.1.1.1</text>
    <line x1="40" y1="146" x2="88" y2="146" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="176" y1="146" x2="224" y2="146" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- LAN3 Group -->
    <rect x="24" y="232" width="216" height="128" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="40" y="260" text-anchor="start" font-size="16" font-weight="600" fill="#1e40af">LAN₃: 1.1.1.16/29</text>
    <rect x="88" y="296" width="88" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="132" y="319" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">交换机</text>
    <text x="40" y="300" text-anchor="start" font-size="12" font-weight="400" fill="#1e40af">1.1.1.17</text>
    <text x="184" y="300" text-anchor="start" font-size="12" font-weight="400" fill="#1e40af">1.1.1.18</text>
    <line x1="40" y1="314" x2="88" y2="314" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="176" y1="314" x2="224" y2="314" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- LAN2 Group -->
    <rect x="520" y="136" width="216" height="156" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="536" y="164" text-anchor="start" font-size="16" font-weight="600" fill="#1e40af">LAN₂: 1.1.1.8/29</text>
    <rect x="584" y="200" width="88" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="628" y="223" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">交换机</text>
    <text x="536" y="204" text-anchor="start" font-size="12" font-weight="400" fill="#1e40af">1.1.1.9</text>
    <text x="680" y="204" text-anchor="start" font-size="12" font-weight="400" fill="#1e40af">1.1.1.10</text>
    <text x="628" y="276" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">1.1.1.11</text>
    <line x1="536" y1="218" x2="584" y2="218" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="672" y1="218" x2="720" y2="218" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="628" y1="236" x2="628" y2="256" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Orthogonal connections from LANs to Routers -->
    <line x1="224" y1="146" x2="312" y2="146" stroke="#1f2937" stroke-width="1.5"/>
    <text x="276" y="136" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">1.1.1.4</text>

    <line x1="224" y1="314" x2="312" y2="314" stroke="#1f2937" stroke-width="1.5"/>
    <text x="276" y="304" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">1.1.1.19</text>

    <line x1="472" y1="218" x2="536" y2="218" stroke="#1f2937" stroke-width="1.5"/>
    <text x="496" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">1.1.1.13</text>

    <!-- Orthogonal /31 links N1, N2, N3 -->
    <line x1="336" y1="168" x2="336" y2="292" stroke="#ef4444" stroke-width="2"/>
    <text x="292" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">N₂</text>
    <text x="292" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="#991b1b">1.1.1.26/31</text>

    <path d="M360 146 H448 V196" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="416" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">N₁: 1.1.1.24/31</text>

    <path d="M360 314 H448 V240" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="416" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">N₃: 1.1.1.28/31</text>

    <!-- Routers R1, R2, R3 (placed after lines) -->
    <circle cx="336" cy="146" r="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="336" y="151" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">R₁</text>

    <circle cx="336" cy="314" r="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="336" y="319" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">R₃</text>

    <circle cx="448" cy="218" r="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="448" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">R₂</text>

    <!-- Bottom note block -->
    <rect x="24" y="380" width="712" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="406" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">图中标注为主机或路由器接口的 IP 地址（以太网交换机无 IP 地址，仅工作在链路层）</text>
  </g>
</svg>
