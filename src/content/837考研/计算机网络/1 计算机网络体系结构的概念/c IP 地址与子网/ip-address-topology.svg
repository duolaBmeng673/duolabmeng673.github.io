<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img">
  <title>IP 地址分配特点（同局域网同前缀 · 路由器多接口不同前缀）</title>
  <desc>展示 LAN1、LAN2、LAN3 三个局域网及点对点 /31 链路 N1、N2、N3 上主机与路由器接口的 IP 地址分配特点。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- LAN1 Group (x=8..208, y=8..148) -->
    <rect x="8" y="8" width="200" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" data-role="group"/>
    <text x="20" y="34" text-anchor="start" font-size="16" font-weight="600" fill="#1e40af">LAN₁: 1.1.1.0/29</text>
    <rect x="64" y="84" width="88" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="108" y="110" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">交换机</text>
    <text x="18" y="68" text-anchor="start" font-size="15" font-weight="400" fill="#1e40af">1.1.1.3</text>
    <text x="198" y="68" text-anchor="end" font-size="15" font-weight="400" fill="#1e40af">1.1.1.1</text>
    <line x1="18" y1="104" x2="64" y2="104" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="152" y1="104" x2="198" y2="104" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- LAN3 Group (x=8..208, y=212..352) -->
    <rect x="8" y="212" width="200" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" data-role="group"/>
    <text x="20" y="238" text-anchor="start" font-size="16" font-weight="600" fill="#1e40af">LAN₃: 1.1.1.16/29</text>
    <rect x="64" y="288" width="88" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="108" y="314" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">交换机</text>
    <text x="16" y="272" text-anchor="start" font-size="15" font-weight="400" fill="#1e40af">1.1.1.17</text>
    <text x="200" y="272" text-anchor="end" font-size="15" font-weight="400" fill="#1e40af">1.1.1.18</text>
    <line x1="18" y1="308" x2="64" y2="308" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="152" y1="308" x2="198" y2="308" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- LAN2 Group (x=512..712, y=112..276) -->
    <rect x="512" y="112" width="200" height="164" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" data-role="group"/>
    <text x="524" y="138" text-anchor="start" font-size="16" font-weight="600" fill="#1e40af">LAN₂: 1.1.1.8/29</text>
    <rect x="568" y="180" width="88" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="612" y="206" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">交换机</text>
    <text x="522" y="164" text-anchor="start" font-size="15" font-weight="400" fill="#1e40af">1.1.1.9</text>
    <text x="702" y="164" text-anchor="end" font-size="15" font-weight="400" fill="#1e40af">1.1.1.10</text>
    <text x="612" y="262" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">1.1.1.11</text>
    <line x1="522" y1="200" x2="568" y2="200" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="656" y1="200" x2="700" y2="200" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="612" y1="220" x2="612" y2="240" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Orthogonal links LANs -> Routers -->
    <line x1="198" y1="104" x2="292" y2="104" stroke="#1f2937" stroke-width="1.5"/>
    <text x="250" y="92" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">1.1.1.4</text>

    <line x1="198" y1="308" x2="292" y2="308" stroke="#1f2937" stroke-width="1.5"/>
    <text x="250" y="296" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">1.1.1.19</text>

    <line x1="440" y1="200" x2="522" y2="200" stroke="#1f2937" stroke-width="1.5"/>
    <text x="476" y="188" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">1.1.1.13</text>

    <!-- /31 links N1, N2, N3 -->
    <line x1="316" y1="128" x2="316" y2="284" stroke="#ef4444" stroke-width="2"/>
    <text x="266" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">N₂</text>
    <text x="266" y="196" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">1.1.1.26/31</text>

    <path d="M340 104 H416 V176" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="404" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">N₁: 1.1.1.24/31</text>

    <path d="M340 308 H416 V224" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="404" y="334" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">N₃: 1.1.1.28/31</text>

    <!-- Routers R1, R2, R3 -->
    <circle cx="316" cy="104" r="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="316" y="110" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">R₁</text>

    <circle cx="316" cy="308" r="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="316" y="314" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">R₃</text>

    <circle cx="416" cy="200" r="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="416" y="206" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">R₂</text>

    <rect x="8" y="384" width="704" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="412" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">图中标注为主机或路由器接口的 IP 地址</text>
    <text x="360" y="436" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">（以太网交换机无 IP 地址，仅工作在链路层）</text>
  </g>
</svg>
