<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165" width="720" height="165" role="img">
  <title>CIDR 斜线记法：128.14.35.7/20（32 位）</title>
  <desc>展示 128.14.35.7/20 的 32 位划分：前 20 位为网络前缀，后 12 位为主机号，并附对应的二进制与点分十进制分解。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="8" y="24" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">示例：128.14.35.7/20（32 位）</text>

    <rect x="8" y="40" width="440" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="456" y="40" width="256" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>

    <text x="228" y="68" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">网络前缀（前 20 位）</text>
    <text x="584" y="68" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">主机号（后 12 位）</text>

    <text x="228" y="118" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">10000000 00001110 0010</text>
    <text x="584" y="118" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">0011 00000111</text>

    <text x="228" y="152" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">128 . 14 . (35 的高 4 位)</text>
    <text x="584" y="152" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">(35 的低 4 位) . 7</text>
  </g>
</svg>
