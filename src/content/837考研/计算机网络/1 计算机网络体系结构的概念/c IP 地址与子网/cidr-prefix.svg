<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 760 195" width="760" height="195" role="img">
  <title>CIDR 斜线记法：128.14.35.7/20（32 位）</title>
  <desc>展示 128.14.35.7/20 的 32 位划分：前 20 位为网络前缀，后 12 位为主机号，并附对应的二进制与点分十进制分解。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">CIDR 斜线记法：128.14.35.7/20（32 位）</text>

    <!-- 20-bit prefix and 12-bit host -->
    <rect x="24" y="68" width="440" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="472" y="68" width="264" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>

    <text x="244" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">网络前缀（前 20 位）</text>
    <text x="604" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">主机号（后 12 位）</text>

    <!-- Binary alignment -->
    <text x="244" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">10000000 00001110 0010</text>
    <text x="604" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">0011 00000111</text>

    <!-- Decimal breakdown -->
    <text x="244" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">128 . 14 . (35 的高 4 位)</text>
    <text x="604" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">(35 的低 4 位) . 7</text>
  </g>
</svg>
