<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" width="720" height="444" role="img">
  <title>DNS 迭代查询与递归查询工作原理</title>
  <desc>左侧对比本地域名服务器向根、顶级、权限服务器发起迭代查询的 8 个步骤，右侧对比全部采用递归查询的 8 个步骤。</desc>
  <defs>
    <marker id="dns-res-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Left Group: Iterative (x=8..352, w=344) -->
    <rect x="8" y="8" width="344" height="428" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="24" y="36" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(a) 本地服务器采用迭代查询</text>

    <rect x="24" y="148" width="100" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="74" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">本地域名</text>
    <text x="74" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">服务器</text>

    <rect x="24" y="280" width="100" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="74" y="308" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">主机</text>

    <rect x="208" y="56" width="128" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="272" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">根域名服务器</text>

    <rect x="208" y="148" width="128" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="272" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">顶级域名</text>
    <text x="272" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">服务器</text>

    <rect x="208" y="260" width="128" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="272" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">权限域名</text>
    <text x="272" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">服务器</text>

    <line x1="74" y1="276" x2="74" y2="220" stroke="#1f2937" stroke-width="1.5" marker-start="url(#dns-res-arrow)" marker-end="url(#dns-res-arrow)"/>
    <text x="64" y="254" text-anchor="end" font-size="15" font-weight="600" fill="#92400e">① ⑧</text>
    <text x="86" y="254" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">递归</text>

    <path d="M128 162 H142 V80 H204" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-start="url(#dns-res-arrow)" marker-end="url(#dns-res-arrow)"/>
    <text x="176" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">② ③</text>

    <line x1="128" y1="182" x2="204" y2="182" stroke="#3b82f6" stroke-width="1.5" marker-start="url(#dns-res-arrow)" marker-end="url(#dns-res-arrow)"/>
    <text x="176" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">④ ⑤</text>

    <path d="M128 202 H142 V294 H204" fill="none" stroke="#14b8a6" stroke-width="1.5" marker-start="url(#dns-res-arrow)" marker-end="url(#dns-res-arrow)"/>
    <text x="176" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">⑥ ⑦</text>

    <text x="180" y="382" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">本地服务器依次去问，</text>
    <text x="180" y="406" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">根/顶级只回答“下一步该问谁”</text>

    <!-- Right Group: Recursive (x=368..712, w=344) -->
    <rect x="368" y="8" width="344" height="428" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="384" y="36" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(b) 本地服务器采用递归查询</text>

    <rect x="384" y="148" width="100" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="434" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">本地域名</text>
    <text x="434" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">服务器</text>

    <rect x="384" y="280" width="100" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="434" y="308" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">主机</text>

    <rect x="568" y="56" width="128" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="632" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">根域名服务器</text>

    <rect x="568" y="148" width="128" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="632" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">顶级域名</text>
    <text x="632" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">服务器</text>

    <rect x="568" y="260" width="128" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="632" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">权限域名</text>
    <text x="632" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">服务器</text>

    <line x1="434" y1="276" x2="434" y2="220" stroke="#1f2937" stroke-width="1.5" marker-start="url(#dns-res-arrow)" marker-end="url(#dns-res-arrow)"/>
    <text x="424" y="254" text-anchor="end" font-size="15" font-weight="600" fill="#92400e">① ⑧</text>

    <path d="M488 182 H524 V80 H564" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-start="url(#dns-res-arrow)" marker-end="url(#dns-res-arrow)"/>
    <text x="536" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">② ⑦</text>

    <line x1="632" y1="108" x2="632" y2="144" stroke="#3b82f6" stroke-width="1.5" marker-start="url(#dns-res-arrow)" marker-end="url(#dns-res-arrow)"/>
    <text x="614" y="132" text-anchor="end" font-size="15" font-weight="600" fill="#1e40af">③ ⑥</text>

    <line x1="632" y1="220" x2="632" y2="256" stroke="#14b8a6" stroke-width="1.5" marker-start="url(#dns-res-arrow)" marker-end="url(#dns-res-arrow)"/>
    <text x="614" y="244" text-anchor="end" font-size="15" font-weight="600" fill="#115e59">④ ⑤</text>

    <text x="540" y="382" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">根服务器代为往下查</text>
    <text x="540" y="406" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">（根负载过高，实际几乎不用）</text>
  </g>
</svg>
