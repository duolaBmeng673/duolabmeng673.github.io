<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" role="img">
  <title>DNS 域名服务器层次结构</title>
  <desc>展示根域名服务器、顶级域名服务器（com、org、cn）与下级权限域名服务器之间的层次管辖关系。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <g font-size="15" font-weight="600" fill="#4b5563" text-anchor="start">
      <text x="8" y="36" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">根域名服务器</text>
      <text x="8" y="128" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">顶级域名服务器</text>
      <text x="8" y="256" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">权限域名服务器</text>
    </g>

    <g stroke="#94a3b8" stroke-width="1.5" fill="none">
      <path d="M412 52 V72 H224 V90"/>
      <path d="M412 52 V90"/>
      <path d="M412 72 H616 V90"/>
      <line x1="224" y1="158" x2="224" y2="208"/>
      <line x1="616" y1="158" x2="616" y2="180"/>
      <line x1="616" y1="224" x2="616" y2="246"/>
    </g>

    <rect x="332" y="8" width="160" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="412" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">根域名服务器</text>

    <g fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5">
      <rect x="148" y="90" width="152" height="68" rx="8"/>
      <rect x="336" y="90" width="152" height="68" rx="8"/>
      <rect x="540" y="90" width="152" height="68" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">
      <text x="224" y="120">com 域名</text><text x="224" y="142">服务器</text>
      <text x="412" y="120">org 域名</text><text x="412" y="142">服务器</text>
      <text x="616" y="120">cn 域名</text><text x="616" y="142">服务器</text>
    </g>

    <g fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5">
      <rect x="144" y="208" width="160" height="68" rx="8"/>
      <rect x="520" y="180" width="192" height="44" rx="8"/>
      <rect x="520" y="246" width="192" height="68" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">
      <text x="224" y="238">cskaoyan.com</text><text x="224" y="260">域名服务器</text>
      <text x="616" y="208">edu.cn 域名服务器</text>
      <text x="616" y="276">hust.edu.cn</text><text x="616" y="298">域名服务器</text>
    </g>
  </g>
</svg>
