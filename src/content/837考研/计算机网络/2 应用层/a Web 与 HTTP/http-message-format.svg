<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" role="img">
  <title>HTTP 请求报文与响应报文结构</title>
  <desc>对比 HTTP 请求报文与响应报文的四段组成：开始行（请求行或状态行）、首部行、空行 CRLF 与实体主体。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="176" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">(a) HTTP 请求报文</text>
    <text x="544" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">(b) HTTP 响应报文</text>

    <!-- Request (x=8..344, w=336) -->
    <g stroke-width="1.5">
      <rect x="8" y="40" width="336" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="8" y="114" width="336" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="8" y="188" width="336" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <rect x="8" y="238" width="336" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
    </g>
    <g text-anchor="middle">
      <text x="176" y="68" font-size="16" font-weight="600" fill="#1e40af">请求行</text>
      <text x="176" y="92" font-size="15" font-weight="400" fill="#4b5563">方法 SP URL SP 版本 CRLF</text>
      <text x="176" y="142" font-size="16" font-weight="600" fill="#92400e">首部行</text>
      <text x="176" y="166" font-size="15" font-weight="400" fill="#4b5563">首部字段名 : 值 CRLF ……</text>
      <text x="176" y="216" font-size="15" font-weight="400" fill="#1f2937">CRLF（空行，分隔首部与主体）</text>
      <text x="176" y="266" font-size="16" font-weight="600" fill="#115e59">实体主体</text>
      <text x="176" y="290" font-size="15" font-weight="400" fill="#4b5563">（通常不用）</text>
    </g>

    <!-- Response (x=376..712, w=336) -->
    <g stroke-width="1.5">
      <rect x="376" y="40" width="336" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <rect x="376" y="114" width="336" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <rect x="376" y="188" width="336" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
      <rect x="376" y="238" width="336" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6"/>
    </g>
    <g text-anchor="middle">
      <text x="544" y="68" font-size="16" font-weight="600" fill="#1e40af">状态行</text>
      <text x="544" y="92" font-size="15" font-weight="400" fill="#4b5563">版本 SP 状态码 SP 短语 CRLF</text>
      <text x="544" y="142" font-size="16" font-weight="600" fill="#92400e">首部行</text>
      <text x="544" y="166" font-size="15" font-weight="400" fill="#4b5563">首部字段名 : 值 CRLF ……</text>
      <text x="544" y="216" font-size="15" font-weight="400" fill="#1f2937">CRLF（空行，分隔首部与主体）</text>
      <text x="544" y="266" font-size="16" font-weight="600" fill="#115e59">实体主体</text>
      <text x="544" y="290" font-size="15" font-weight="400" fill="#4b5563">（有些响应报文不用）</text>
    </g>

    <rect x="8" y="328" width="704" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="358" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">两种报文都由三部分组成，区别仅在“开始行”：请求行 vs 状态行</text>
  </g>
</svg>
