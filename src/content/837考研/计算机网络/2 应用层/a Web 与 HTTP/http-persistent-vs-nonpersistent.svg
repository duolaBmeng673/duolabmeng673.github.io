<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 760 515" width="760" height="515" role="img">
  <title>HTTP 非持续连接与持续连接时间对比</title>
  <desc>对比 HTTP 非持续连接（每个对象建立一次 TCP 连接，耗时 2 RTT 加传输时间）与持续连接（复用同一条 TCP 连接传输多个对象）。</desc>
  <defs>
    <marker id="http-conn-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">HTTP 非持续连接 vs 持续连接</text>

    <!-- Left panel: Non-persistent -->
    <rect x="24" y="60" width="344" height="432" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="40" y="88" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">非持续连接（请求一个文档）</text>

    <!-- Left 72px RTT column (x=28..100) -->
    <path d="M96 164 H88 V220 H96" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="80" y="196" text-anchor="end" font-size="12" font-weight="400" fill="#4b5563">1 RTT</text>

    <path d="M96 276 H88 V332 H96" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="80" y="308" text-anchor="end" font-size="12" font-weight="400" fill="#4b5563">1 RTT</text>

    <!-- Participants -->
    <rect x="108" y="100" width="80" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="148" y="123" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">客户端</text>

    <rect x="268" y="100" width="80" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="308" y="123" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">服务器</text>

    <line x1="148" y1="136" x2="148" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="308" y1="136" x2="308" y2="360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Horizontal arrows (row spacing = 56, labels 10px above line) -->
    <line x1="148" y1="168" x2="304" y2="168" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="228" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">SYN（请求建立连接）</text>

    <line x1="308" y1="224" x2="152" y2="224" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="228" y="214" text-anchor="middle" font-size="12" font-weight="400" fill="#115e59">SYN + ACK</text>

    <line x1="148" y1="280" x2="304" y2="280" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="228" y="270" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">ACK + HTTP 请求报文</text>

    <line x1="308" y1="336" x2="152" y2="336" stroke="#14b8a6" stroke-width="2" marker-end="url(#http-conn-arrow)"/>
    <text x="228" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">HTTP 响应（传输文档）</text>

    <text x="196" y="396" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">每次建连都需 1 RTT，传输需另 1 RTT</text>

    <rect x="44" y="428" width="304" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="196" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">每个对象 = 2 RTT + 传输时间</text>

    <!-- Right panel: Persistent -->
    <rect x="384" y="60" width="352" height="432" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="400" y="88" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">持续连接（同一连接传多个对象）</text>

    <rect x="416" y="100" width="80" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="456" y="123" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">客户端</text>

    <rect x="624" y="100" width="80" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="664" y="123" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">服务器</text>

    <line x1="456" y1="136" x2="456" y2="416" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="664" y1="136" x2="664" y2="416" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Horizontal arrows -->
    <line x1="456" y1="168" x2="660" y2="168" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="560" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">SYN</text>

    <line x1="664" y1="216" x2="460" y2="216" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="560" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#115e59">SYN + ACK</text>

    <line x1="456" y1="264" x2="660" y2="264" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="560" y="254" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">ACK + 请求 Web 页面</text>

    <line x1="664" y1="312" x2="460" y2="312" stroke="#14b8a6" stroke-width="2" marker-end="url(#http-conn-arrow)"/>
    <text x="560" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">传输 Web 页面</text>

    <line x1="456" y1="360" x2="660" y2="360" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="560" y="350" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">请求图片对象</text>

    <line x1="664" y1="408" x2="460" y2="408" stroke="#14b8a6" stroke-width="2" marker-end="url(#http-conn-arrow)"/>
    <text x="560" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">传输图片</text>

    <rect x="404" y="428" width="312" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="560" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">只建连一次，后续对象省去建连 RTT</text>
  </g>
</svg>
