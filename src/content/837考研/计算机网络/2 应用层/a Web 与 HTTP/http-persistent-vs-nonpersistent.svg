<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" width="720" height="504" role="img">
  <title>HTTP 非持续连接与持续连接时间对比</title>
  <desc>对比 HTTP 非持续连接（每个对象建立一次 TCP 连接，耗时 2 RTT 加传输时间）与持续连接（复用同一条 TCP 连接传输多个对象）。</desc>
  <defs>
    <marker id="http-conn-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Left panel (x=8..352, w=344) -->
    <rect x="8" y="8" width="344" height="488" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="24" y="36" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">非持续连接（请求一个文档）</text>

    <!-- RTT column on left -->
    <path d="M84 128 H76 V184 H84" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="68" y="162" text-anchor="end" font-size="15" font-weight="400" fill="#4b5563">1 RTT</text>

    <path d="M84 240 H76 V296 H84" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="68" y="274" text-anchor="end" font-size="15" font-weight="400" fill="#4b5563">1 RTT</text>

    <rect x="82" y="54" width="84" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="124" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">客户端</text>

    <rect x="260" y="54" width="84" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="302" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">服务器</text>

    <line x1="124" y1="94" x2="124" y2="336" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="302" y1="94" x2="302" y2="336" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <line x1="124" y1="132" x2="298" y2="132" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="213" y="120" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">SYN（请求建连）</text>

    <line x1="302" y1="188" x2="128" y2="188" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="213" y="176" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">SYN + ACK</text>

    <line x1="124" y1="244" x2="298" y2="244" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="213" y="232" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">ACK + HTTP 请求</text>

    <line x1="302" y1="300" x2="128" y2="300" stroke="#14b8a6" stroke-width="2" marker-end="url(#http-conn-arrow)"/>
    <text x="213" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">HTTP 响应（传输文档）</text>

    <text x="180" y="366" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">每次建连都需 1 RTT，</text>
    <text x="180" y="390" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">传输需另 1 RTT</text>

    <rect x="24" y="424" width="312" height="48" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="180" y="454" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">每个对象 = 2 RTT + 传输时间</text>

    <!-- Right panel (x=368..712, w=344) -->
    <rect x="368" y="8" width="344" height="488" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="384" y="36" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">持续连接（同一连接传多个对象）</text>

    <rect x="396" y="54" width="84" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="438" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">客户端</text>

    <rect x="600" y="54" width="84" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="642" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">服务器</text>

    <line x1="438" y1="94" x2="438" y2="404" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="642" y1="94" x2="642" y2="404" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <line x1="438" y1="132" x2="638" y2="132" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="540" y="120" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">SYN</text>

    <line x1="642" y1="184" x2="442" y2="184" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="540" y="172" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">SYN + ACK</text>

    <line x1="438" y1="236" x2="638" y2="236" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="540" y="224" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">ACK + 请求 Web 页面</text>

    <line x1="642" y1="288" x2="442" y2="288" stroke="#14b8a6" stroke-width="2" marker-end="url(#http-conn-arrow)"/>
    <text x="540" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">传输 Web 页面</text>

    <line x1="438" y1="340" x2="638" y2="340" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#http-conn-arrow)"/>
    <text x="540" y="328" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">请求图片对象</text>

    <line x1="642" y1="392" x2="442" y2="392" stroke="#14b8a6" stroke-width="2" marker-end="url(#http-conn-arrow)"/>
    <text x="540" y="380" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">传输图片</text>

    <rect x="384" y="424" width="312" height="48" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="540" y="454" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">只建连一次，后续对象省去建连 RTT</text>
  </g>
</svg>
