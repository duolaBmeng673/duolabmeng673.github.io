<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" width="720" height="232" role="img">
  <title>电子邮件系统组成与协议分工</title>
  <desc>展示发件人用户代理、发送方邮件服务器、接收方邮件服务器与收件人用户代理之间的 SMTP 推协议与 POP3/IMAP 拉协议。</desc>
  <defs>
    <marker id="email-sys-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- 4 Boxes across x=8..712: x=8, 200, 392, 584 (w=128) -->
    <rect x="8" y="64" width="128" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="72" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">发件人</text>
    <text x="72" y="116" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">用户代理</text>

    <rect x="200" y="64" width="128" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="264" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">发送方</text>
    <text x="264" y="116" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">邮件服务器</text>

    <rect x="392" y="64" width="128" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="456" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">接收方</text>
    <text x="456" y="116" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">邮件服务器</text>

    <rect x="584" y="64" width="128" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="648" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">收件人</text>
    <text x="648" y="116" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">用户代理</text>

    <line x1="136" y1="98" x2="196" y2="98" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#email-sys-arrow)"/>
    <line x1="328" y1="98" x2="388" y2="98" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#email-sys-arrow)"/>
    <line x1="584" y1="98" x2="524" y2="98" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#email-sys-arrow)"/>

    <!-- Protocol labels cleanly above arrows (y=24 / 46, gap >= 18px above boxes!) -->
    <text x="168" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">SMTP</text>
    <text x="168" y="46" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">(TCP / 25)</text>

    <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">SMTP</text>
    <text x="360" y="46" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">(直接传送)</text>

    <text x="552" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">POP3 / IMAP</text>
    <text x="552" y="46" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">(TCP, 拉取)</text>

    <rect x="8" y="156" width="704" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="184" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">推（Push）：发件人 → 发送方服务器 → 接收方服务器</text>
    <text x="360" y="208" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">拉（Pull）：收件人从邮箱取回</text>
  </g>
</svg>
