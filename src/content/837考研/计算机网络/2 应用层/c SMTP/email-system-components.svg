<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" role="img">
  <title>电子邮件系统组成与协议分工</title>
  <desc>展示发件人用户代理、发送方邮件服务器、接收方邮件服务器与收件人用户代理之间的 SMTP 推协议与 POP3/IMAP 拉协议。</desc>
  <defs>
    <marker id="email-sys-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">电子邮件系统组成与协议分工</text>

    <!-- 4 Boxes (width=128) -->
    <rect x="24" y="116" width="128" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="88" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">发件人</text>
    <text x="88" y="164" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">用户代理</text>

    <rect x="224" y="116" width="128" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="288" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">发送方</text>
    <text x="288" y="164" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">邮件服务器</text>

    <rect x="424" y="116" width="128" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="488" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">接收方</text>
    <text x="488" y="164" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">邮件服务器</text>

    <rect x="608" y="116" width="128" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="672" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">收件人</text>
    <text x="672" y="164" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">用户代理</text>

    <!-- Arrows -->
    <line x1="152" y1="148" x2="220" y2="148" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#email-sys-arrow)"/>
    <line x1="352" y1="148" x2="420" y2="148" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#email-sys-arrow)"/>
    <line x1="608" y1="148" x2="556" y2="148" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#email-sys-arrow)"/>

    <!-- Labels placed cleanly above arrows -->
    <text x="188" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">SMTP</text>
    <text x="188" y="100" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">(TCP / 25)</text>

    <text x="388" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">SMTP</text>
    <text x="388" y="100" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">(直接传送)</text>

    <text x="580" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">POP3 / IMAP</text>
    <text x="580" y="100" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">(TCP, 拉取)</text>

    <!-- Bottom note block -->
    <rect x="24" y="216" width="712" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="243" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">推（Push）：发件人 → 发送方服务器 → 接收方服务器　｜　拉（Pull）：收件人从邮箱取回</text>
  </g>
</svg>
