<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" role="img">
  <title>MIME 与 SMTP 的关系（不改动 SMTP）</title>
  <desc>展示发送端先经 MIME 将非 ASCII 数据转为 7 位 ASCII 码再交由 SMTP 传输，接收端经 MIME 逆转换还原非 ASCII 数据。</desc>
  <defs>
    <marker id="mime-smtp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Left stack (x=8..168, w=160) -->
    <rect x="8" y="8" width="160" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <rect x="8" y="114" width="160" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="8" y="220" width="160" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <g text-anchor="middle" font-size="16" font-weight="600">
      <text x="88" y="36" fill="#115e59">用户</text>
      <text x="88" y="142" fill="#92400e">MIME</text>
      <text x="88" y="248" fill="#1e40af">SMTP</text>
    </g>

    <!-- Right stack (x=552..712, w=160) -->
    <rect x="552" y="8" width="160" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <rect x="552" y="114" width="160" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="552" y="220" width="160" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <g text-anchor="middle" font-size="16" font-weight="600">
      <text x="632" y="36" fill="#115e59">用户</text>
      <text x="632" y="142" fill="#92400e">MIME</text>
      <text x="632" y="248" fill="#1e40af">SMTP</text>
    </g>

    <line x1="88" y1="56" x2="88" y2="110" stroke="#1f2937" stroke-width="1.5" marker-start="url(#mime-smtp-arrow)" marker-end="url(#mime-smtp-arrow)"/>
    <line x1="88" y1="162" x2="88" y2="216" stroke="#1f2937" stroke-width="1.5" marker-start="url(#mime-smtp-arrow)" marker-end="url(#mime-smtp-arrow)"/>
    <line x1="632" y1="56" x2="632" y2="110" stroke="#1f2937" stroke-width="1.5" marker-start="url(#mime-smtp-arrow)" marker-end="url(#mime-smtp-arrow)"/>
    <line x1="632" y1="162" x2="632" y2="216" stroke="#1f2937" stroke-width="1.5" marker-start="url(#mime-smtp-arrow)" marker-end="url(#mime-smtp-arrow)"/>
    <line x1="172" y1="242" x2="548" y2="242" stroke="#3b82f6" stroke-width="1.5" marker-start="url(#mime-smtp-arrow)" marker-end="url(#mime-smtp-arrow)"/>

    <text x="104" y="88" text-anchor="start" font-size="15" font-weight="400" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">非 ASCII 码</text>
    <text x="104" y="194" text-anchor="start" font-size="15" font-weight="400" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">7 位 ASCII 码</text>
    <text x="616" y="88" text-anchor="end" font-size="15" font-weight="400" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">非 ASCII 码</text>
    <text x="616" y="194" text-anchor="end" font-size="15" font-weight="400" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">7 位 ASCII 码</text>
    <text x="360" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">7 位 ASCII 码</text>
  </g>
</svg>
