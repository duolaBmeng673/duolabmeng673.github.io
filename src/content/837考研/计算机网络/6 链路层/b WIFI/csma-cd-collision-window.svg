<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" width="720" height="382" role="img">
  <title>CSMA/CD 最坏冲突检测时间：争用期 2τ</title>
  <desc>展示单程传播时延为 τ 时，站点 A 与站点 B 在最坏情况下经过 2τ 争用期检测到冲突的时序过程，以及最短帧长与最长帧长结论。</desc>
  <defs>
    <marker id="csma-cd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="104" y="8" width="104" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="156" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">站点 A</text>

    <rect x="336" y="8" width="104" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="388" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">站点 B</text>

    <line x1="156" y1="50" x2="156" y2="274" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="388" y1="50" x2="388" y2="274" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <g font-size="15" text-anchor="end">
      <text x="84" y="100" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">t = 0</text>
      <text x="84" y="166" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">t = τ − δ</text>
      <text x="84" y="252" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">t = 2τ − δ</text>
    </g>

    <!-- Row 1 -->
    <line x1="156" y1="96" x2="384" y2="96" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#csma-cd-arrow)"/>
    <text x="272" y="84" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">A 的信号向右传播</text>
    <text x="456" y="100" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">A 开始发送数据</text>

    <!-- Row 2 -->
    <line x1="156" y1="162" x2="232" y2="162" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#csma-cd-arrow)"/>
    <line x1="388" y1="162" x2="316" y2="162" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#csma-cd-arrow)"/>
    <rect x="236" y="140" width="76" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="274" y="168" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">冲突</text>

    <g text-anchor="start" font-size="15" font-weight="400">
      <text x="456" y="142" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">B 尚未收到 A 的信号，</text>
      <text x="456" y="164" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">误判空闲并开始发送</text>
      <text x="456" y="190" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">t = τ − δ/2 发生碰撞</text>
      <text x="456" y="212" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">→ t = τ 处 B 发现冲突</text>
    </g>

    <!-- Row 3 -->
    <line x1="388" y1="248" x2="160" y2="248" stroke="#ef4444" stroke-width="2" marker-end="url(#csma-cd-arrow)"/>
    <text x="272" y="236" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">碰撞干扰信号返回 A</text>
    <text x="456" y="252" text-anchor="start" font-size="15" font-weight="400" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">A 检测到冲突，停止发送</text>

    <rect x="8" y="298" width="704" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="328" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">单程传播时延为 τ，最坏检测时间 = 2τ（争用期），最短帧长 = 2τ × 数据传输速率</text>
    <text x="360" y="356" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">10 Mb/s 以太网争用期 51.2 μs → 最短帧长 64 B，最大帧长 1518 B</text>
  </g>
</svg>
