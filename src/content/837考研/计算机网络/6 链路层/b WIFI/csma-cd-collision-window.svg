<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" role="img">
  <title>CSMA/CD 最坏冲突检测时间：争用期 2τ</title>
  <desc>展示单程传播时延为 τ 时，站点 A 与站点 B 在最坏情况下经过 2τ 争用期检测到冲突的时序过程，以及最短帧长与最长帧长结论。</desc>
  <defs>
    <marker id="csma-cd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">CSMA/CD 最坏冲突检测时间：争用期 2τ（单程传播时延为 τ）</text>

    <!-- Participants -->
    <rect x="128" y="64" width="96" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="176" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">站点 A</text>

    <rect x="376" y="64" width="96" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="424" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">站点 B</text>

    <!-- Lifelines (1px dashed neutral, explicit end at y=312) -->
    <line x1="176" y1="104" x2="176" y2="312" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="424" y1="104" x2="424" y2="312" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Left 72px time column (x=24..96) -->
    <text x="92" y="156" text-anchor="end" font-size="12" font-weight="400" fill="#4b5563">t = 0</text>
    <text x="92" y="212" text-anchor="end" font-size="12" font-weight="400" fill="#4b5563">t = τ − δ</text>
    <text x="92" y="276" text-anchor="end" font-size="12" font-weight="400" fill="#991b1b">t = 2τ − δ</text>

    <!-- Row 1 (y=152): A sends right -->
    <line x1="176" y1="152" x2="420" y2="152" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#csma-cd-arrow)"/>
    <text x="300" y="140" text-anchor="middle" font-size="14" font-weight="400" fill="#1e40af">A 的信号向右传播</text>
    <text x="444" y="156" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">A 开始发送数据</text>

    <!-- Row 2 (y=208): B sends and collides -->
    <line x1="176" y1="208" x2="256" y2="208" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#csma-cd-arrow)"/>
    <line x1="424" y1="208" x2="344" y2="208" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#csma-cd-arrow)"/>
    <rect x="260" y="188" width="80" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="300" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">冲突</text>

    <text x="444" y="196" text-anchor="start" font-size="12" font-weight="400" fill="#115e59">B 尚未收到 A 的信号，误判空闲并发送</text>
    <text x="444" y="218" text-anchor="start" font-size="12" font-weight="400" fill="#991b1b">t = τ − δ/2 发生碰撞</text>
    <text x="444" y="236" text-anchor="start" font-size="12" font-weight="400" fill="#991b1b">→ t = τ 处 B 发现冲突</text>

    <!-- Row 3 (y=272): collision interference returns to A (row spacing >= 56) -->
    <line x1="424" y1="272" x2="180" y2="272" stroke="#ef4444" stroke-width="2" marker-end="url(#csma-cd-arrow)"/>
    <text x="300" y="260" text-anchor="middle" font-size="14" font-weight="400" fill="#991b1b">碰撞干扰信号返回 A</text>
    <text x="444" y="276" text-anchor="start" font-size="12" font-weight="400" fill="#991b1b">A 检测到冲突，停止发送</text>

    <!-- Bottom note block (margin >= 24) -->
    <rect x="24" y="344" width="712" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="370" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">最短帧长 = 2τ × 数据传输速率（10 Mb/s 以太网争用期 51.2 μs → 最短帧长 64 B，最大帧长 1518 B）</text>
  </g>
</svg>
