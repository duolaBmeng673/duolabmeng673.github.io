<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img">
  <title>Wi-Fi（802.11）隐蔽站问题与 RTS / CTS 信道预约</title>
  <desc>上方展示隐蔽站 A 与 B 同时向 AP 发送引发冲突，下方按时序图模板展示 DIFS、SIFS、RTS、CTS、DATA、ACK 及 NAV 推迟访问预约机制。</desc>
  <defs>
    <marker id="wifi-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Top Group: (a) Hidden Terminal -->
    <rect x="8" y="8" width="704" height="156" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="24" y="36" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(a) 隐蔽站导致冲突</text>

    <rect x="24" y="72" width="60" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="54" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">A</text>

    <rect x="136" y="72" width="68" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="170" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">AP</text>

    <rect x="256" y="72" width="60" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="286" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">B</text>

    <line x1="84" y1="94" x2="132" y2="94" stroke="#ef4444" stroke-width="2" marker-end="url(#wifi-arrow)"/>
    <line x1="256" y1="94" x2="208" y2="94" stroke="#ef4444" stroke-width="2" marker-end="url(#wifi-arrow)"/>

    <rect x="344" y="34" width="352" height="114" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="520" y="64" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">A 与 B 互在信号覆盖范围外</text>
    <text x="520" y="92" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">两者同时认为信道空闲并向 AP 发送</text>
    <text x="520" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">→ 在 AP 处发生冲突</text>

    <!-- Bottom Group: (b) RTS / CTS Sequence -->
    <rect x="8" y="180" width="704" height="366" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="24" y="210" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(b) 使用 RTS 与 CTS 避免冲突（虚拟载波监听）</text>

    <!-- Interval column -->
    <path d="M96 276 H86 V300 H96" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="78" y="294" text-anchor="end" font-size="15" font-weight="600" fill="#92400e">DIFS</text>

    <path d="M96 322 H86 V350 H96" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="78" y="342" text-anchor="end" font-size="15" font-weight="600" fill="#92400e">SIFS</text>

    <path d="M96 382 H86 V410 H96" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="78" y="402" text-anchor="end" font-size="15" font-weight="600" fill="#92400e">SIFS</text>

    <path d="M96 442 H86 V470 H96" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="78" y="462" text-anchor="end" font-size="15" font-weight="600" fill="#92400e">SIFS</text>

    <!-- Participants -->
    <rect x="116" y="226" width="80" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="156" y="253" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">源站</text>

    <rect x="308" y="226" width="112" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="364" y="253" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">AP / 目的</text>

    <rect x="504" y="226" width="120" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="564" y="253" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">所有其他站</text>

    <line x1="156" y1="268" x2="156" y2="528" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="364" y1="268" x2="364" y2="528" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="564" y1="268" x2="564" y2="528" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Horizontal message arrows (60px spacing: 306, 366, 426, 486) -->
    <line x1="156" y1="306" x2="360" y2="306" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#wifi-arrow)"/>
    <text x="260" y="294" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">RTS（预约请求）</text>

    <line x1="364" y1="366" x2="160" y2="366" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#wifi-arrow)"/>
    <text x="260" y="354" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">CTS（允许发送）</text>

    <line x1="364" y1="366" x2="554" y2="366" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#wifi-arrow)"/>
    <text x="464" y="354" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">CTS（广播监听）</text>

    <line x1="156" y1="426" x2="360" y2="426" stroke="#3b82f6" stroke-width="2" marker-end="url(#wifi-arrow)"/>
    <text x="260" y="414" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">DATA 数据帧</text>

    <line x1="364" y1="486" x2="160" y2="486" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#wifi-arrow)"/>
    <text x="260" y="474" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">ACK（确认）</text>

    <!-- Activation bar + NAV -->
    <rect x="558" y="374" width="12" height="132" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" data-role="activation"/>
    <text x="582" y="424" text-anchor="start" font-size="15" font-weight="600" fill="#92400e">推迟访问</text>
    <text x="582" y="450" text-anchor="start" font-size="15" font-weight="400" fill="#92400e">(NAV 计时)</text>

    <rect x="8" y="562" width="704" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="590" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">RTS 持续时间 = SIFS + CTS + SIFS + DATA + SIFS + ACK</text>
    <text x="360" y="616" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">CTS 持续时间 = SIFS + DATA + SIFS + ACK</text>
  </g>
</svg>
