<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 760 511" width="760" height="511" role="img">
  <title>Wi-Fi（802.11）隐蔽站问题与 RTS / CTS 信道预约</title>
  <desc>左侧展示隐蔽站 A 与 B 同时向 AP 发送引发冲突，右侧按时序图模板展示 DIFS、SIFS、RTS、CTS、DATA、ACK 及 NAV 推迟访问预约机制。</desc>
  <defs>
    <marker id="wifi-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">Wi-Fi（802.11）隐蔽站问题与 RTS / CTS 信道预约</text>

    <!-- Left Group: (a) Hidden Terminal -->
    <rect x="24" y="64" width="224" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="40" y="92" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(a) 隐蔽站导致冲突</text>

    <!-- A, AP, B boxes -->
    <rect x="36" y="136" width="48" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">A</text>

    <rect x="108" y="136" width="56" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="136" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">AP</text>

    <rect x="188" y="136" width="48" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="212" y="161" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">B</text>

    <line x1="84" y1="156" x2="104" y2="156" stroke="#ef4444" stroke-width="2" marker-end="url(#wifi-arrow)"/>
    <line x1="188" y1="156" x2="168" y2="156" stroke="#ef4444" stroke-width="2" marker-end="url(#wifi-arrow)"/>

    <!-- Explanation box (Exception / Collision = Red) -->
    <rect x="40" y="208" width="192" height="128" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="136" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#991b1b">A 与 B 互在信号覆盖范围外</text>
    <text x="136" y="264" text-anchor="middle" font-size="12" font-weight="400" fill="#991b1b">两者同时认为信道空闲</text>
    <text x="136" y="284" text-anchor="middle" font-size="12" font-weight="400" fill="#991b1b">并向 AP 发送</text>
    <text x="136" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">→ 在 AP 处发生冲突</text>

    <!-- Right Group: (b) RTS / CTS Sequence -->
    <rect x="264" y="64" width="472" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="280" y="92" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">(b) 使用 RTS 与 CTS 避免冲突（虚拟载波监听）</text>

    <!-- Left 72px time/interval column inside right group (x=272..344) -->
    <path d="M340 156 H332 V180 H340" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="324" y="172" text-anchor="end" font-size="12" font-weight="400" fill="#92400e">DIFS</text>

    <path d="M340 200 H332 V228 H340" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="324" y="218" text-anchor="end" font-size="12" font-weight="400" fill="#92400e">SIFS</text>

    <path d="M340 256 H332 V284 H340" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="324" y="274" text-anchor="end" font-size="12" font-weight="400" fill="#92400e">SIFS</text>

    <path d="M340 312 H332 V340 H340" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="324" y="330" text-anchor="end" font-size="12" font-weight="400" fill="#92400e">SIFS</text>

    <!-- Participants -->
    <rect x="352" y="108" width="64" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="384" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">源站</text>

    <rect x="488" y="108" width="96" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="536" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">AP / 目的</text>

    <rect x="616" y="108" width="104" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="668" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">所有其他站</text>

    <!-- Lifelines (1px dashed neutral, explicit end y=408) -->
    <line x1="384" y1="144" x2="384" y2="408" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="536" y1="144" x2="536" y2="408" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="668" y1="144" x2="668" y2="408" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Horizontal message arrows (fixed 56px row spacing: 184, 240, 296, 352) -->
    <line x1="384" y1="184" x2="532" y2="184" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#wifi-arrow)"/>
    <text x="460" y="172" text-anchor="middle" font-size="14" font-weight="400" fill="#1e40af">RTS（预约请求）</text>

    <line x1="536" y1="240" x2="388" y2="240" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#wifi-arrow)"/>
    <text x="460" y="228" text-anchor="middle" font-size="14" font-weight="400" fill="#115e59">CTS（允许发送）</text>

    <line x1="536" y1="240" x2="660" y2="240" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#wifi-arrow)"/>
    <text x="600" y="228" text-anchor="middle" font-size="12" font-weight="400" fill="#115e59">CTS（广播监听）</text>

    <line x1="384" y1="296" x2="532" y2="296" stroke="#3b82f6" stroke-width="2" marker-end="url(#wifi-arrow)"/>
    <text x="460" y="284" text-anchor="middle" font-size="14" font-weight="400" fill="#1e40af">DATA 数据帧</text>

    <line x1="536" y1="352" x2="388" y2="352" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#wifi-arrow)"/>
    <text x="460" y="340" text-anchor="middle" font-size="14" font-weight="400" fill="#115e59">ACK（确认）</text>

    <!-- Activation bar (12px wide on lifeline) + right-side label -->
    <rect x="662" y="248" width="12" height="128" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" data-role="activation"/>
    <text x="684" y="296" text-anchor="start" font-size="12" font-weight="400" fill="#92400e">推迟</text>
    <text x="684" y="316" text-anchor="start" font-size="12" font-weight="400" fill="#92400e">访问</text>
    <text x="684" y="336" text-anchor="start" font-size="12" font-weight="400" fill="#92400e">(NAV)</text>

    <!-- Bottom formula/note block (margin >= 24) -->
    <rect x="24" y="440" width="712" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="468" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">RTS 持续时间 = SIFS+CTS+SIFS+DATA+SIFS+ACK ｜ CTS 持续时间 = SIFS+DATA+SIFS+ACK</text>
  </g>
</svg>
