<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" role="img">
  <title>CDMA 码分多址发送调制、线性叠加与正交内积解码过程</title>
  <desc>展示 A、B、D 三站码片发送信号在公共信道线性叠加为 S = A - B + D 后，接收端通过与指定码片序列做规格化内积分别解码得到 1、0 与未发送结果的过程。</desc>
  <defs>
    <marker id="cdma-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Senders on the left (x=8..244, w=236) -->
    <rect x="8" y="8" width="236" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="126" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">站 A（发送 1 → +A）</text>
    <text x="126" y="60" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">(-1,-1,-1,+1,+1,-1,+1,+1)</text>

    <rect x="8" y="92" width="236" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="126" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">站 B（发送 0 → −B）</text>
    <text x="126" y="144" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">(+1,+1,-1,+1,-1,-1,-1,+1)</text>

    <rect x="8" y="176" width="236" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="126" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">站 D（发送 1 → +D）</text>
    <text x="126" y="228" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">(-1,+1,-1,-1,-1,-1,+1,-1)</text>

    <!-- Arrows to superposition -->
    <path d="M244 42 H260 V126 H272" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>
    <line x1="244" y1="126" x2="272" y2="126" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>
    <path d="M244 210 H260 V126 H272" fill="none" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Shared Channel Superposition (x=276..460, w=184) -->
    <rect x="276" y="70" width="184" height="112" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/>
    <text x="368" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">公共信道线性叠加</text>
    <text x="368" y="132" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">S = A − B + D</text>
    <text x="368" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">(-1,1,-3,1,-1,-3,1,1)</text>

    <!-- Arrows to Decoders -->
    <path d="M460 126 H476 V42 H488" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>
    <line x1="460" y1="126" x2="488" y2="126" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>
    <path d="M460 126 H476 V210 H488" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>

    <!-- Decoders on the right (x=492..712, w=220) -->
    <rect x="492" y="8" width="220" height="68" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="602" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">与 A 做规格化内积</text>
    <text x="602" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">S · A = +1 → 收到 1</text>

    <rect x="492" y="92" width="220" height="68" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="602" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">与 B 做规格化内积</text>
    <text x="602" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">S · B = −1 → 收到 0</text>

    <rect x="492" y="176" width="220" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="602" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">与 C 做规格化内积</text>
    <text x="602" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#4b5563">S · C = 0 → 未发送</text>

    <rect x="8" y="264" width="704" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="294" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">由于各站码片两两正交（Sᵢ · Sⱼ = 0），接收端可从叠加信号中</text>
    <text x="360" y="320" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">无干扰地分离出指定站点发送的数据</text>
  </g>
</svg>
