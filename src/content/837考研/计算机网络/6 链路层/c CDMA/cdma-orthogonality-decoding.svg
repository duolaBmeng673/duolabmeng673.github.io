<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img">
  <title>CDMA 码分多址发送调制、线性叠加与正交内积解码过程</title>
  <desc>展示 A、B、D 三站码片发送信号在公共信道线性叠加为 S = A - B + D 后，接收端通过与指定码片序列做规格化内积分别解码得到 1、0 与未发送结果的过程。</desc>
  <defs>
    <marker id="cdma-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">CDMA 工作流程：码片调制 → 信道叠加 → 正交内积解码</text>

    <!-- Senders on the left (x=24..240, w=216) -->
    <rect x="24" y="72" width="216" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="132" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">站 A（发送比特 1 → +A）</text>
    <text x="132" y="120" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">(-1,-1,-1,+1,+1,-1,+1,+1)</text>

    <rect x="24" y="152" width="216" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="132" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">站 B（发送比特 0 → −B）</text>
    <text x="132" y="200" text-anchor="middle" font-size="12" font-weight="400" fill="#115e59">(+1,+1,-1,+1,-1,-1,-1,+1)</text>

    <rect x="24" y="232" width="216" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="132" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">站 D（发送比特 1 → +D）</text>
    <text x="132" y="280" text-anchor="middle" font-size="12" font-weight="400" fill="#92400e">(-1,+1,-1,-1,-1,-1,+1,-1)</text>

    <!-- Arrows to superposition -->
    <path d="M240 104 H268 V184 H292" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>
    <line x1="240" y1="184" x2="292" y2="184" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>
    <path d="M240 264 H268 V184 H292" fill="none" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Shared Channel Superposition (x=296..480, w=184) -->
    <rect x="296" y="132" width="184" height="104" rx="8" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/>
    <text x="388" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">公共信道线性叠加</text>
    <text x="388" y="188" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">S = A − B + D</text>
    <text x="388" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">(-1,1,-3,1,-1,-3,1,1)</text>

    <!-- Arrows to Decoders -->
    <path d="M480 184 H504 V104 H524" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>
    <line x1="480" y1="184" x2="524" y2="184" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>
    <path d="M480 184 H504 V264 H524" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cdma-arrow)"/>

    <!-- Decoders on the right (x=528..736, w=208) -->
    <rect x="528" y="72" width="208" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="632" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">与 A 做规格化内积</text>
    <text x="632" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">S · A = +1 → 收到 1</text>

    <rect x="528" y="152" width="208" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="632" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">与 B 做规格化内积</text>
    <text x="632" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">S · B = −1 → 收到 0</text>

    <rect x="528" y="232" width="208" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="632" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">与 C 做规格化内积</text>
    <text x="632" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#4b5563">S · C = 0 → 未发送</text>

    <!-- Bottom note block -->
    <rect x="24" y="316" width="712" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="380" y="343" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937">由于各站码片两两正交（Sᵢ · Sⱼ = 0），接收端可从叠加信号中无干扰地分离出指定站点的数据</text>
  </g>
</svg>
