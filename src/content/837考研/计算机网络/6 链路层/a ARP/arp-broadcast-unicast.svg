<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" width="720" height="388" role="img">
  <title>ARP 解析流程：广播请求与单播响应</title>
  <desc>展示同一局域网广播域内，主机 A 广播发送 ARP 请求（目的 MAC 为全 F），非目标主机 C 丢弃，目标主机 B 单播返回 ARP 响应的过程。</desc>
  <defs>
    <marker id="arp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="704" height="278" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="24" y="38" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">同一局域网（广播域）</text>

    <rect x="24" y="114" width="192" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="120" y="142" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">主机 A（发送方）</text>
    <text x="120" y="168" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">已知 B 的 IP，查 MAC</text>

    <rect x="504" y="56" width="192" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="600" y="84" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">主机 C（非目标）</text>
    <text x="600" y="110" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">收到广播后丢弃</text>

    <rect x="504" y="186" width="192" height="72" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="600" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">主机 B（目标）</text>
    <text x="600" y="240" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">写入 A 映射并单播回复</text>

    <path d="M216 136 H468 V92 H500" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arp-arrow)"/>
    <path d="M468 136 V206 H500" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arp-arrow)"/>

    <text x="342" y="102" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">① ARP 请求（广播发送）</text>
    <text x="342" y="124" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">目的 MAC：FF-FF-FF-FF-FF-FF</text>

    <path d="M504 240 H252 V166 H220" fill="none" stroke="#14b8a6" stroke-width="2" marker-end="url(#arp-arrow)"/>
    <text x="358" y="206" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">② ARP 响应（单播发送）</text>
    <text x="358" y="228" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">包含 B 的 IP ↔ MAC 映射</text>

    <rect x="8" y="302" width="704" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="332" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">注：若 A 的 ARP 高速缓存中已有 B 的映射，则直接取用，无需广播发送 ARP 请求</text>
    <text x="360" y="360" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">图例：虚线箭头表示局域网广播发送，实线箭头表示点对点单播响应</text>
  </g>
</svg>
