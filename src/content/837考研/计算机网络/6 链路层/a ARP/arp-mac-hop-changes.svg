<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" width="720" height="382" role="img">
  <title>跨网段通信中 IP 地址不变而 MAC 地址逐跳变化的 ARP 场景</title>
  <desc>展示数据包经过网 1、网 2、网 3 与路由器 R₁、R₂ 转发时，3 跳中每跳的源与目的 MAC 地址如何更换，而源与目的 IP 始终保持不变。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="188" height="156" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" data-role="group"/>
    <text x="102" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">网 1</text>

    <rect x="266" y="8" width="188" height="156" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5" data-role="group"/>
    <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">网 2</text>

    <rect x="524" y="8" width="188" height="156" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" data-role="group"/>
    <text x="618" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">网 3</text>

    <g stroke="#4b5563" stroke-width="1.5" fill="none">
      <line x1="88" y1="74" x2="207" y2="74"/>
      <path d="M88 128 H144 V74"/>
      <line x1="255" y1="74" x2="465" y2="74"/>
      <line x1="360" y1="74" x2="360" y2="108"/>
      <line x1="513" y1="74" x2="632" y2="74"/>
    </g>

    <g fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5">
      <rect x="24" y="54" width="64" height="40" rx="8"/>
      <rect x="24" y="108" width="64" height="40" rx="8"/>
    </g>
    <text x="56" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">H₁</text>
    <text x="56" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">H₂</text>

    <rect x="328" y="108" width="64" height="40" rx="8" fill="#f8fafc" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="360" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">H₃</text>

    <rect x="632" y="54" width="64" height="40" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="664" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">H₄</text>

    <circle cx="231" cy="74" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="231" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">R₁</text>

    <circle cx="489" cy="74" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="489" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">R₂</text>

    <g font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">
      <text x="172" y="62">L₁</text>
      <text x="290" y="62">L₂</text>
      <text x="430" y="62">L₃</text>
      <text x="548" y="62">L₄</text>
    </g>

    <!-- Hop cards -->
    <rect x="8" y="184" width="224" height="96" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="120" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">第 1 跳（H₁ → R₁）</text>
    <text x="120" y="240" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">源 MAC：H₁</text>
    <text x="120" y="264" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">目的 MAC：L₁</text>

    <rect x="248" y="184" width="224" height="96" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="360" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">第 2 跳（R₁ → R₂）</text>
    <text x="360" y="240" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">源 MAC：L₂</text>
    <text x="360" y="264" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">目的 MAC：L₃</text>

    <rect x="488" y="184" width="224" height="96" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="600" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">第 3 跳（R₂ → H₄）</text>
    <text x="600" y="240" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">源 MAC：L₄</text>
    <text x="600" y="264" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">目的 MAC：H₄</text>

    <rect x="8" y="298" width="704" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="328" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">各跳重新封装 MAC 首部与尾部（MAC 地址逐跳改变）</text>
    <text x="360" y="354" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">但上层 IP 数据报中的源 IP 与目的 IP 始终保持不变</text>
  </g>
</svg>
