<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-label="面向应用的层次型信息安全技术体系架构">
  <defs>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 8 L5 2 L8 8 Z" fill="#6D28D9"/>
    </marker>
  </defs>

  <rect width="840" height="440" rx="14" fill="#FAF9F6"/>

  <!-- Header -->
  <text x="36" y="42" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#18181B">面向应用的层次型信息安全技术体系架构</text>
  <text x="36" y="64" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="12.5" fill="#52525B">三大基本要素与五个安全层次自底向上的支撑对应关系</text>

  <!-- Column headers -->
  <text x="120" y="96" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">信息系统基本要素</text>
  <text x="480" y="96" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="1">五个安全层次（上层依赖下层提供基础保障）</text>

  <!-- Element 1: 人员 -->
  <rect x="36" y="114" width="168" height="54" rx="10" fill="#F3E8FF" stroke="#A855F7" stroke-width="1.5"/>
  <text x="120" y="140" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#581C87">人员</text>
  <text x="120" y="157" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11" fill="#7E22CE">安全意识与行为主体</text>

  <!-- Element 2: 信息 -->
  <rect x="36" y="178" width="168" height="118" rx="10" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="120" y="232" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#115E59">信息</text>
  <text x="120" y="252" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11" fill="#0F766E">核心资产 · 语义与载体</text>

  <!-- Element 3: 系统 -->
  <rect x="36" y="306" width="168" height="118" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="120" y="360" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">系统</text>
  <text x="120" y="380" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11" fill="#1D4ED8">硬件设备与运行支撑平台</text>

  <!-- Connectors -->
  <path d="M204 141 L248 141" stroke="#A855F7" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M204 237 L226 237 L226 205 L248 205 M226 237 L226 269 L248 269" fill="none" stroke="#14B8A6" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M204 365 L226 365 L226 333 L248 333 M226 365 L226 397 L248 397" fill="none" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- Layer 5: 管理安全 -->
  <rect x="248" y="114" width="490" height="54" rx="10" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.5"/>
  <rect x="248" y="114" width="8" height="54" rx="4" fill="#9333EA"/>
  <text x="274" y="138" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="14.5" font-weight="700" fill="#18181B">5. 管理安全</text>
  <text x="274" y="156" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11.5" fill="#52525B">规范和约束人的信息行为 · 制度、法规与人员管理</text>
  <rect x="646" y="128" width="76" height="24" rx="6" fill="#F3E8FF"/>
  <text x="684" y="144" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11" font-weight="600" fill="#6B21A8">顶层保障</text>

  <!-- Layer 4: 内容安全 -->
  <rect x="248" y="178" width="490" height="54" rx="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="248" y="178" width="8" height="54" rx="4" fill="#0D9488"/>
  <text x="274" y="202" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="14.5" font-weight="700" fill="#18181B">4. 内容安全</text>
  <text x="274" y="220" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11.5" fill="#52525B">依据信息具体内涵判断是否违反策略 · 保护机密性/真实性/可控性</text>
  <rect x="646" y="192" width="76" height="24" rx="6" fill="#CCFBF1"/>
  <text x="684" y="208" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11" font-weight="600" fill="#115E59">语义合规</text>

  <!-- Layer 3: 数据安全 -->
  <rect x="248" y="242" width="490" height="54" rx="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="248" y="242" width="8" height="54" rx="4" fill="#0D9488"/>
  <text x="274" y="266" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="14.5" font-weight="700" fill="#18181B">3. 数据安全</text>
  <text x="274" y="284" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11.5" fill="#52525B">保护数据采集、处理、存储、检索与传输全过程（密码学核心载体）</text>
  <rect x="646" y="256" width="76" height="24" rx="6" fill="#CCFBF1"/>
  <text x="684" y="272" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11" font-weight="600" fill="#115E59">过程防护</text>

  <!-- Layer 2: 运行安全 -->
  <rect x="248" y="306" width="490" height="54" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="248" y="306" width="8" height="54" rx="4" fill="#2563EB"/>
  <text x="274" y="330" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="14.5" font-weight="700" fill="#18181B">2. 运行安全</text>
  <text x="274" y="348" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11.5" fill="#52525B">保护网络与信息系统的运行过程和运行状态（访问控制/入侵检测）</text>
  <rect x="646" y="320" width="76" height="24" rx="6" fill="#DBEAFE"/>
  <text x="684" y="336" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11" font-weight="600" fill="#1E40AF">动态运行</text>

  <!-- Layer 1: 物理安全 -->
  <rect x="248" y="370" width="490" height="54" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="248" y="370" width="8" height="54" rx="4" fill="#2563EB"/>
  <text x="274" y="394" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="14.5" font-weight="700" fill="#18181B">1. 物理安全</text>
  <text x="274" y="412" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11.5" fill="#52525B">保护网络及信息系统物理装备与机房环境 · 全部层次的基础底座</text>
  <rect x="646" y="384" width="76" height="24" rx="6" fill="#DBEAFE"/>
  <text x="684" y="400" text-anchor="middle" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="11" font-weight="600" fill="#1E40AF">底层基础</text>

  <!-- Right upward foundation arrow -->
  <line x1="774" y1="414" x2="774" y2="128" stroke="#6D28D9" stroke-width="2.2" marker-end="url(#arrow-up)"/>
  <text x="794" y="255" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#6D28D9" writing-mode="tb" glyph-orientation-vertical="0">逐层提供基础安全保障</text>
</svg>
