<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" role="img" aria-label="ISO 7498-2 开放系统互连安全体系结构三维图">
  <defs>
    <marker id="ax-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ax-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ax-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#0B0B0B">ISO 7498-2 安全体系结构三维图</text>

    <!-- Left: 3D Coordinate Space -->
    <rect x="20" y="48" width="230" height="384" rx="8" fill="#F1EFE8" fill-opacity="0.45" stroke="#5F5E5A" stroke-width="0.6"/>
    <polygon points="82,272 82,196 135,232 135,308" fill="#E1F5EE" fill-opacity="0.7" stroke="#0F6E56" stroke-width="0.6"/>
    <polygon points="135,232 192,194 192,270 135,308" fill="#EEEDFE" fill-opacity="0.7" stroke="#534AB7" stroke-width="0.6"/>
    <line x1="135" y1="268" x2="135" y2="112" stroke="#534AB7" stroke-width="1.6" marker-end="url(#ax-p)"/>
    <line x1="135" y1="268" x2="232" y2="268" stroke="#854F0B" stroke-width="1.6" marker-end="url(#ax-a)"/>
    <line x1="135" y1="268" x2="54" y2="338" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#ax-t)"/>
    <circle cx="135" cy="268" r="3" fill="#444441"/>
    <text x="135" y="96" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3C3489">OSI 参考模型</text>
    <text x="198" y="288" text-anchor="middle" font-size="12.5" font-weight="600" fill="#633806">安全机制</text>
    <text x="76" y="362" text-anchor="middle" font-size="12.5" font-weight="600" fill="#085041">安全服务</text>

    <!-- Middle: OSI 7 Layers -->
    <rect x="268" y="48" width="166" height="384" rx="8" fill="#EEEDFE" fill-opacity="0.45" stroke="#534AB7" stroke-width="0.7"/>
    <text x="351" y="74" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3C3489">OSI 参考模型</text>
    <g text-anchor="middle" font-size="12.5" font-weight="500" fill="#3C3489">
      <rect x="284" y="92" width="134" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
      <text x="351" y="116">应用层</text>
      <rect x="284" y="138" width="134" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
      <text x="351" y="162">表示层</text>
      <rect x="284" y="184" width="134" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
      <text x="351" y="208">会话层</text>
      <rect x="284" y="230" width="134" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
      <text x="351" y="254">传输层</text>
      <rect x="284" y="276" width="134" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
      <text x="351" y="300">网络层</text>
      <rect x="284" y="322" width="134" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
      <text x="351" y="346">链路层</text>
      <rect x="284" y="368" width="134" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
      <text x="351" y="392">物理层</text>
    </g>

    <!-- Right Top: 5 Security Services -->
    <rect x="452" y="48" width="348" height="176" rx="8" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-width="0.7"/>
    <text x="626" y="74" text-anchor="middle" font-size="13.5" font-weight="600" fill="#085041">安全服务</text>
    <g text-anchor="middle" font-size="12.5" font-weight="500" fill="#085041">
      <rect x="468" y="92" width="98" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
      <text x="517" y="121">鉴别服务</text>
      <rect x="577" y="92" width="98" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
      <text x="626" y="121">访问控制</text>
      <rect x="686" y="92" width="98" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
      <text x="735" y="121">数据机密性</text>
      <rect x="506" y="154" width="112" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
      <text x="562" y="183">数据完整性</text>
      <rect x="634" y="154" width="112" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
      <text x="690" y="183">抗抵赖性</text>
    </g>

    <!-- Right Bottom: 8 Security Mechanisms -->
    <rect x="452" y="242" width="348" height="190" rx="8" fill="#FAEEDA" fill-opacity="0.45" stroke="#854F0B" stroke-width="0.7"/>
    <text x="626" y="268" text-anchor="middle" font-size="13.5" font-weight="600" fill="#633806">安全机制</text>
    <g text-anchor="middle" font-size="12" font-weight="500" fill="#633806">
      <rect x="466" y="286" width="74" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="503" y="317">加密</text>
      <rect x="548" y="286" width="74" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="585" y="317">数字签名</text>
      <rect x="630" y="286" width="74" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="667" y="317">访问控制</text>
      <rect x="712" y="286" width="74" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="749" y="317">数据完整性</text>
      <rect x="466" y="354" width="74" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="503" y="385">鉴别交换</text>
      <rect x="548" y="354" width="74" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="585" y="385">业务流填充</text>
      <rect x="630" y="354" width="74" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="667" y="385">路由控制</text>
      <rect x="712" y="354" width="74" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="749" y="385">公证</text>
    </g>
  </g>
</svg>
