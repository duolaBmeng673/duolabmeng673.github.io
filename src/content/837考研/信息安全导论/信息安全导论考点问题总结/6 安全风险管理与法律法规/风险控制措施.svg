<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 516" width="720" height="516" role="img">
  <title>具体风险控制措施分类与属性对照表</title>
  <desc>按技术类、运营类与管理类三类列出身份认证、加密、防火墙、入侵检测、审计、蜜罐、物理访问、容灾、培训等控制措施及其预防性、检查性或纠正性属性。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- 表头 -->
    <rect x="8" y="8" width="704" height="46" fill="#f8fafc"/>
    <line x1="8" y1="8" x2="712" y2="8" stroke="#1f2937" stroke-width="2"/>
    <line x1="8" y1="54" x2="712" y2="54" stroke="#1f2937" stroke-width="1.5"/>
    <text x="64" y="37" text-anchor="middle" font-weight="600" font-size="16" fill="#1f2937">类别</text>
    <text x="356" y="37" text-anchor="middle" font-weight="600" font-size="16" fill="#1f2937">措施</text>
    <text x="650" y="37" text-anchor="middle" font-weight="600" font-size="16" fill="#1f2937">属性</text>

    <!-- 竖线 -->
    <line x1="120" y1="8" x2="120" y2="508" stroke="#94a3b8" stroke-width="1"/>
    <line x1="588" y1="8" x2="588" y2="508" stroke="#94a3b8" stroke-width="1"/>

    <!-- 技术类 -->
    <text x="64" y="152" text-anchor="middle" font-weight="600" font-size="16" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">技术类</text>
    <g font-size="15" font-weight="400" fill="#1f2937">
      <text x="140" y="84" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">身份认证技术</text>
      <text x="140" y="112" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">加密技术</text>
      <text x="140" y="140" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">防火墙技术</text>
      <text x="140" y="168" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">入侵检测技术</text>
      <text x="140" y="196" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">系统审计</text>
      <text x="140" y="224" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">蜜罐、蜜网技术</text>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">
      <text x="650" y="84" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">预防性</text>
      <text x="650" y="112" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">预防性</text>
      <text x="650" y="140" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">预防性</text>
      <text x="650" y="168" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">检查性</text>
      <text x="650" y="196" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">检查性</text>
      <text x="650" y="224" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">纠正性</text>
    </g>
    <line x1="8" y1="242" x2="712" y2="242" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- 运营类 -->
    <text x="64" y="302" text-anchor="middle" font-weight="600" font-size="16" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">运营类</text>
    <g font-size="15" font-weight="400" fill="#1f2937">
      <text x="140" y="272" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">物理访问控制，如重要设备使用授权等；</text>
      <text x="140" y="300" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">容灾、容侵，如系统备份、数据备份等；</text>
      <text x="140" y="328" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">物理安全检测技术，防盗技术、防火技术等；</text>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">
      <text x="650" y="272" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">预防性</text>
      <text x="650" y="300" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">预防性</text>
      <text x="650" y="328" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">检查性</text>
    </g>
    <line x1="8" y1="346" x2="712" y2="346" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- 管理类 -->
    <text x="64" y="432" text-anchor="middle" font-weight="600" font-size="16" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">管理类</text>
    <g font-size="15" font-weight="400" fill="#1f2937">
      <text x="140" y="376" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">责任分配</text>
      <text x="140" y="404" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">权限管理</text>
      <text x="140" y="432" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">安全培训</text>
      <text x="140" y="460" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">人员控制</text>
      <text x="140" y="488" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">定期安全审计</text>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">
      <text x="650" y="376" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">预防性</text>
      <text x="650" y="404" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">预防性</text>
      <text x="650" y="432" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">预防性</text>
      <text x="650" y="460" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">预防性</text>
      <text x="650" y="488" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">检查性</text>
    </g>
    <line x1="8" y1="508" x2="712" y2="508" stroke="#1f2937" stroke-width="2"/>
  </g>
</svg>
