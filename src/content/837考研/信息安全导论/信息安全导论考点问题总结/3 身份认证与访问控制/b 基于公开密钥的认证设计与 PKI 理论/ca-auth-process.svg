<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#378ADD"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D85A30"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- CA -->
  <rect x="290" y="24" width="180" height="62" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="2"/>
  <text x="380" y="52" text-anchor="middle" font-size="18" font-weight="600" fill="#3C3489">CA</text>
  <text x="380" y="74" text-anchor="middle" font-size="14" fill="#534AB7">认证中心</text>

  <!-- A -->
  <rect x="40" y="316" width="160" height="62" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
  <text x="120" y="344" text-anchor="middle" font-size="18" font-weight="600" fill="#0C447C">A</text>
  <text x="120" y="366" text-anchor="middle" font-size="14" fill="#185FA5">申请者</text>

  <!-- B -->
  <rect x="560" y="316" width="160" height="62" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
  <text x="640" y="344" text-anchor="middle" font-size="18" font-weight="600" fill="#27500A">B</text>
  <text x="640" y="366" text-anchor="middle" font-size="14" fill="#3B6D11">验证者</text>

  <!-- 1: A -> CA -->
  <line x1="90" y1="314" x2="304" y2="90" stroke="#378ADD" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="178" y="200" text-anchor="end" font-size="15" font-weight="600" fill="#0C447C">① 申请数字证书</text>

  <!-- 2: CA -> A -->
  <line x1="344" y1="90" x2="150" y2="314" stroke="#D85A30" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="268" y="200" text-anchor="start" font-size="15" font-weight="600" fill="#712B13">② 颁发数字证书</text>

  <!-- 4: CA -> B -->
  <line x1="450" y1="90" x2="620" y2="314" stroke="#7F77DD" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ap)"/>
  <text x="548" y="170" text-anchor="start" font-size="15" font-weight="600" fill="#3C3489">④ 获得 CA 的公钥</text>

  <!-- 3: A -> B -->
  <text x="380" y="338" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">③ A 签名的信息 + A 的数字证书</text>
  <line x1="202" y1="352" x2="558" y2="352" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#at)"/>

  <!-- B verify -->
  <text x="640" y="410" text-anchor="middle" font-size="14" fill="#5F5E5A">B 验证证书和签名信息</text>
</svg>
