<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" role="img">
  <title>PKI 与 CA 认证中心签发及验证数字证书流程</title>
  <desc>展示申请者 A 向 CA 申请并获颁数字证书，随后向验证者 B 发送签名信息及数字证书，B 获取 CA 公钥验证证书和签名信息的流程。</desc>
  <defs>
    <marker id="ca-auth-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- CA -->
    <rect x="276" y="8" width="168" height="68" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#92400e">CA</text>
    <text x="360" y="60" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">认证中心</text>

    <!-- A & B -->
    <rect x="8" y="216" width="168" height="68" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="92" y="244" text-anchor="middle" font-size="18" font-weight="600" fill="#1e40af">A</text>
    <text x="92" y="268" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">申请者</text>

    <rect x="544" y="216" width="168" height="68" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="628" y="244" text-anchor="middle" font-size="18" font-weight="600" fill="#115e59">B</text>
    <text x="628" y="268" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">验证者</text>

    <!-- 1: A -> CA -->
    <path d="M64 216 V42 H272" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#ca-auth-arrow)"/>
    <text x="166" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">① 申请数字证书</text>

    <!-- 2: CA -> A -->
    <path d="M312 76 V148 H128 V212" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ca-auth-arrow)"/>
    <text x="216" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">② 颁发数字证书</text>

    <!-- 4: CA -> B -->
    <path d="M444 42 H628 V212" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ca-auth-arrow)"/>
    <text x="544" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">④ 获得 CA 的公钥</text>

    <!-- 3: A -> B -->
    <line x1="176" y1="250" x2="540" y2="250" stroke="#14b8a6" stroke-width="2" marker-end="url(#ca-auth-arrow)"/>
    <text x="360" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">③ A 签名的信息 + A 的数字证书</text>

    <rect x="484" y="298" width="228" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="598" y="323" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">B 验证证书和签名信息</text>
  </g>
</svg>
