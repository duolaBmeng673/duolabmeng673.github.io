<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" width="720" height="388" role="img">
  <title>基于公开密钥的 Needham-Schroeder 双向挑战-应答认证协议</title>
  <desc>展示通信双方 A 与 B 利用对方公钥加密挑战随机数 Ra 与 Rb 完成双向身份认证的三步交互流程。</desc>
  <defs>
    <marker id="ns-pk-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="144" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">A</text>

    <rect x="568" y="8" width="144" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="640" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">B</text>

    <line x1="80" y1="52" x2="80" y2="380" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="640" y1="52" x2="640" y2="380" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Step 1 -->
    <circle cx="144" cy="100" r="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="144" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">1</text>
    <text x="360" y="106" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">E_KUb [ ID_A ‖ R_a ]</text>
    <line x1="80" y1="122" x2="636" y2="122" stroke="#3b82f6" stroke-width="2" marker-end="url(#ns-pk-arrow)"/>
    <text x="360" y="148" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">A 向 B 发起挑战，B 用私钥 KR_b 解密</text>

    <!-- Step 2 -->
    <circle cx="576" cy="206" r="14" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="576" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">2</text>
    <text x="360" y="212" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">E_KUa [ R_a ‖ R_b ]</text>
    <line x1="640" y1="228" x2="84" y2="228" stroke="#14b8a6" stroke-width="2" marker-end="url(#ns-pk-arrow)"/>
    <text x="360" y="254" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">B 向 A 回答，同时向 A 发起挑战，A 用私钥 KR_a 解密</text>

    <!-- Step 3 -->
    <circle cx="144" cy="312" r="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="144" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">3</text>
    <text x="360" y="318" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">E_KUb [ R_b ]</text>
    <line x1="80" y1="334" x2="636" y2="334" stroke="#f59e0b" stroke-width="2" marker-end="url(#ns-pk-arrow)"/>
    <text x="360" y="360" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">A 向 B 回答</text>
  </g>
</svg>
