<svg viewBox="0 0 760 410" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#378ADD"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D85A30"/></marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>

  <!-- participants -->
  <rect x="60" y="20" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="140" y="48" text-anchor="middle" font-size="17" font-weight="600" fill="#0C447C">A</text>
  <rect x="540" y="20" width="160" height="44" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
  <text x="620" y="48" text-anchor="middle" font-size="17" font-weight="600" fill="#27500A">B</text>

  <!-- lifelines -->
  <line x1="140" y1="64" x2="140" y2="385" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="620" y1="64" x2="620" y2="385" stroke="#639922" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- step 1 -->
  <circle cx="200" cy="108" r="12" fill="#378ADD"/>
  <text x="200" y="113" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">1</text>
  <text x="380" y="113" text-anchor="middle" font-size="16" fill="#0C447C">E_KUb [ ID_A ‖ R_a ]</text>
  <line x1="142" y1="128" x2="618" y2="128" stroke="#378ADD" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="380" y="152" text-anchor="middle" font-size="14" fill="#5F5E5A">A 向 B 发起挑战，B 用私钥 KR_b 解密</text>

  <!-- step 2 -->
  <circle cx="560" cy="208" r="12" fill="#1D9E75"/>
  <text x="560" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">2</text>
  <text x="380" y="213" text-anchor="middle" font-size="16" fill="#085041">E_KUa [ R_a ‖ R_b ]</text>
  <line x1="618" y1="228" x2="142" y2="228" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="380" y="252" text-anchor="middle" font-size="14" fill="#5F5E5A">B 向 A 回答，同时向 A 发起挑战，A 用私钥 KR_a 解密</text>

  <!-- step 3 -->
  <circle cx="200" cy="308" r="12" fill="#D85A30"/>
  <text x="200" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">3</text>
  <text x="380" y="313" text-anchor="middle" font-size="16" fill="#712B13">E_KUb [ R_b ]</text>
  <line x1="142" y1="328" x2="618" y2="328" stroke="#D85A30" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="380" y="352" text-anchor="middle" font-size="14" fill="#5F5E5A">A 向 B 回答</text>
</svg>
