<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img">
  <title>X.509 数字证书格式结构</title>
  <desc>展示 X.509 数字证书由上至下包含的 17 个字段及其签名算法标识、有效期、主体公钥信息、签名四类分组归属。</desc>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="236" y="8" width="476" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="474" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">版本</text>
    <rect x="236" y="52" width="476" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="474" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">证书序列号</text>
    <rect x="236" y="96" width="476" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="474" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">算法</text>
    <rect x="236" y="140" width="476" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="474" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">参数</text>
    <rect x="236" y="184" width="476" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="474" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">签发者</text>
    <rect x="236" y="228" width="476" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="474" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">生效时间</text>
    <rect x="236" y="272" width="476" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="474" y="298" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">终止时间</text>
    <rect x="236" y="316" width="476" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="474" y="342" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">证书主体</text>
    <rect x="236" y="360" width="476" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="474" y="386" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">算法</text>
    <rect x="236" y="404" width="476" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="474" y="430" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">参数</text>
    <rect x="236" y="448" width="476" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="474" y="474" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">密钥</text>
    <rect x="236" y="492" width="476" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="474" y="518" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">发行商唯一标识</text>
    <rect x="236" y="536" width="476" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="474" y="562" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">证书主体唯一标识</text>
    <rect x="236" y="580" width="476" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="474" y="606" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">扩展</text>
    <rect x="236" y="624" width="476" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="474" y="650" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">算法</text>
    <rect x="236" y="668" width="476" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="474" y="694" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">参数</text>
    <rect x="236" y="712" width="476" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="474" y="738" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">密钥</text>
    <!-- Left category brackets & badges (row y(i) = 8 + i*44, center = y + 20) -->
    <!-- Group 1: idx 2..3 (y=96..180, mid=138) -->
    <rect x="8" y="117" width="176" height="42" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="96" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">签名算法标识</text>
    <path d="M184 138 H212 M236 116 H212 V160 H236" fill="none" stroke="#f59e0b" stroke-width="2"/>

    <!-- Group 2: idx 5..6 (y=228..312, mid=270) -->
    <rect x="8" y="249" width="176" height="42" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="96" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">有效期</text>
    <path d="M184 270 H212 M236 248 H212 V292 H236" fill="none" stroke="#14b8a6" stroke-width="2"/>

    <!-- Group 3: idx 8..10 (y=360..488, mid=424) -->
    <rect x="8" y="403" width="176" height="42" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="96" y="430" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">主体公钥信息</text>
    <path d="M184 424 H212 M236 380 H212 V468 H236" fill="none" stroke="#14b8a6" stroke-width="2"/>

    <!-- Group 4: idx 14..16 (y=624..752, mid=688) -->
    <rect x="8" y="667" width="176" height="42" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="96" y="694" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">签名</text>
    <path d="M184 688 H212 M236 644 H212 V732 H236" fill="none" stroke="#ef4444" stroke-width="2"/>
  </g>
</svg>
