<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" width="720" height="1180" role="img">
  <title>Kerberos 认证协议三阶段交互</title>
  <desc>展示客户端 C、认证服务器 AS、票据授予服务器 TGS 与应用服务器 V 之间三阶段六个步骤的完整消息内容、中文说明及票据与认证符公式。</desc>
  <defs>
    <marker id="3a-krb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Phase tinted bands (semantic grouping, no dashed border) -->
    <rect x="8" y="68" width="704" height="272" rx="12" fill="#eff6ff" data-role="group"/>
    <text x="20" y="96" text-anchor="start" font-size="16" font-weight="600" fill="#1e40af">一阶段</text>
    <text x="20" y="122" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">C ↔ AS</text>

    <rect x="8" y="352" width="704" height="316" rx="12" fill="#fffbeb" data-role="group"/>
    <text x="20" y="380" text-anchor="start" font-size="16" font-weight="600" fill="#92400e">二阶段</text>
    <text x="20" y="406" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">C ↔ TGS</text>

    <rect x="8" y="680" width="704" height="280" rx="12" fill="#f0fdfa" data-role="group"/>
    <text x="20" y="708" text-anchor="start" font-size="16" font-weight="600" fill="#115e59">三阶段</text>
    <text x="20" y="734" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">C ↔ V</text>

    <!-- Participants -->
    <rect x="92" y="8" width="104" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="144" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">C 客户端</text>

    <rect x="280" y="8" width="72" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="316" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">AS</text>

    <rect x="448" y="8" width="76" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="486" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">TGS</text>

    <rect x="608" y="8" width="104" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="660" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">V 服务器</text>

    <!-- Lifelines -->
    <line x1="144" y1="52" x2="144" y2="948" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="316" y1="52" x2="316" y2="948" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="486" y1="52" x2="486" y2="948" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="660" y1="52" x2="660" y2="948" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Step 1: C -> AS (center 230, span 172px) -->
    <line x1="144" y1="112" x2="312" y2="112" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="230" y="96" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">① ID<tspan dy="4" font-size="15">c</tspan><tspan dy="-4"> ‖ ID</tspan><tspan dy="4" font-size="15">tgs</tspan><tspan dy="-4"> ‖ TS</tspan><tspan dy="4" font-size="15">1</tspan></text>
    <text x="230" y="136" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">C 向 AS 请求 TGS 票据</text>

    <!-- Step 2: AS -> C (center 230, span 172px) -->
    <line x1="316" y1="284" x2="148" y2="284" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="230" y="184" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">② E<tspan dy="4" font-size="15">Kc</tspan><tspan dy="-4">[K</tspan><tspan dy="4" font-size="15">c,tgs</tspan><tspan dy="-4"> ‖</tspan></text>
    <text x="230" y="212" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">ID<tspan dy="4" font-size="15">tgs</tspan><tspan dy="-4"> ‖ TS</tspan><tspan dy="4" font-size="15">2</tspan><tspan dy="-4"> ‖</tspan></text>
    <text x="230" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">Lifetime<tspan dy="4" font-size="15">2</tspan><tspan dy="-4"> ‖</tspan></text>
    <text x="230" y="268" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">Ticket<tspan dy="4" font-size="15">tgs</tspan><tspan dy="-4">]</tspan></text>
    <text x="230" y="308" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">AS 返回 TGS 票据</text>

    <!-- Step 3: C -> TGS (center 401, span 170px) -->
    <line x1="144" y1="424" x2="482" y2="424" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="401" y="380" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">③ ID<tspan dy="4" font-size="15">v</tspan><tspan dy="-4"> ‖ Ticket</tspan><tspan dy="4" font-size="15">tgs</tspan><tspan dy="-4"> ‖</tspan></text>
    <text x="401" y="408" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">Authenticator<tspan dy="4" font-size="15">c</tspan></text>
    <text x="401" y="448" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">C 向 TGS 请求</text>
    <text x="401" y="472" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">应用服务器票据</text>

    <!-- Step 4: TGS -> C (center 401, span 170px) -->
    <line x1="486" y1="596" x2="148" y2="596" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="401" y="524" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">④ E<tspan dy="4" font-size="15">Kc,tgs</tspan><tspan dy="-4">[K</tspan><tspan dy="4" font-size="15">c,v</tspan><tspan dy="-4"> ‖</tspan></text>
    <text x="401" y="552" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">ID<tspan dy="4" font-size="15">v</tspan><tspan dy="-4"> ‖ TS</tspan><tspan dy="4" font-size="15">4</tspan><tspan dy="-4"> ‖</tspan></text>
    <text x="401" y="580" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">Ticket<tspan dy="4" font-size="15">v</tspan><tspan dy="-4">]</tspan></text>
    <text x="401" y="620" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">TGS 返回</text>
    <text x="401" y="644" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">应用服务器票据</text>

    <!-- Step 5: C -> V (center 573, span 174px) -->
    <line x1="144" y1="752" x2="656" y2="752" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="573" y="708" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">⑤ Ticket<tspan dy="4" font-size="15">v</tspan><tspan dy="-4"> ‖</tspan></text>
    <text x="573" y="736" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">Authenticator<tspan dy="4" font-size="15">c</tspan></text>
    <text x="573" y="776" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">C 向 V 发起</text>
    <text x="573" y="800" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">服务请求</text>

    <!-- Step 6: V -> C (center 573, span 174px) -->
    <line x1="660" y1="880" x2="148" y2="880" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="573" y="864" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">⑥ E<tspan dy="4" font-size="15">Kc,v</tspan><tspan dy="-4">[TS</tspan><tspan dy="4" font-size="15">5</tspan><tspan dy="-4">+1]</tspan></text>
    <text x="573" y="904" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">V 回应 TS<tspan dy="3" font-size="15">5</tspan><tspan dy="-3">+1，</tspan></text>
    <text x="573" y="928" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">证明自己是真服务器</text>

    <!-- Bottom ticket & authenticator definitions -->
    <rect x="8" y="976" width="704" height="196" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" data-role="note"/>
    <text x="28" y="1008" text-anchor="start" font-size="15" font-weight="400" fill="#1f2937">Ticket<tspan dy="3" font-size="15">tgs</tspan><tspan dy="-3"> = E</tspan><tspan dy="3" font-size="15">Ktgs</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="15">c,tgs</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="15">c</tspan><tspan dy="-3"> ‖ AD</tspan><tspan dy="3" font-size="15">c</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="15">tgs</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="15">2</tspan><tspan dy="-3"> ‖ Lifetime</tspan><tspan dy="3" font-size="15">2</tspan><tspan dy="-3">]</tspan></text>
    <text x="56" y="1034" text-anchor="start" font-size="15" font-weight="400" fill="#4b5563">只有 TGS 能解密</text>
    <text x="28" y="1068" text-anchor="start" font-size="15" font-weight="400" fill="#1f2937">Authenticator<tspan dy="3" font-size="15">c</tspan><tspan dy="-3">（③）= E</tspan><tspan dy="3" font-size="15">Kc,tgs</tspan><tspan dy="-3">[ID</tspan><tspan dy="3" font-size="15">c</tspan><tspan dy="-3"> ‖ AD</tspan><tspan dy="3" font-size="15">c</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="15">3</tspan><tspan dy="-3">]</tspan></text>
    <text x="28" y="1102" text-anchor="start" font-size="15" font-weight="400" fill="#1f2937">Ticket<tspan dy="3" font-size="15">v</tspan><tspan dy="-3"> = E</tspan><tspan dy="3" font-size="15">Kv</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="15">c,v</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="15">c</tspan><tspan dy="-3"> ‖ AD</tspan><tspan dy="3" font-size="15">c</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="15">v</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="15">4</tspan><tspan dy="-3"> ‖ Lifetime</tspan><tspan dy="3" font-size="15">4</tspan><tspan dy="-3">]  只有 V 能解密</tspan></text>
    <text x="28" y="1140" text-anchor="start" font-size="15" font-weight="400" fill="#1f2937">Authenticator<tspan dy="3" font-size="15">c</tspan><tspan dy="-3">（⑤）= E</tspan><tspan dy="3" font-size="15">Kc,v</tspan><tspan dy="-3">[ID</tspan><tspan dy="3" font-size="15">c</tspan><tspan dy="-3"> ‖ AD</tspan><tspan dy="3" font-size="15">c</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="15">5</tspan><tspan dy="-3">]</tspan></text>
  </g>
</svg>
