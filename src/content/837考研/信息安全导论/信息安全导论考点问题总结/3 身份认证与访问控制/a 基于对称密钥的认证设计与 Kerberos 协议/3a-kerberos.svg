<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img">
  <title>Kerberos 认证协议三阶段时序图</title>
  <desc>展示客户端 C、认证服务器 AS、票据授予服务器 TGS 与应用服务器 V 之间六个步骤的三阶段认证交换过程。</desc>
  <defs>
    <marker id="3a-krb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="360" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">Kerberos 认证协议三阶段交互</text>

    <rect x="24" y="108" width="672" height="124" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="40" y="136" text-anchor="start" font-size="12" font-weight="600" fill="#1e40af">一阶段</text>
    <text x="40" y="156" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">C ↔ AS</text>

    <rect x="24" y="240" width="672" height="124" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="40" y="268" text-anchor="start" font-size="12" font-weight="600" fill="#92400e">二阶段</text>
    <text x="40" y="288" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">C ↔ TGS</text>

    <rect x="24" y="372" width="672" height="124" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>
    <text x="40" y="400" text-anchor="start" font-size="12" font-weight="600" fill="#115e59">三阶段</text>
    <text x="40" y="420" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">C ↔ V</text>

    <rect x="96" y="60" width="96" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="144" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">C 客户机</text>

    <rect x="288" y="60" width="80" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="328" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">AS</text>

    <rect x="456" y="60" width="80" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="496" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">TGS</text>

    <rect x="600" y="60" width="96" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="648" y="83" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">V 服务器</text>

    <line x1="144" y1="96" x2="144" y2="484" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="328" y1="96" x2="328" y2="484" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="496" y1="96" x2="496" y2="484" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="648" y1="96" x2="648" y2="484" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <line x1="144" y1="148" x2="324" y2="148" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="236" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">① IDc ‖ IDtgs ‖ TS1</text>

    <line x1="328" y1="204" x2="148" y2="204" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="236" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② E_Kc[Kc,tgs ‖ IDtgs ‖</text>
    <text x="236" y="194" text-anchor="middle" font-size="12" font-weight="400" fill="#92400e">TS2 ‖ LT2 ‖ Ticket_tgs]</text>

    <line x1="144" y1="284" x2="492" y2="284" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="412" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">③ IDv ‖ Ticket_tgs</text>
    <text x="412" y="274" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">‖ Authenticator_c</text>

    <line x1="496" y1="340" x2="148" y2="340" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="412" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">④ E_Kc,tgs[Kc,v ‖ IDv</text>
    <text x="412" y="330" text-anchor="middle" font-size="12" font-weight="400" fill="#92400e">‖ TS4 ‖ Ticket_v]</text>

    <line x1="144" y1="416" x2="644" y2="416" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="572" y="388" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">⑤ Ticket_v ‖</text>
    <text x="572" y="406" text-anchor="middle" font-size="12" font-weight="400" fill="#1e40af">Authenticator_c</text>

    <line x1="648" y1="472" x2="148" y2="472" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#3a-krb-arrow)"/>
    <text x="572" y="460" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">⑥ E_Kc,v[TS5+1]</text>
  </g>
</svg>
