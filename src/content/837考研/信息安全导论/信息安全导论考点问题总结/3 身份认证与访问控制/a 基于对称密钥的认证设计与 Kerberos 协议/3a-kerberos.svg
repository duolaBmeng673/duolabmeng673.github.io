<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1010" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="mblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="mred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="morange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="mamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="1160" height="1010" fill="#ffffff"/><rect x="4" y="90" width="1152" height="240" fill="#dbeafe" opacity="0.45"/><text x="14" y="112" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold">一阶段  C ↔ AS</text><rect x="4" y="330" width="1152" height="240" fill="#fef3c7" opacity="0.45"/><text x="14" y="352" font-size="13" fill="#b45309" text-anchor="start" font-weight="bold">二阶段  C ↔ TGS</text><rect x="4" y="570" width="1152" height="240" fill="#dcfce7" opacity="0.45"/><text x="14" y="592" font-size="13" fill="#15803d" text-anchor="start" font-weight="bold">三阶段  C ↔ V</text><line x1="80" y1="70" x2="80" y2="815" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/><line x1="400" y1="70" x2="400" y2="815" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/><line x1="760" y1="70" x2="760" y2="815" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/><line x1="1080" y1="70" x2="1080" y2="815" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/><rect x="318" y="8" width="526" height="66" rx="10" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,5"/><text x="580" y="46" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">Kerberos</text><rect x="15.0" y="24" width="130" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="80" y="49.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">C 客户端</text><rect x="350.0" y="24" width="100" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="400" y="49.0" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">AS</text><rect x="710.0" y="24" width="100" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="760" y="49.0" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">TGS</text><rect x="1015.0" y="24" width="130" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="1080" y="49.0" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">V 服务器</text><line x1="80" y1="150" x2="400" y2="150" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mblue)"/><text x="240" y="140" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">① ID<tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">tgs</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="0.75em">1</tspan></text><text x="240" y="170" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">C 向 AS 请求 TGS 票据</text><line x1="400" y1="270" x2="80" y2="270" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mpurple)"/><text x="240" y="244" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">② E<tspan dy="3" font-size="0.75em">Kc</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="0.75em">c,tgs</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">tgs</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="0.75em">2</tspan><tspan dy="-3"> ‖</tspan></text><text x="240" y="260" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="bold">Lifetime<tspan dy="3" font-size="0.75em">2</tspan><tspan dy="-3"> ‖ Ticket</tspan><tspan dy="3" font-size="0.75em">tgs</tspan><tspan dy="-3">]</tspan></text><text x="240" y="290" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">AS 返回 TGS 票据</text><line x1="80" y1="390" x2="760" y2="390" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mblue)"/><text x="580" y="380" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">③ ID<tspan dy="3" font-size="0.75em">v</tspan><tspan dy="-3"> ‖ Ticket</tspan><tspan dy="3" font-size="0.75em">tgs</tspan><tspan dy="-3"> ‖ Authenticator</tspan><tspan dy="3" font-size="0.75em">c</tspan></text><text x="580" y="410" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">C 向 TGS 请求应用服务器票据</text><line x1="760" y1="510" x2="80" y2="510" stroke="#ea580c" stroke-width="2.5" marker-end="url(#morange)"/><text x="580" y="500" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="bold">④ E<tspan dy="3" font-size="0.75em">Kc,tgs</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="0.75em">c,v</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">v</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="0.75em">4</tspan><tspan dy="-3"> ‖ Ticket</tspan><tspan dy="3" font-size="0.75em">v</tspan><tspan dy="-3">]</tspan></text><text x="580" y="530" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">TGS 返回应用服务器票据</text><line x1="80" y1="630" x2="1080" y2="630" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mblue)"/><text x="920" y="620" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">⑤ Ticket<tspan dy="3" font-size="0.75em">v</tspan><tspan dy="-3"> ‖ Authenticator</tspan><tspan dy="3" font-size="0.75em">c</tspan></text><text x="920" y="650" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">C 向 V 发起服务请求</text><line x1="1080" y1="750" x2="80" y2="750" stroke="#15803d" stroke-width="2.5" marker-end="url(#mgreen)"/><text x="920" y="740" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">⑥ E<tspan dy="3" font-size="0.75em">Kc,v</tspan><tspan dy="-3">[TS</tspan><tspan dy="3" font-size="0.75em">5</tspan><tspan dy="-3">+1]</tspan></text><text x="920" y="770" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">V 回应 TS<tspan dy="3" font-size="0.75em">5</tspan><tspan dy="-3">+1，证明自己是真服务器</tspan></text><rect x="40" y="835" width="1080" height="150" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/><text x="70" y="872" font-size="14" fill="#374151" text-anchor="start" font-weight="normal">Ticket<tspan dy="3" font-size="0.75em">tgs</tspan><tspan dy="-3"> = E</tspan><tspan dy="3" font-size="0.75em">Ktgs</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="0.75em">c,tgs</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3"> ‖ AD</tspan><tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">tgs</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="0.75em">2</tspan><tspan dy="-3"> ‖ Lifetime</tspan><tspan dy="3" font-size="0.75em">2</tspan><tspan dy="-3">]    只有 TGS 能解密</tspan></text><text x="70" y="902" font-size="14" fill="#374151" text-anchor="start" font-weight="normal">Authenticator<tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3">（③）= E</tspan><tspan dy="3" font-size="0.75em">Kc,tgs</tspan><tspan dy="-3">[ID</tspan><tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3"> ‖ AD</tspan><tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="0.75em">3</tspan><tspan dy="-3">]</tspan></text><text x="70" y="932" font-size="14" fill="#374151" text-anchor="start" font-weight="normal">Ticket<tspan dy="3" font-size="0.75em">v</tspan><tspan dy="-3"> = E</tspan><tspan dy="3" font-size="0.75em">Kv</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="0.75em">c,v</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3"> ‖ AD</tspan><tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">v</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="0.75em">4</tspan><tspan dy="-3"> ‖ Lifetime</tspan><tspan dy="3" font-size="0.75em">4</tspan><tspan dy="-3">]    只有 V 能解密</tspan></text><text x="70" y="962" font-size="14" fill="#374151" text-anchor="start" font-weight="normal">Authenticator<tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3">（⑤）= E</tspan><tspan dy="3" font-size="0.75em">Kc,v</tspan><tspan dy="-3">[ID</tspan><tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3"> ‖ AD</tspan><tspan dy="3" font-size="0.75em">c</tspan><tspan dy="-3"> ‖ TS</tspan><tspan dy="3" font-size="0.75em">5</tspan><tspan dy="-3">]</tspan></text></svg>