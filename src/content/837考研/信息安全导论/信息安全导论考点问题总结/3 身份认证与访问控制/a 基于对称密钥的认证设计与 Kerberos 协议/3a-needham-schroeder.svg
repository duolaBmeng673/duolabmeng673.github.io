<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" width="720" height="484" role="img">
  <title>Needham-Schroeder 对称密钥认证协议</title>
  <desc>展示客户端 A、密钥分配中心 KDC 与目标 B 之间五步认证流程及第③步的重放攻击风险。</desc>
  <defs>
    <marker id="3a-ns-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="360" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">Needham-Schroeder 认证协议（对称密钥）</text>

    <rect x="24" y="60" width="672" height="400" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>

    <rect x="76" y="80" width="80" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="116" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">A</text>

    <rect x="320" y="80" width="80" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="360" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">KDC</text>

    <rect x="564" y="80" width="80" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="604" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">B</text>

    <line x1="116" y1="116" x2="116" y2="408" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="360" y1="116" x2="360" y2="408" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="604" y1="116" x2="604" y2="408" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <line x1="116" y1="160" x2="356" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="238" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">① ID_A ‖ ID_B ‖ N1</text>

    <line x1="360" y1="216" x2="120" y2="216" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="238" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">② E_Ka[Ks ‖ ID_B ‖ N1 ‖</text>
    <text x="238" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="#92400e">E_Kb[Ks ‖ ID_A]]</text>

    <line x1="116" y1="272" x2="600" y2="272" stroke="#ef4444" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="482" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">③ E_Kb[Ks ‖ ID_A]</text>

    <line x1="604" y1="328" x2="120" y2="328" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="482" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">④ E_Ks[N2]</text>

    <line x1="116" y1="384" x2="600" y2="384" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="482" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">⑤ E_Ks[f(N2)]</text>

    <rect x="88" y="416" width="544" height="36" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" data-role="note"/>
    <text x="360" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">重放风险：截获 ③ E_Kb[Ks ‖ ID_A]（无时间戳）可日后冒充 A 从 ③ 重放</text>
  </g>
</svg>
