<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="mblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="mred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="morange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="mamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="920" height="590" fill="#ffffff"/><line x1="100" y1="64" x2="100" y2="470" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/><line x1="460" y1="64" x2="460" y2="470" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/><line x1="820" y1="64" x2="820" y2="470" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/><rect x="55.0" y="24" width="90" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="100" y="49.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">A</text><rect x="405.0" y="24" width="110" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="460" y="49.0" font-size="15" fill="#b45309" text-anchor="middle" font-weight="bold">KDC</text><rect x="775.0" y="24" width="90" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="820" y="49.0" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">B</text><line x1="100" y1="130" x2="460" y2="130" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mblue)"/><text x="280" y="120" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">① ID<tspan dy="3" font-size="0.75em">A</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">B</tspan><tspan dy="-3"> ‖ N</tspan><tspan dy="3" font-size="0.75em">1</tspan></text><text x="280" y="150" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">A 向 KDC 请求与 B 通信的临时会话密钥，附随机数 N<tspan dy="3" font-size="0.75em">1</tspan></text><line x1="460" y1="210" x2="100" y2="210" stroke="#b45309" stroke-width="2.5" marker-end="url(#mamber)"/><text x="280" y="184" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">② E<tspan dy="3" font-size="0.75em">Ka</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="0.75em">s</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">B</tspan><tspan dy="-3"> ‖ N</tspan><tspan dy="3" font-size="0.75em">1</tspan><tspan dy="-3"> ‖</tspan></text><text x="280" y="200" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">E<tspan dy="3" font-size="0.75em">Kb</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="0.75em">s</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">A</tspan><tspan dy="-3">]]</tspan></text><text x="280" y="230" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">KDC 用 K<tspan dy="3" font-size="0.75em">a</tspan><tspan dy="-3"> 加密后返回给 A</tspan></text><line x1="100" y1="290" x2="820" y2="290" stroke="#dc2626" stroke-width="2.5" marker-end="url(#mred)"/><text x="640" y="280" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">③ E<tspan dy="3" font-size="0.75em">Kb</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="0.75em">s</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">A</tspan><tspan dy="-3">]</tspan></text><text x="640" y="310" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">A 转发给 B，只有 B 能解密，得到 K<tspan dy="3" font-size="0.75em">s</tspan><tspan dy="-3"> 与 ID</tspan><tspan dy="3" font-size="0.75em">A</tspan></text><line x1="820" y1="370" x2="100" y2="370" stroke="#15803d" stroke-width="2.5" marker-end="url(#mgreen)"/><text x="640" y="360" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">④ E<tspan dy="3" font-size="0.75em">Ks</tspan><tspan dy="-3">[N</tspan><tspan dy="3" font-size="0.75em">2</tspan><tspan dy="-3">]</tspan></text><text x="640" y="390" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">B 向 A 发起挑战</text><line x1="100" y1="450" x2="820" y2="450" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mblue)"/><text x="640" y="440" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">⑤ E<tspan dy="3" font-size="0.75em">Ks</tspan><tspan dy="-3">[f(N</tspan><tspan dy="3" font-size="0.75em">2</tspan><tspan dy="-3">)]</tspan></text><text x="640" y="470" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">A 解出 N<tspan dy="3" font-size="0.75em">2</tspan><tspan dy="-3">，作变换 f（如 N</tspan><tspan dy="3" font-size="0.75em">2</tspan><tspan dy="-3">−1），再加密回传</tspan></text><rect x="60" y="500" width="800" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="460" y="527" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">安全问题：重放攻击</text><text x="460" y="553" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="normal">攻击者 C 截获 ③ 的 E<tspan dy="3" font-size="0.75em">Kb</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="0.75em">s</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">A</tspan><tspan dy="-3">]，若日后得到 K</tspan><tspan dy="3" font-size="0.75em">s</tspan><tspan dy="-3">，即可冒充 A 直接从 ③ 开始与 B 建立认证</tspan></text></svg>