<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" width="720" height="740" role="img">
  <title>Needham-Schroeder 对称密钥认证协议</title>
  <desc>展示客户端 A、密钥分配中心 KDC 与目标 B 之间五步认证流程、各步中文说明及第③步的重放攻击风险。</desc>
  <defs>
    <marker id="3a-ns-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="88" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="52" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">A</text>

    <rect x="316" y="8" width="88" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">KDC</text>

    <rect x="624" y="8" width="88" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="668" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">B</text>

    <line x1="52" y1="52" x2="52" y2="608" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="360" y1="52" x2="360" y2="608" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="668" y1="52" x2="668" y2="608" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Step 1: A -> KDC -->
    <line x1="52" y1="108" x2="356" y2="108" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="206" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">① ID<tspan dy="4" font-size="15">A</tspan><tspan dy="-4"> ‖ ID</tspan><tspan dy="4" font-size="15">B</tspan><tspan dy="-4"> ‖ N</tspan><tspan dy="4" font-size="15">1</tspan></text>
    <text x="206" y="132" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">A 向 KDC 请求与 B 通信的</text>
    <text x="206" y="158" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">临时会话密钥，附随机数 N<tspan dy="3" font-size="15">1</tspan></text>

    <!-- Step 2: KDC -> A -->
    <line x1="360" y1="244" x2="56" y2="244" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="206" y="200" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">② E<tspan dy="4" font-size="15">Ka</tspan><tspan dy="-4">[K</tspan><tspan dy="4" font-size="15">s</tspan><tspan dy="-4"> ‖ ID</tspan><tspan dy="4" font-size="15">B</tspan><tspan dy="-4"> ‖ N</tspan><tspan dy="4" font-size="15">1</tspan><tspan dy="-4"> ‖</tspan></text>
    <text x="206" y="228" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">E<tspan dy="4" font-size="15">Kb</tspan><tspan dy="-4">[K</tspan><tspan dy="4" font-size="15">s</tspan><tspan dy="-4"> ‖ ID</tspan><tspan dy="4" font-size="15">A</tspan><tspan dy="-4">]]</tspan></text>
    <text x="206" y="268" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">KDC 用 K<tspan dy="3" font-size="15">a</tspan><tspan dy="-3"> 加密后返回给 A</tspan></text>

    <!-- Step 3: A -> B -->
    <line x1="52" y1="340" x2="664" y2="340" stroke="#ef4444" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="514" y="324" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">③ E<tspan dy="4" font-size="15">Kb</tspan><tspan dy="-4">[K</tspan><tspan dy="4" font-size="15">s</tspan><tspan dy="-4"> ‖ ID</tspan><tspan dy="4" font-size="15">A</tspan><tspan dy="-4">]</tspan></text>
    <text x="514" y="364" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">A 转发给 B，只有 B 能解密，</text>
    <text x="514" y="390" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">得到 K<tspan dy="3" font-size="15">s</tspan><tspan dy="-3"> 与 ID</tspan><tspan dy="3" font-size="15">A</tspan></text>

    <!-- Step 4: B -> A -->
    <line x1="668" y1="452" x2="56" y2="452" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="514" y="436" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">④ E<tspan dy="4" font-size="15">Ks</tspan><tspan dy="-4">[N</tspan><tspan dy="4" font-size="15">2</tspan><tspan dy="-4">]</tspan></text>
    <text x="514" y="476" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">B 向 A 发起挑战</text>

    <!-- Step 5: A -> B -->
    <line x1="52" y1="544" x2="664" y2="544" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-ns-arrow)"/>
    <text x="514" y="528" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">⑤ E<tspan dy="4" font-size="15">Ks</tspan><tspan dy="-4">[f(N</tspan><tspan dy="4" font-size="15">2</tspan><tspan dy="-4">)]</tspan></text>
    <text x="514" y="568" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">A 解出 N<tspan dy="3" font-size="15">2</tspan><tspan dy="-3">，作变换 f（如 N</tspan><tspan dy="3" font-size="15">2</tspan><tspan dy="-3">−1），</tspan></text>
    <text x="514" y="594" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">再加密回传</text>

    <!-- Bottom replay note box -->
    <rect x="8" y="624" width="704" height="108" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" data-role="note"/>
    <text x="360" y="654" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">安全问题：重放攻击</text>
    <text x="360" y="684" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">攻击者 C 截获 ③ 的 E<tspan dy="3" font-size="15">Kb</tspan><tspan dy="-3">[K</tspan><tspan dy="3" font-size="15">s</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="15">A</tspan><tspan dy="-3">]，若日后得到 K</tspan><tspan dy="3" font-size="15">s</tspan><tspan dy="-3">，</tspan></text>
    <text x="360" y="710" text-anchor="middle" font-size="15" font-weight="400" fill="#991b1b">即可冒充 A 直接从 ③ 开始与 B 建立认证</text>
  </g>
</svg>
