<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="mblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="mred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="morange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="mamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect width="800" height="390" fill="#ffffff"/><line x1="140" y1="64" x2="140" y2="310" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/><line x1="660" y1="64" x2="660" y2="310" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/><rect x="75.0" y="24" width="130" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="140" y="49.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">A（证明方）</text><rect x="595.0" y="24" width="130" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="660" y="49.0" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">B（验证方）</text><line x1="140" y1="120" x2="660" y2="120" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mblue)"/><text x="400" y="110" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">① ID<tspan dy="3" font-size="0.75em">a</tspan><tspan dy="-3"> ‖ ID</tspan><tspan dy="3" font-size="0.75em">b</tspan></text><text x="400" y="140" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">A 声明自己的身份 ID<tspan dy="3" font-size="0.75em">a</tspan><tspan dy="-3">，以及对方 B 的标识 ID</tspan><tspan dy="3" font-size="0.75em">b</tspan></text><line x1="660" y1="200" x2="140" y2="200" stroke="#15803d" stroke-width="2.5" marker-end="url(#mgreen)"/><text x="400" y="190" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">② N<tspan dy="3" font-size="0.75em">b</tspan></text><text x="400" y="220" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">B 发出挑战：N<tspan dy="3" font-size="0.75em">b</tspan><tspan dy="-3"> 为一次性随机数</tspan></text><line x1="140" y1="280" x2="660" y2="280" stroke="#2563eb" stroke-width="2.5" marker-end="url(#mblue)"/><text x="400" y="270" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">③ E<tspan dy="3" font-size="0.75em">K</tspan><tspan dy="-3">(N</tspan><tspan dy="3" font-size="0.75em">b</tspan><tspan dy="-3">)</tspan></text><text x="400" y="300" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">A 应答：用共享密钥 K 加密 N<tspan dy="3" font-size="0.75em">b</tspan></text><rect x="190" y="322" width="420" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="400" y="350" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">B 验证：用 K 解密，结果 = N<tspan dy="3" font-size="0.75em">b</tspan><tspan dy="-3"> → 认证成功</tspan></text></svg>