<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" width="720" height="388" role="img">
  <title>基于挑战-应答方式的认证协议</title>
  <desc>展示证明方 A 与验证方 B 通过三步挑战-应答（声明身份、发送一次性随机数、共享密钥加密应答）完成身份认证的时序过程。</desc>
  <defs>
    <marker id="3a-cr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="360" y="44" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">基于挑战-应答方式的认证协议</text>

    <rect x="24" y="60" width="672" height="304" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" data-role="group"/>

    <rect x="104" y="80" width="112" height="36" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="160" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">A（证明方）</text>

    <rect x="504" y="80" width="112" height="36" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="560" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#115e59">B（验证方）</text>

    <line x1="160" y1="116" x2="160" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="560" y1="116" x2="560" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <line x1="160" y1="164" x2="556" y2="164" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-cr-arrow)"/>
    <text x="360" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">① IDa ‖ IDb</text>

    <line x1="560" y1="220" x2="164" y2="220" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#3a-cr-arrow)"/>
    <text x="360" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#115e59">② Nb</text>

    <line x1="160" y1="276" x2="556" y2="276" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-cr-arrow)"/>
    <text x="360" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">③ E_K[Nb]</text>

    <rect x="160" y="312" width="400" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" data-role="note"/>
    <text x="360" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">B 用 K 解密，结果 = Nb 则认证成功</text>
  </g>
</svg>
