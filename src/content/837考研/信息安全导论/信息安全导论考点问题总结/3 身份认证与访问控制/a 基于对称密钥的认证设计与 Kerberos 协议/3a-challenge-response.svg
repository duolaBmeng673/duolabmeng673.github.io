<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" role="img">
  <title>基于挑战-应答方式的认证协议</title>
  <desc>展示证明方 A 与验证方 B 通过三步挑战-应答（声明身份、发送一次性随机数、共享密钥加密应答）完成身份认证的时序过程。</desc>
  <defs>
    <marker id="3a-cr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="144" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">A（证明方）</text>

    <rect x="568" y="8" width="144" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="640" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">B（验证方）</text>

    <line x1="80" y1="52" x2="80" y2="316" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="640" y1="52" x2="640" y2="316" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <line x1="80" y1="108" x2="636" y2="108" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-cr-arrow)"/>
    <text x="360" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">① ID<tspan dy="4" font-size="15">a</tspan><tspan dy="-4"> ‖ ID</tspan><tspan dy="4" font-size="15">b</tspan></text>
    <text x="360" y="132" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">A 声明自己的身份 ID<tspan dy="3" font-size="15">a</tspan><tspan dy="-3">，以及对方 B 的标识 ID</tspan><tspan dy="3" font-size="15">b</tspan></text>

    <line x1="640" y1="196" x2="84" y2="196" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#3a-cr-arrow)"/>
    <text x="360" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">② N<tspan dy="4" font-size="15">b</tspan></text>
    <text x="360" y="220" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">B 发出挑战：N<tspan dy="3" font-size="15">b</tspan><tspan dy="-3"> 为一次性随机数</tspan></text>

    <line x1="80" y1="284" x2="636" y2="284" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#3a-cr-arrow)"/>
    <text x="360" y="268" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">③ E<tspan dy="4" font-size="15">K</tspan><tspan dy="-4">(N</tspan><tspan dy="4" font-size="15">b</tspan><tspan dy="-4">)</tspan></text>
    <text x="360" y="308" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">A 应答：用共享密钥 K 加密 N<tspan dy="3" font-size="15">b</tspan></text>

    <rect x="120" y="332" width="480" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" data-role="note"/>
    <text x="360" y="360" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">B 验证：用 K 解密，结果 = N<tspan dy="4" font-size="15">b</tspan><tspan dy="-4"> → 认证成功</tspan></text>
  </g>
</svg>
