<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 598" width="720" height="598" role="img">
  <title>Windows 域登录认证流程（质询—应答）</title>
  <desc>展示客户端 Winlogon 与主域控制器之间通过 8 字节质询及口令散列对质询加密/散列完成应答比对的认证过程。</desc>
  <defs>
    <marker id="win-login-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Headers (Client 8..292 w=284, PDC 428..712 w=284) -->
    <rect x="8" y="8" width="284" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="150" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">客户端</text>
    <text x="150" y="58" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">已注册用户（保存用户名、口令）</text>

    <rect x="428" y="8" width="284" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="570" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">主域控制器</text>
    <text x="570" y="58" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">SAM / AD：存放用户口令散列</text>

    <line x1="292" y1="40" x2="312" y2="40" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="314" y="18" width="92" height="44" rx="20" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="360" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">共享口令</text>
    <line x1="406" y1="40" x2="428" y2="40" stroke="#94a3b8" stroke-width="1.5"/>

    <line x1="150" y1="72" x2="150" y2="96" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="570" y1="72" x2="570" y2="96" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="150" y1="160" x2="150" y2="246" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="570" y1="160" x2="570" y2="246" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="150" y1="310" x2="150" y2="458" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="570" y1="310" x2="570" y2="354" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Step 1 & 2 -->
    <rect x="8" y="96" width="284" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="150" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">① Winlogon 输入用户名、口令</text>
    <text x="150" y="146" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">本地计算口令散列</text>

    <rect x="428" y="96" width="284" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="570" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">② 取该用户的口令散列</text>
    <text x="570" y="146" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59">生成 8 字节质询</text>

    <line x1="292" y1="128" x2="424" y2="128" stroke="#3b82f6" stroke-width="2" marker-end="url(#win-login-arrow)"/>
    <text x="360" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">请求登录</text>

    <!-- Challenge -->
    <line x1="570" y1="212" x2="154" y2="212" stroke="#14b8a6" stroke-width="2" marker-end="url(#win-login-arrow)"/>
    <circle cx="570" cy="212" r="4" fill="#115e59"/>
    <text x="360" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">发送质询（8 字节）</text>

    <!-- Step 3 & 4 -->
    <rect x="8" y="246" width="284" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="150" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">③ 用口令散列对质询</text>
    <text x="150" y="296" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">进行散列 → 质询散列</text>

    <rect x="428" y="246" width="284" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="570" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">④ 用口令散列对质询</text>
    <text x="570" y="296" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">进行散列 → 质询散列</text>

    <text x="360" y="276" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">双方各自</text>
    <text x="360" y="298" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">独立计算</text>

    <!-- Response -->
    <path d="M150 310 V386 H424" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#win-login-arrow)"/>
    <text x="292" y="372" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">返回质询散列（应答）</text>

    <!-- Step 5 -->
    <rect x="428" y="354" width="284" height="64" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="570" y="380" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">⑤ 比对两个质询散列</text>
    <text x="570" y="404" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">完成认证</text>

    <!-- Result -->
    <line x1="570" y1="418" x2="570" y2="454" stroke="#4b5563" stroke-width="1.5" marker-end="url(#win-login-arrow)"/>
    <rect x="428" y="458" width="138" height="64" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="497" y="484" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">相同：</text>
    <text x="497" y="508" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">登录成功</text>

    <rect x="574" y="458" width="138" height="64" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="643" y="484" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">否则：</text>
    <text x="643" y="508" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">登录失败</text>

    <line x1="428" y1="490" x2="296" y2="490" stroke="#14b8a6" stroke-width="2" marker-end="url(#win-login-arrow)"/>
    <text x="360" y="476" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">认证结果</text>

    <rect x="8" y="458" width="284" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="150" y="496" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">认证登录结束</text>

    <rect x="8" y="546" width="704" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="note"/>
    <text x="360" y="574" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">网络上只传输质询和质询散列，口令及其散列都不随请求发送</text>
  </g>
</svg>
