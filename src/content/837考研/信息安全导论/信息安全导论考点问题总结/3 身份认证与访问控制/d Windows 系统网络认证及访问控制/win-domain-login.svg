<svg viewBox="0 0 900 690" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#185FA5"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#534AB7"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F6E56"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker>
  </defs>
  <rect width="900" height="690" fill="#FFFFFF"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2C2C2A">Windows 域登录认证流程（质询—应答）</text>

  <!-- headers -->
  <rect x="60" y="55" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="200" y="79" text-anchor="middle" font-size="16" font-weight="bold" fill="#0C447C">客户端</text>
  <text x="200" y="99" text-anchor="middle" font-size="13" fill="#185FA5">已注册用户（保存用户名、口令）</text>
  <rect x="560" y="55" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="700" y="79" text-anchor="middle" font-size="16" font-weight="bold" fill="#085041">主域控制器</text>
  <text x="700" y="99" text-anchor="middle" font-size="13" fill="#0F6E56">SAM / AD：存放用户口令散列</text>

  <!-- shared password -->
  <line x1="340" y1="83" x2="380" y2="83" stroke="#BA7517" stroke-width="1.5" marker-end="url(#aGray)" marker-start="url(#aGray)"/>
  <ellipse cx="450" cy="83" rx="70" ry="22" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="450" y="89" text-anchor="middle" font-size="15" font-weight="bold" fill="#633806">共享口令</text>
  <line x1="520" y1="83" x2="560" y2="83" stroke="#BA7517" stroke-width="1.5" marker-end="url(#aGray)" marker-start="url(#aGray)"/>

  <!-- lifelines -->
  <line x1="200" y1="111" x2="200" y2="140" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="700" y1="111" x2="700" y2="140" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="200" y1="196" x2="200" y2="340" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="700" y1="196" x2="700" y2="340" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- step 1 -->
  <rect x="60" y="140" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="200" y="164" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C447C">① Winlogon 输入用户名、口令</text>
  <text x="200" y="184" text-anchor="middle" font-size="13" fill="#185FA5">本地计算口令散列</text>

  <!-- step 2 -->
  <rect x="560" y="140" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="700" y="164" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">② 取该用户的口令散列</text>
  <text x="700" y="184" text-anchor="middle" font-size="13" fill="#0F6E56">生成 8 字节质询</text>

  <!-- arrow request -->
  <line x1="340" y1="168" x2="558" y2="168" stroke="#185FA5" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="450" y="158" text-anchor="middle" font-size="14" fill="#0C447C">请求登录</text>

  <!-- arrow challenge -->
  <line x1="700" y1="262" x2="202" y2="262" stroke="#534AB7" stroke-width="2" marker-end="url(#aPurple)"/>
  <circle cx="700" cy="262" r="3.5" fill="#534AB7"/>
  <text x="450" y="252" text-anchor="middle" font-size="14" fill="#3C3489">发送质询（8 字节）</text>

  <!-- step 3 & 4 -->
  <rect x="60" y="340" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="200" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">③ 用口令散列对质询</text>
  <text x="200" y="384" text-anchor="middle" font-size="13" fill="#534AB7">进行散列 → 质询散列</text>
  <rect x="560" y="340" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="700" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">④ 用口令散列对质询</text>
  <text x="700" y="384" text-anchor="middle" font-size="13" fill="#534AB7">进行散列 → 质询散列</text>
  <text x="450" y="373" text-anchor="middle" font-size="13" fill="#5F5E5A">双方各自独立计算</text>

  <!-- response -->
  <path d="M200 396 V472 H558" fill="none" stroke="#534AB7" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="380" y="462" text-anchor="middle" font-size="14" fill="#3C3489">返回质询散列（应答）</text>

  <!-- step 5 -->
  <line x1="700" y1="396" x2="700" y2="444" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="560" y="444" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="700" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#633806">⑤ 比对两个质询散列</text>
  <text x="700" y="488" text-anchor="middle" font-size="13" fill="#854F0B">完成认证</text>

  <!-- result -->
  <line x1="700" y1="500" x2="700" y2="540" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#aGray)"/>
  <rect x="560" y="542" width="135" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="627" y="572" text-anchor="middle" font-size="14" font-weight="bold" fill="#27500A">相同：登录成功</text>
  <rect x="705" y="542" width="135" height="50" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="772" y="572" text-anchor="middle" font-size="14" font-weight="bold" fill="#791F1F">否则：登录失败</text>
  <line x1="560" y1="567" x2="342" y2="567" stroke="#0F6E56" stroke-width="2" marker-end="url(#aTeal)"/>
  <text x="451" y="557" text-anchor="middle" font-size="14" fill="#085041">认证结果</text>
  <rect x="60" y="542" width="280" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="200" y="572" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">认证登录结束</text>

  <!-- note -->
  <rect x="60" y="620" width="780" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="450" y="649" text-anchor="middle" font-size="14" fill="#2C2C2A">网络上只传输质询和质询散列，口令及其散列都不随请求发送</text>
</svg>
