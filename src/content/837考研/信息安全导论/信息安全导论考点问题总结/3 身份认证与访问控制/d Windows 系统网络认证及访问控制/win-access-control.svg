<svg viewBox="0 0 920 450" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#185FA5"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#534AB7"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0F6E56"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5F5E5A"/></marker>
  </defs>
  <rect width="920" height="450" fill="#FFFFFF"/>
  <text x="460" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2C2C2A">Windows 访问控制流程</text>

  <!-- LSA -->
  <rect x="20" y="52" width="220" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="130" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C447C">LSA（用户模式）</text>
  <line x1="130" y1="100" x2="130" y2="148" stroke="#185FA5" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="142" y="130" font-size="13" fill="#0C447C">① 认证后生成</text>

  <!-- token -->
  <rect x="20" y="150" width="220" height="130" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="130" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">Access Token（张三）</text>
  <text x="36" y="208" font-size="13" fill="#3C3489">User SID：张三的 SID</text>
  <text x="36" y="234" font-size="13" fill="#3C3489">Group SID：Users、财务组</text>
  <text x="36" y="260" font-size="13" fill="#3C3489">Privileges：特权信息</text>

  <!-- SRM -->
  <rect x="340" y="150" width="200" height="130" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="440" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#633806">SRM（内核模式）</text>
  <text x="440" y="202" text-anchor="middle" font-size="13" fill="#854F0B">安全引用监视器</text>
  <text x="440" y="236" text-anchor="middle" font-size="13" fill="#633806">④ 比对令牌与 DACL</text>
  <text x="440" y="259" text-anchor="middle" font-size="13" fill="#633806">逐条 ACE，决定放行</text>

  <!-- token -> SRM -->
  <line x1="240" y1="215" x2="338" y2="215" stroke="#534AB7" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="290" y="205" text-anchor="middle" font-size="13" fill="#3C3489">② 提交令牌</text>

  <!-- descriptor -> SRM -->
  <line x1="648" y1="215" x2="542" y2="215" stroke="#0F6E56" stroke-width="2" marker-end="url(#aTeal)"/>
  <text x="595" y="205" text-anchor="middle" font-size="13" fill="#085041">③ 取描述符</text>

  <!-- descriptor -->
  <rect x="650" y="52" width="250" height="288" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="775" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">安全描述符（secret.txt）</text>
  <rect x="662" y="90" width="226" height="158" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text x="775" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">DACL（自主访问控制列表）</text>
  <rect x="672" y="122" width="206" height="30" rx="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="682" y="142" font-size="12.5" fill="#27500A">ACE1 张三：Allow Read</text>
  <rect x="672" y="158" width="206" height="30" rx="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="682" y="178" font-size="12.5" fill="#27500A">ACE2 财务组：Allow Read/Write</text>
  <rect x="672" y="194" width="206" height="30" rx="5" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="682" y="214" font-size="12.5" fill="#791F1F">ACE3 普通用户：Deny Write</text>
  <text x="775" y="240" text-anchor="middle" font-size="12" fill="#5F5E5A">DACL = {ACE1, ACE2, ACE3 …}</text>
  <rect x="662" y="258" width="226" height="68" rx="6" fill="#FFFFFF" stroke="#BA7517" stroke-width="1"/>
  <text x="775" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">SACL（系统访问控制列表）</text>
  <text x="775" y="308" text-anchor="middle" font-size="13" fill="#854F0B">指定哪些访问行为需审计</text>

  <!-- SRM results -->
  <line x1="390" y1="280" x2="390" y2="318" stroke="#3B6D11" stroke-width="2" marker-end="url(#aGray)"/>
  <line x1="490" y1="280" x2="490" y2="318" stroke="#A32D2D" stroke-width="2" marker-end="url(#aGray)"/>
  <rect x="340" y="320" width="100" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="390" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#27500A">允许</text>
  <rect x="440" y="320" width="100" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="490" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#791F1F">拒绝</text>

  <!-- audit log -->
  <line x1="775" y1="340" x2="775" y2="378" stroke="#BA7517" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="787" y="365" font-size="12" fill="#633806">⑤ 按 SACL 记录</text>
  <rect x="650" y="380" width="250" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="775" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#633806">安全日志（审计记录）</text>

  <!-- SID note -->
  <rect x="20" y="320" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="130" y="346" text-anchor="middle" font-size="13" fill="#2C2C2A">SID：账户 / 组的安全标识符</text>
  <text x="130" y="366" text-anchor="middle" font-size="13" fill="#2C2C2A">在同一系统中唯一</text>
</svg>
