<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 644" width="720" height="644" role="img">
  <title>Windows 访问控制流程</title>
  <desc>展示 LSA 生成 Access Token、SRM 比对令牌与安全描述符 DACL 逐条 ACE 决定允许或拒绝，以及按 SACL 写入安全日志的流程。</desc>
  <defs>
    <marker id="wac-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="280" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="148" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">LSA（用户模式）</text>
    <line x1="148" y1="56" x2="148" y2="108" stroke="#3b82f6" stroke-width="2" marker-end="url(#wac-arrow)"/>
    <text x="160" y="88" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">① 认证后生成</text>
    <rect x="8" y="112" width="280" height="136" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="148" y="142" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">Access Token（张三）</text>
    <text x="26" y="172" font-size="15" font-weight="400" fill="#1e40af">User SID：张三的 SID</text>
    <text x="26" y="198" font-size="15" font-weight="400" fill="#1e40af">Group SID：Users、财务组</text>
    <text x="26" y="224" font-size="15" font-weight="400" fill="#1e40af">Privileges：特权信息</text>
    <rect x="336" y="8" width="376" height="348" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5" data-role="group"/>
    <text x="524" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">安全描述符（secret.txt）</text>
    <rect x="352" y="48" width="344" height="216" rx="8" fill="#f8fafc" stroke="#14b8a6" stroke-width="1" data-role="group"/>
    <text x="524" y="74" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">DACL（自主访问控制列表）</text>
    <rect x="368" y="88" width="312" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1"/>
    <text x="386" y="114" font-size="15" font-weight="400" fill="#115e59">ACE1 张三：Allow Read</text>
    <rect x="368" y="136" width="312" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1"/>
    <text x="386" y="162" font-size="15" font-weight="400" fill="#115e59">ACE2 财务组：Allow Read/Write</text>
    <rect x="368" y="184" width="312" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="386" y="210" font-size="15" font-weight="400" fill="#991b1b">ACE3 普通用户：Deny Write</text>
    <text x="524" y="250" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">DACL = {ACE1, ACE2, ACE3 …}</text>
    <rect x="352" y="274" width="344" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="524" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">SACL（系统访问控制列表）</text>
    <text x="524" y="326" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">指定哪些访问行为需审计</text>
    <line x1="148" y1="248" x2="148" y2="420" stroke="#3b82f6" stroke-width="2" marker-end="url(#wac-arrow)"/>
    <text x="160" y="340" font-size="15" font-weight="400" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">② 提交令牌</text>
    <path d="M408 356 V396 H292 V420" fill="none" stroke="#14b8a6" stroke-width="2" marker-end="url(#wac-arrow)"/>
    <text x="350" y="384" text-anchor="middle" font-size="15" font-weight="400" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">③ 取描述符</text>
    <rect x="8" y="424" width="392" height="124" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="204" y="454" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">SRM（内核模式）· 安全引用监视器</text>
    <text x="204" y="486" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">④ 比对令牌与 DACL 逐条 ACE</text>
    <text x="204" y="514" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">决定放行或拒绝</text>
    <line x1="112" y1="548" x2="112" y2="588" stroke="#14b8a6" stroke-width="2" marker-end="url(#wac-arrow)"/>
    <rect x="44" y="592" width="136" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="112" y="620" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">允许</text>
    <line x1="296" y1="548" x2="296" y2="588" stroke="#ef4444" stroke-width="2" marker-end="url(#wac-arrow)"/>
    <rect x="228" y="592" width="136" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="296" y="620" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">拒绝</text>
    <line x1="584" y1="356" x2="584" y2="420" stroke="#f59e0b" stroke-width="2" marker-end="url(#wac-arrow)"/>
    <text x="596" y="394" font-size="15" font-weight="400" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">⑤ 按 SACL 记录</text>
    <rect x="456" y="424" width="256" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="584" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">安全日志（审计记录）</text>
    <rect x="456" y="520" width="256" height="116" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="584" y="552" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">SID 说明</text>
    <text x="584" y="584" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">账户 / 组的安全标识符</text>
    <text x="584" y="610" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">在同一系统中唯一</text>
  </g>
</svg>
