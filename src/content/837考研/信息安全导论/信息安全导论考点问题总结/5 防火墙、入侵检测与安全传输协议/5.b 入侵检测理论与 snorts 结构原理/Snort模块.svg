<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278" role="img">
  <title>Snort 四大模块工作流程</title>
  <desc>展示网络适配器、数据包捕获模块、预处理模块、检测引擎（规则匹配）与输出模块（日志 / 报警）之间的数据流向。</desc>
  <defs>
    <marker id="snort-mod-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Bottom row -->
    <rect x="8" y="102" width="140" height="88" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <line x1="22" y1="102" x2="22" y2="190" stroke="#14b8a6" stroke-width="1"/>
    <line x1="134" y1="102" x2="134" y2="190" stroke="#14b8a6" stroke-width="1"/>
    <text x="78" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">预处理</text>
    <text x="78" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">模块</text>

    <rect x="196" y="186" width="156" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="196" y1="198" x2="352" y2="198" stroke="#3b82f6" stroke-width="1"/>
    <line x1="196" y1="258" x2="352" y2="258" stroke="#3b82f6" stroke-width="1"/>
    <text x="274" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">数据包捕获</text>
    <text x="274" y="246" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">模块</text>

    <rect x="400" y="200" width="144" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="472" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#4b5563">网络适配器</text>

    <!-- Top row -->
    <rect x="196" y="14" width="156" height="88" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="196" y1="50" x2="352" y2="50" stroke="#f59e0b" stroke-width="1"/>
    <text x="274" y="38" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e">规则匹配</text>
    <text x="274" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">检测引擎</text>

    <path d="M400 18 H492 A40 40 0 0 1 492 98 H400 Z" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="458" y="64" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">输出模块</text>

    <!-- 日志 -->
    <path d="M588 8 H712 V54 Q681 44 650 54 T588 54 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="650" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">日志</text>

    <!-- 报警 -->
    <path d="M604 92 H712 V146 H604 L588 119 Z" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="654" y="125" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">报警</text>

    <g fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#snort-mod-arrow)">
      <line x1="400" y1="230" x2="356" y2="230"/>
      <path d="M196 230 H78 V194"/>
      <path d="M78 102 V58 H192"/>
      <line x1="352" y1="58" x2="396" y2="58"/>
      <line x1="532" y1="54" x2="584" y2="34"/>
      <line x1="532" y1="64" x2="584" y2="115"/>
    </g>
  </g>
</svg>
