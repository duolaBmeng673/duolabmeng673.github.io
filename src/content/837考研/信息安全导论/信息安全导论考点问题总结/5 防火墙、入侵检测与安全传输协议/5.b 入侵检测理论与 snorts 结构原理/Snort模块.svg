<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Snort 四大模块工作流程">
  <defs>
    <marker id="m-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#0B0B0B">Snort 四大模块</text>

    <!-- Bottom row: 预处理模块 <- 数据包捕获模块 <- 网络适配器 -->
    <rect x="36" y="128" width="136" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
    <line x1="50" y1="128" x2="50" y2="212" stroke="#0F6E56" stroke-width="0.7" stroke-opacity="0.5"/>
    <line x1="158" y1="128" x2="158" y2="212" stroke="#0F6E56" stroke-width="0.7" stroke-opacity="0.5"/>
    <text x="104" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">预处理</text>
    <text x="104" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">模块</text>

    <rect x="218" y="216" width="144" height="68" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/>
    <line x1="218" y1="227" x2="362" y2="227" stroke="#534AB7" stroke-width="0.7" stroke-opacity="0.45"/>
    <line x1="218" y1="273" x2="362" y2="273" stroke="#534AB7" stroke-width="0.7" stroke-opacity="0.45"/>
    <text x="290" y="247" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">数据包捕获</text>
    <text x="290" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">模块</text>

    <rect x="424" y="222" width="144" height="56" rx="8" fill="#F1EFEA" stroke="#898781" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="496" y="255" text-anchor="middle" font-size="14" font-weight="500" fill="#3E3D3A">网络适配器</text>

    <!-- Top row: 检测引擎 -> 输出模块 -> 日志 / 报警 -->
    <rect x="218" y="60" width="144" height="68" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <line x1="218" y1="84" x2="362" y2="84" stroke="#854F0B" stroke-width="0.9"/>
    <text x="290" y="76" text-anchor="middle" font-size="11" font-weight="500" fill="#854F0B">规则匹配</text>
    <text x="290" y="109" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">检测引擎</text>

    <path d="M424 60 H520 A34 34 0 0 1 520 128 H424 Z" fill="#E8F1FD" stroke="#2B6CB0" stroke-width="0.9"/>
    <text x="484" y="99" text-anchor="middle" font-size="14" font-weight="600" fill="#1E4E8C">输出模块</text>

    <!-- 日志 -->
    <path d="M614 48 H726 V94 Q698 84 670 94 T614 94 Z" fill="#F1EFEA" stroke="#898781" stroke-width="0.9"/>
    <text x="670" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#3E3D3A">日志</text>

    <!-- 报警 -->
    <path d="M626 124 H726 V176 H626 L610 150 Z" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.9"/>
    <text x="673" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#791F1F">报警</text>

    <!-- Arrows -->
    <line x1="424" y1="250" x2="366" y2="250" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <path d="M218 250 H104 V216" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <path d="M104 128 V94 H214" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <line x1="362" y1="94" x2="420" y2="94" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <line x1="554" y1="94" x2="610" y2="74" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <line x1="554" y1="94" x2="606" y2="146" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
  </g>
</svg>
