<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 381" width="720" height="381" role="img">
  <title>CIDF 通用入侵检测框架模型</title>
  <desc>通用入侵检测框架（CIDF）模型：事件产生器 E 向事件分析器 A、事件数据库 D 与响应单元 R 输送事件数据；A 与 D 交互并输出给 R；R 经由 D 与 A 的信息启动适当响应。</desc>
  <defs>
    <marker id="cidf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="80" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">事件产生器</text>
    <text x="352" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">事件分析器</text>

    <rect x="8" y="40" width="144" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="88" text-anchor="middle" font-size="18" font-weight="600" fill="#1e40af">E</text>

    <rect x="280" y="40" width="144" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="352" y="88" text-anchor="middle" font-size="18" font-weight="600" fill="#1e40af">A</text>

    <!-- Cylinder D (Event Database) -->
    <path d="M8 238 L8 318 A72 18 0 0 0 152 318 L152 238 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M8 252 A72 18 0 0 0 152 252 M8 264 A72 18 0 0 0 152 264" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="80" cy="238" rx="72" ry="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="80" y="310" text-anchor="middle" font-size="18" font-weight="600" fill="#92400e">D</text>
    <text x="80" y="368" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">事件数据库</text>

    <!-- Box R (Response Unit) -->
    <rect x="280" y="246" width="144" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="352" y="294" text-anchor="middle" font-size="18" font-weight="600" fill="#1e40af">R</text>
    <text x="352" y="368" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">响应单元</text>

    <!-- Capsule: 适当响应 -->
    <rect x="524" y="246" width="188" height="80" rx="28" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <line x1="550" y1="248" x2="550" y2="324" stroke="#14b8a6" stroke-width="1.5"/>
    <line x1="686" y1="248" x2="686" y2="324" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="618" y="292" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">适当响应</text>

    <!-- Arrows -->
    <g fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#cidf-arrow)">
      <line x1="152" y1="80" x2="276" y2="80"/>
      <line x1="80" y1="120" x2="80" y2="216"/>
      <line x1="142" y1="120" x2="276" y2="254"/>
      <line x1="292" y1="120" x2="152" y2="230"/>
      <line x1="352" y1="120" x2="352" y2="242"/>
      <line x1="152" y1="286" x2="276" y2="286"/>
      <line x1="424" y1="286" x2="520" y2="286"/>
    </g>
    <text x="474" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">启动</text>
  </g>
</svg>
