<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -15 760 468" width="760" height="468" role="img" aria-label="Snort 的三维规则链表结构">
  <defs>
    <marker id="m-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Top label -->
    <text x="90" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#3E3D3A">RuleLists</text>
    <line x1="90" y1="27" x2="90" y2="52" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>

    <!-- Dim 1: RuleListNode -->
    <rect x="24" y="42" width="712" height="92" rx="8" fill="#EEEDFE" fill-opacity="0.45" stroke="#534AB7" stroke-width="0.7"/>
    <text x="380" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">RuleListNode（第一维：按规则动作分类）</text>

    <g font-size="12" fill="#3C3489">
      <rect x="42" y="56" width="96" height="46" rx="5" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
      <line x1="42" y1="78" x2="138" y2="78" stroke="#534AB7" stroke-width="0.6"/>
      <text x="90" y="71" text-anchor="middle">Next</text>
      <text x="90" y="95" text-anchor="middle" font-weight="600">Alert</text>

      <rect x="184" y="56" width="96" height="46" rx="5" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
      <line x1="184" y1="78" x2="280" y2="78" stroke="#534AB7" stroke-width="0.6"/>
      <text x="232" y="71" text-anchor="middle">Next</text>
      <text x="232" y="95" text-anchor="middle" font-weight="600">Log</text>

      <rect x="326" y="56" width="96" height="46" rx="5" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
      <line x1="326" y1="78" x2="422" y2="78" stroke="#534AB7" stroke-width="0.6"/>
      <text x="374" y="71" text-anchor="middle">Next</text>
      <text x="374" y="95" text-anchor="middle" font-weight="600">Pass</text>

      <rect x="468" y="56" width="96" height="46" rx="5" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
      <line x1="468" y1="78" x2="564" y2="78" stroke="#534AB7" stroke-width="0.6"/>
      <text x="516" y="71" text-anchor="middle">Next</text>
      <text x="516" y="95" text-anchor="middle" font-weight="600">Activate</text>

      <rect x="610" y="56" width="96" height="46" rx="5" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.8"/>
      <line x1="610" y1="78" x2="706" y2="78" stroke="#534AB7" stroke-width="0.6"/>
      <text x="658" y="71" text-anchor="middle">Next</text>
      <text x="658" y="95" text-anchor="middle" font-weight="600">Dynamic</text>
    </g>

    <line x1="138" y1="67" x2="180" y2="67" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="280" y1="67" x2="322" y2="67" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="422" y1="67" x2="464" y2="67" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="564" y1="67" x2="606" y2="67" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>

    <!-- Dim 2: RuleListHead -->
    <rect x="24" y="150" width="152" height="154" rx="8" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-width="0.7"/>
    <text x="100" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#085041">RuleListHead（第二维）</text>
    <rect x="42" y="166" width="116" height="104" rx="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/>
    <line x1="42" y1="192" x2="158" y2="192" stroke="#0F6E56" stroke-width="0.6"/>
    <line x1="42" y1="218" x2="158" y2="218" stroke="#0F6E56" stroke-width="0.6"/>
    <line x1="42" y1="244" x2="158" y2="244" stroke="#0F6E56" stroke-width="0.6"/>
    <g font-size="12" font-weight="500" fill="#085041" text-anchor="middle">
      <text x="100" y="183">Iplist</text>
      <text x="100" y="209">Tcplist</text>
      <text x="100" y="235">Udplist</text>
      <text x="100" y="261">Icmplist</text>
    </g>

    <line x1="90" y1="102" x2="90" y2="162" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <line x1="158" y1="205" x2="190" y2="205" stroke="#898781" stroke-width="1.3" marker-end="url(#m-arr)"/>
    <line x1="158" y1="231" x2="190" y2="231" stroke="#898781" stroke-width="1.3" marker-end="url(#m-arr)"/>
    <line x1="158" y1="257" x2="190" y2="257" stroke="#898781" stroke-width="1.3" marker-end="url(#m-arr)"/>

    <!-- Dim 3 top: RuleTreeNode -->
    <rect x="196" y="150" width="540" height="142" rx="8" fill="#FAEEDA" fill-opacity="0.45" stroke="#854F0B" stroke-width="0.7"/>
    <text x="466" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">RuleTreeNode（第三维：规则头链表）</text>

    <g font-size="12" fill="#633806" text-anchor="middle">
      <rect x="218" y="164" width="114" height="92" rx="5" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.8"/>
      <line x1="218" y1="187" x2="332" y2="187" stroke="#854F0B" stroke-width="0.6"/>
      <line x1="218" y1="210" x2="332" y2="210" stroke="#854F0B" stroke-width="0.6"/>
      <line x1="218" y1="233" x2="332" y2="233" stroke="#854F0B" stroke-width="0.6"/>
      <text x="275" y="180">right</text>
      <text x="275" y="203">……</text>
      <text x="275" y="226" font-weight="600">Rule_func</text>
      <text x="275" y="249">down</text>

      <rect x="382" y="164" width="114" height="92" rx="5" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.8"/>
      <line x1="382" y1="187" x2="496" y2="187" stroke="#854F0B" stroke-width="0.6"/>
      <line x1="382" y1="210" x2="496" y2="210" stroke="#854F0B" stroke-width="0.6"/>
      <line x1="382" y1="233" x2="496" y2="233" stroke="#854F0B" stroke-width="0.6"/>
      <text x="439" y="180">right</text>
      <text x="439" y="203">……</text>
      <text x="439" y="226" font-weight="600">Rule_func</text>
      <text x="439" y="249">down</text>

      <rect x="546" y="164" width="114" height="92" rx="5" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.8"/>
      <line x1="546" y1="187" x2="660" y2="187" stroke="#854F0B" stroke-width="0.6"/>
      <line x1="546" y1="210" x2="660" y2="210" stroke="#854F0B" stroke-width="0.6"/>
      <line x1="546" y1="233" x2="660" y2="233" stroke="#854F0B" stroke-width="0.6"/>
      <text x="603" y="180">right</text>
      <text x="603" y="203">……</text>
      <text x="603" y="226" font-weight="600">Rule_func</text>
      <text x="603" y="249">down</text>
    </g>

    <line x1="158" y1="178" x2="214" y2="178" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <line x1="332" y1="176" x2="378" y2="176" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="496" y1="176" x2="542" y2="176" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="660" y1="176" x2="700" y2="176" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>

    <!-- Dim 3 bottom: OptTreeNode -->
    <rect x="196" y="308" width="540" height="92" rx="8" fill="#E8F1FD" fill-opacity="0.55" stroke="#2B6CB0" stroke-width="0.7"/>
    <text x="466" y="390" text-anchor="middle" font-size="13" font-weight="600" fill="#1E4E8C">OptTreeNode（第三维：规则选项链表）</text>

    <g font-size="12" fill="#1E4E8C" text-anchor="middle">
      <rect x="218" y="322" width="114" height="46" rx="5" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="0.8"/>
      <line x1="218" y1="345" x2="332" y2="345" stroke="#2B6CB0" stroke-width="0.6"/>
      <text x="275" y="338">……</text>
      <text x="275" y="361" font-weight="600">Next</text>

      <rect x="382" y="322" width="114" height="46" rx="5" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="0.8"/>
      <line x1="382" y1="345" x2="496" y2="345" stroke="#2B6CB0" stroke-width="0.6"/>
      <text x="439" y="338">……</text>
      <text x="439" y="361" font-weight="600">Next</text>

      <rect x="546" y="322" width="114" height="46" rx="5" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="0.8"/>
      <line x1="546" y1="345" x2="660" y2="345" stroke="#2B6CB0" stroke-width="0.6"/>
      <text x="603" y="338">……</text>
      <text x="603" y="361" font-weight="600">Next</text>
    </g>

    <line x1="275" y1="256" x2="275" y2="318" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <path d="M332 356 H356 V334 H378" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <path d="M496 356 H520 V334 H542" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <path d="M660 356 H684 V334 H706" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>

    <!-- Title (no figure number) -->
    <text x="380" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#0B0B0B">Snort 的三维规则链表结构</text>
  </g>
</svg>
