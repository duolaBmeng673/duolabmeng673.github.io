    <text x="626" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#3C3489">E</text>

    <text x="730" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">双重签名 (DS)</text>
    <rect x="676" y="103" width="108" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="730" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Dual Signature</text>

    <!-- Arrows -->
    <line x1="96" y1="60" x2="126" y2="60" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="174" y1="60" x2="204" y2="60" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <path d="M296 60 H366 V99" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>

    <line x1="96" y1="190" x2="126" y2="190" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="174" y1="190" x2="204" y2="190" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <path d="M296 190 H366 V151" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>

    <line x1="388" y1="125" x2="410" y2="125" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="458" y1="125" x2="480" y2="125" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="572" y1="125" x2="600" y2="125" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="626" y1="60" x2="626" y2="99" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="648" y1="125" x2="672" y2="125" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
