<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 264" width="800" height="264" role="img" aria-label="SET 双重签名生成过程">
  <defs>
    <marker id="m-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Top branch: PI -->
    <text x="58" y="28" text-anchor="middle" font-size="12" font-weight="500" fill="#3E3D3A">支付信息</text>
    <rect x="20" y="38" width="76" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
    <text x="58" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">PI</text>

    <circle cx="152" cy="60" r="22" fill="#F1EFEA" stroke="#898781" stroke-width="0.9"/>
    <text x="152" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#3E3D3A">H</text>

    <text x="252" y="28" text-anchor="middle" font-size="12" font-weight="500" fill="#085041">PI 摘要</text>
    <rect x="208" y="38" width="88" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
    <text x="252" y="65" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">PIMD</text>

    <!-- Bottom branch: OI -->
    <rect x="20" y="168" width="76" height="44" rx="6" fill="#E8F1FD" stroke="#2B6CB0" stroke-width="0.9"/>
    <text x="58" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#1E4E8C">OI</text>
    <text x="58" y="232" text-anchor="middle" font-size="12" font-weight="500" fill="#3E3D3A">订购信息</text>

    <circle cx="152" cy="190" r="22" fill="#F1EFEA" stroke="#898781" stroke-width="0.9"/>
    <text x="152" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#3E3D3A">H</text>

    <rect x="208" y="168" width="88" height="44" rx="6" fill="#E8F1FD" stroke="#2B6CB0" stroke-width="0.9"/>
    <text x="252" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#1E4E8C">OIMD</text>
    <text x="252" y="232" text-anchor="middle" font-size="12" font-weight="500" fill="#1E4E8C">OI 摘要</text>

    <text x="152" y="130" text-anchor="middle" font-size="12" fill="#3E3D3A">散列函数</text>

    <!-- Combine || -> H -> POMD -> E -> DS -->
    <text x="326" y="130" text-anchor="middle" font-size="12" fill="#3E3D3A">连接</text>
    <circle cx="366" cy="125" r="22" fill="#F1EFEA" stroke="#898781" stroke-width="0.9"/>
    <text x="366" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#3E3D3A">‖</text>

    <circle cx="436" cy="125" r="22" fill="#F1EFEA" stroke="#898781" stroke-width="0.9"/>
    <text x="436" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#3E3D3A">H</text>

    <rect x="484" y="103" width="88" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/>
    <text x="528" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">POMD</text>
    <text x="528" y="168" text-anchor="middle" font-size="12" fill="#633806">支付订购</text>
    <text x="528" y="186" text-anchor="middle" font-size="12" fill="#633806">信息摘要</text>

    <rect x="554" y="26" width="144" height="34" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
    <text x="626" y="48" text-anchor="middle" font-size="12" font-weight="600" fill="#791F1F">顾客签名私钥 KR_C</text>

