<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 265" width="720" height="265" role="img">
  <title>SET 双重签名生成过程</title>
  <desc>展示 SET 协议中将支付信息 PI 与订购信息 OI 分别散列得到 PIMD 与 OIMD，连接后再次散列得到 POMD，并用顾客签名私钥 KR_C 加密生成双重签名 DS 的过程。</desc>
  <defs>
    <marker id="ds-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Top branch: PI -->
    <text x="44" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">支付信息</text>
    <rect x="8" y="36" width="72" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="44" y="64" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">PI</text>

    <circle cx="128" cy="58" r="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="128" y="64" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">H</text>

    <text x="216" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">PI 摘要</text>
    <rect x="172" y="36" width="88" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="216" y="64" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">PIMD</text>

    <!-- Bottom branch: OI -->
    <rect x="8" y="182" width="72" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="44" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">OI</text>
    <text x="44" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">订购信息</text>

    <circle cx="128" cy="204" r="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="128" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">H</text>

    <rect x="172" y="182" width="88" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="216" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">OIMD</text>
    <text x="216" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">OI 摘要</text>

    <text x="128" y="136" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">散列函数</text>

    <!-- Combine || -> H -> POMD -> E -> DS -->
    <text x="274" y="136" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">连接</text>
    <circle cx="320" cy="131" r="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="320" y="137" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">‖</text>

    <circle cx="384" cy="131" r="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="384" y="137" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">H</text>

    <rect x="424" y="109" width="84" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="466" y="137" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">POMD</text>
    <text x="466" y="176" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">支付订购</text>
    <text x="466" y="198" text-anchor="middle" font-size="15" font-weight="400" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">信息摘要</text>

    <rect x="456" y="8" width="184" height="42" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="548" y="35" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">顾客签名私钥 KR_C</text>

    <circle cx="548" cy="131" r="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="548" y="137" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">E</text>

    <text x="650" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">双重签名 (DS)</text>
    <rect x="588" y="109" width="124" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="650" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">Dual</text>
    <text x="650" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">Signature</text>

    <g fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ds-arrow)">
      <line x1="80" y1="58" x2="104" y2="58"/>
      <line x1="148" y1="58" x2="168" y2="58"/>
      <path d="M260 58 H320 V107"/>

      <line x1="80" y1="204" x2="104" y2="204"/>
      <line x1="148" y1="204" x2="168" y2="204"/>
      <path d="M260 204 H320 V155"/>

      <line x1="340" y1="131" x2="360" y2="131"/>
      <line x1="404" y1="131" x2="420" y2="131"/>
      <line x1="508" y1="131" x2="524" y2="131"/>
      <line x1="548" y1="50" x2="548" y2="107"/>
      <line x1="568" y1="131" x2="584" y2="131"/>
    </g>
  </g>
</svg>
