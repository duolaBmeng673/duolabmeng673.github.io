<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 562" width="720" height="562" role="img">
  <title>电子信封的使用过程</title>
  <desc>展示发送方用临时对称密钥 Kₛ 加密明文并结合接收方 CA 证书公钥加密 Kₛ 生成电子信封、经网络传输后由接收方先用私钥解出 Kₛ 再解密得到明文的完整过程。</desc>
  <defs>
    <marker id="env-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="8" y="8" width="704" height="234" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" data-role="group"/>
    <text x="24" y="34" font-size="16" font-weight="600" fill="#1e40af">发送方</text>
    <rect x="24" y="50" width="152" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="100" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">接收方 CA 证书</text>
    <line x1="176" y1="72" x2="244" y2="72" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <text x="210" y="59" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">取出</text>
    <rect x="248" y="50" width="84" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="290" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">公钥</text>
    <rect x="92" y="122" width="128" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="156" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">临时密钥 Kₛ</text>
    <line x1="290" y1="94" x2="290" y2="118" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <line x1="220" y1="144" x2="244" y2="144" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="248" y="122" width="84" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="290" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">加密</text>
    <line x1="332" y1="144" x2="388" y2="144" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="392" y="114" width="152" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="468" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">电子信封</text>
    <text x="468" y="162" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">被加密的 Kₛ</text>
    <rect x="24" y="186" width="72" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="60" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">明文</text>
    <line x1="96" y1="208" x2="116" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <line x1="156" y1="166" x2="156" y2="182" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="120" y="186" width="72" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="156" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">加密</text>
    <line x1="192" y1="208" x2="244" y2="208" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="248" y="186" width="84" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="290" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">密文</text>
    <line x1="332" y1="208" x2="588" y2="208" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <path d="M544 144 H628 V182" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="592" y="186" width="72" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="628" y="214" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">‖</text>
    <path d="M628 230 V254 H360 V270" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="148" y="274" width="424" height="76" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" data-role="group"/>
    <text x="164" y="318" font-size="15" font-weight="600" fill="#4b5563">传输数据包</text>
    <rect x="268" y="290" width="144" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="340" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">被加密的 Kₛ</text>
    <rect x="424" y="290" width="128" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="488" y="318" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">密文</text>
    <rect x="8" y="390" width="704" height="164" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5" data-role="group"/>
    <text x="24" y="416" font-size="16" font-weight="600" fill="#115e59">接收方</text>
    <rect x="24" y="430" width="136" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="92" y="458" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">被加密的 Kₛ</text>
    <path d="M340 334 V370 H92 V426" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="192" y="430" width="80" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="232" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">私钥</text>
    <line x1="160" y1="452" x2="188" y2="452" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <line x1="272" y1="452" x2="300" y2="452" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="304" y="430" width="80" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="344" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">解密</text>
    <line x1="384" y1="452" x2="412" y2="452" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="416" y="430" width="72" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="452" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">Kₛ</text>
    <rect x="256" y="494" width="84" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="298" y="522" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">密文</text>
    <path d="M488 334 V370 H580 V484 H298 V490" fill="none" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <line x1="340" y1="516" x2="412" y2="516" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <line x1="452" y1="474" x2="452" y2="490" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="416" y="494" width="72" height="44" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="452" y="522" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">解密</text>
    <line x1="488" y1="516" x2="540" y2="516" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#env-arrow)"/>
    <rect x="544" y="494" width="80" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="584" y="522" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">明文</text>
  </g>
</svg>
