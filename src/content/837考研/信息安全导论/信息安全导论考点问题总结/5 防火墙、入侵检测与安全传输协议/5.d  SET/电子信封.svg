<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" role="img" aria-label="电子信封的使用过程">
  <defs>
    <marker id="m-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Sender side -->
    <rect x="24" y="20" width="114" height="38" rx="6" fill="#F1EFEA" stroke="#898781" stroke-width="0.9"/>
    <text x="81" y="43" text-anchor="middle" font-size="12" font-weight="500" fill="#3E3D3A">接收方 CA 证书</text>

    <line x1="138" y1="39" x2="212" y2="39" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <rect x="156" y="28" width="38" height="20" rx="3" fill="#FFFFFF"/>
    <text x="175" y="43" text-anchor="middle" font-size="12" fill="#3E3D3A">取出</text>

    <rect x="216" y="20" width="60" height="36" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/>
    <text x="246" y="43" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">公钥</text>

    <!-- Sender badge -->
    <rect x="20" y="96" width="66" height="36" rx="18" fill="#E8F1FD" stroke="#2B6CB0" stroke-width="0.9"/>
    <text x="53" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#1E4E8C">发送方</text>

    <!-- Temp key Ks -->
    <rect x="100" y="118" width="90" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/>
    <text x="145" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">临时密钥 Kₛ</text>

    <!-- Top encrypt circle -->
    <circle cx="246" cy="135" r="24" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="246" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">加密</text>

    <text x="352" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">电子信封</text>
    <rect x="308" y="110" width="88" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="352" y="131" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">被加密的</text>
    <text x="352" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Kₛ</text>

    <!-- Plaintext -> Encrypt -> Ciphertext -> || -->
    <rect x="20" y="216" width="68" height="44" rx="6" fill="#F1EFEA" stroke="#898781" stroke-width="0.9"/>
    <text x="54" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#3E3D3A">明文</text>

    <circle cx="145" cy="238" r="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="145" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">加密</text>

    <rect x="204" y="214" width="84" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
    <text x="246" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">密文</text>

    <circle cx="352" cy="238" r="22" fill="#F1EFEA" stroke="#898781" stroke-width="0.9"/>
    <text x="352" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#3E3D3A">‖</text>

    <!-- Sender arrows -->
    <line x1="246" y1="56" x2="246" y2="107" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="190" y1="135" x2="218" y2="135" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="145" y1="152" x2="145" y2="210" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="270" y1="135" x2="304" y2="135" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="88" y1="238" x2="117" y2="238" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="169" y1="238" x2="200" y2="238" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="288" y1="238" x2="326" y2="238" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="352" y1="158" x2="352" y2="212" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>

    <!-- Transmitted packet dashed box -->
    <rect x="430" y="92" width="112" height="190" rx="8" fill="#F8F7F4" fill-opacity="0.7" stroke="#898781" stroke-width="1.1" stroke-dasharray="6,4"/>
    <rect x="442" y="110" width="88" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/>
    <text x="486" y="131" text-anchor="middle" font-size="12" font-weight="600" fill="#3C3489">被加密的</text>
    <text x="486" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Kₛ</text>

    <rect x="442" y="214" width="88" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
    <text x="486" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">密文</text>

    <path d="M374 238 H402 V188 H426" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>

    <!-- Receiver side -->
    <rect x="574" y="20" width="60" height="36" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.9"/>
    <text x="604" y="43" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">私钥</text>

    <circle cx="604" cy="135" r="24" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="604" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">解密</text>

    <rect x="658" y="118" width="54" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.9"/>
    <text x="685" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Kₛ</text>

    <rect x="734" y="96" width="66" height="36" rx="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
    <text x="767" y="119" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">接收方</text>

    <circle cx="685" cy="238" r="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="685" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">解密</text>

    <rect x="734" y="216" width="68" height="44" rx="6" fill="#F1EFEA" stroke="#898781" stroke-width="0.9"/>
    <text x="768" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#3E3D3A">明文</text>

    <!-- Receiver arrows -->
    <line x1="604" y1="56" x2="604" y2="107" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="530" y1="135" x2="576" y2="135" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="628" y1="135" x2="654" y2="135" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="685" y1="152" x2="685" y2="210" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="530" y1="238" x2="657" y2="238" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>
    <line x1="709" y1="238" x2="730" y2="238" stroke="#898781" stroke-width="1.4" marker-end="url(#m-arr)"/>

    <text x="410" y="328" text-anchor="middle" font-size="14" font-weight="600" fill="#0B0B0B">电子信封的使用过程</text>
  </g>
</svg>
