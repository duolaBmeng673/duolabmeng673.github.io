<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278" role="img">
  <title>SSL/TLS 协议分层位置</title>
  <desc>展示 SSL / TLS 安全协议层位于应用层 HTTP 与传输层 TCP 之间，下方为网络层 IP 协议。</desc>
  <defs>
    <marker id="ssl-layer-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <rect x="34" y="8" width="678" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="174" y="41" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">HTTP（应用层）</text>
    <line x1="312" y1="18" x2="312" y2="52" stroke="#94a3b8" stroke-width="1"/>
    <text x="332" y="41" font-size="15" font-weight="400" fill="#4b5563">负责定义 HTTP 请求和响应</text>

    <rect x="34" y="76" width="678" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="174" y="111" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">SSL / TLS（安全协议层）</text>
    <line x1="312" y1="86" x2="312" y2="124" stroke="#3b82f6" stroke-width="1"/>
    <text x="332" y="111" font-size="15" font-weight="600" fill="#1e40af">加密、完整性保护、身份认证等</text>

    <rect x="34" y="148" width="678" height="54" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="174" y="181" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">TCP（传输层）</text>
    <line x1="312" y1="158" x2="312" y2="192" stroke="#14b8a6" stroke-width="1"/>
    <text x="332" y="181" font-size="15" font-weight="400" fill="#115e59">负责可靠传输数据</text>

    <rect x="34" y="216" width="678" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="174" y="249" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">IP（网络层）</text>
    <line x1="312" y1="226" x2="312" y2="260" stroke="#94a3b8" stroke-width="1"/>
    <text x="332" y="249" font-size="15" font-weight="400" fill="#4b5563">负责寻址和路由</text>

    <line x1="8" y1="35" x2="8" y2="171" stroke="#3b82f6" stroke-width="2" marker-end="url(#ssl-layer-arrow)"/>
  </g>
</svg>
