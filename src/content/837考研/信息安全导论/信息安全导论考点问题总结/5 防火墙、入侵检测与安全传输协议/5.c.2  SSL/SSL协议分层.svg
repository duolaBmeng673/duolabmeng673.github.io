<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" role="img" aria-label="SSL/TLS 协议分层位置">
  <defs>
    <marker id="m-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#0B0B0B">SSL / TLS 协议分层位置</text>

    <!-- Layer 1: HTTP -->
    <rect x="44" y="44" width="552" height="46" rx="8" fill="#F1EFEA" stroke="#898781" stroke-width="0.8"/>
    <text x="170" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#3E3D3A">HTTP（应用层）</text>
    <line x1="306" y1="53" x2="306" y2="81" stroke="#898781" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="330" y="72" font-size="13" fill="#3E3D3A">负责定义 HTTP 请求和响应</text>

    <!-- Layer 2: SSL/TLS (Highlighted) -->
    <rect x="44" y="100" width="552" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
    <text x="170" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#3C3489">SSL / TLS（安全协议层）</text>
    <line x1="306" y1="110" x2="306" y2="140" stroke="#534AB7" stroke-width="0.7" stroke-opacity="0.5"/>
    <text x="330" y="130" font-size="13" font-weight="600" fill="#3C3489">加密、完整性保护、身份认证等</text>

    <!-- Layer 3: TCP -->
    <rect x="44" y="160" width="552" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="170" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">TCP（传输层）</text>
    <line x1="306" y1="169" x2="306" y2="197" stroke="#0F6E56" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="330" y="188" font-size="13" fill="#085041">负责可靠传输数据</text>

    <!-- Layer 4: IP -->
    <rect x="44" y="216" width="552" height="46" rx="8" fill="#F1EFEA" stroke="#898781" stroke-width="0.8"/>
    <text x="170" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#3E3D3A">IP（网络层）</text>
    <line x1="306" y1="225" x2="306" y2="253" stroke="#898781" stroke-width="0.6" stroke-opacity="0.5"/>
    <text x="330" y="244" font-size="13" fill="#3E3D3A">负责寻址和路由</text>

    <!-- Arrows between HTTP -> SSL/TLS -> TCP -->
    <line x1="20" y1="67" x2="20" y2="183" stroke="#534AB7" stroke-width="1.5" marker-end="url(#m-arr)"/>
  </g>
</svg>
