<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -15 774 561" width="774" height="561" role="img" aria-label="SSL 握手协议流程">
  <defs>
    <marker id="m-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3E3D3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m-opt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#0B0B0B">SSL 握手协议流程</text>

    <!-- Phase Bands -->
    <rect x="64" y="88" width="676" height="82" rx="8" fill="#EEEDFE" fill-opacity="0.45" stroke="#534AB7" stroke-width="0.6"/>
    <text x="630" y="122" font-size="12" font-weight="600" fill="#3C3489">阶段 1：</text>
    <text x="630" y="140" font-size="12" font-weight="600" fill="#3C3489">建立安全能力</text>

    <rect x="64" y="178" width="676" height="124" rx="8" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-width="0.6"/>
    <text x="630" y="224" font-size="12" font-weight="600" fill="#085041">阶段 2：</text>
    <text x="630" y="242" font-size="12" font-weight="600" fill="#085041">服务器认证</text>
    <text x="630" y="260" font-size="12" font-weight="600" fill="#085041">与密钥交换</text>

    <rect x="64" y="310" width="676" height="98" rx="8" fill="#FAEEDA" fill-opacity="0.45" stroke="#854F0B" stroke-width="0.6"/>
    <text x="630" y="344" font-size="12" font-weight="600" fill="#633806">阶段 3：</text>
    <text x="630" y="362" font-size="12" font-weight="600" fill="#633806">客户端认证</text>
    <text x="630" y="380" font-size="12" font-weight="600" fill="#633806">与密钥交换</text>

    <rect x="64" y="416" width="676" height="106" rx="8" fill="#E8F1FD" fill-opacity="0.55" stroke="#2B6CB0" stroke-width="0.6"/>
    <text x="630" y="462" font-size="12" font-weight="600" fill="#1E4E8C">阶段 4：</text>
    <text x="630" y="480" font-size="12" font-weight="600" fill="#1E4E8C">结束</text>

    <!-- Time arrow -->
    <line x1="34" y1="96" x2="34" y2="510" stroke="#3E3D3A" stroke-width="1.4" marker-end="url(#m-solid)"/>
    <rect x="14" y="286" width="40" height="28" rx="4" fill="#FFFFFF"/>
    <text x="34" y="305" text-anchor="middle" font-size="12" font-weight="500" fill="#3E3D3A">时间</text>

    <!-- Lifelines & Participants -->
    <line x1="160" y1="80" x2="160" y2="522" stroke="#898781" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="600" y1="80" x2="600" y2="522" stroke="#898781" stroke-width="1.2" stroke-dasharray="4,3"/>

    <rect x="104" y="44" width="112" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
    <text x="160" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">客户端</text>
    <rect x="544" y="44" width="112" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="600" y="67" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">服务器</text>

    <!-- Phase 1 -->
    <line x1="164" y1="116" x2="592" y2="116" stroke="#3E3D3A" stroke-width="1.4" marker-end="url(#m-solid)"/>
    <rect x="315" y="102" width="130" height="20" rx="4" fill="#F8F7FE"/>
    <text x="380" y="117" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">client_hello</text>

    <line x1="596" y1="150" x2="168" y2="150" stroke="#3E3D3A" stroke-width="1.4" marker-end="url(#m-solid)"/>
    <rect x="315" y="136" width="130" height="20" rx="4" fill="#F8F7FE"/>
    <text x="380" y="151" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">server_hello</text>

    <!-- Phase 2 -->
    <line x1="596" y1="200" x2="168" y2="200" stroke="#534AB7" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#m-opt)"/>
    <rect x="320" y="186" width="120" height="20" rx="4" fill="#F2FBF8"/>
    <text x="380" y="201" text-anchor="middle" font-size="13" fill="#534AB7">certificate</text>

    <line x1="596" y1="228" x2="168" y2="228" stroke="#534AB7" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#m-opt)"/>
    <rect x="290" y="214" width="180" height="20" rx="4" fill="#F2FBF8"/>
    <text x="380" y="229" text-anchor="middle" font-size="13" fill="#534AB7">server_key_exchange</text>

    <line x1="596" y1="256" x2="168" y2="256" stroke="#534AB7" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#m-opt)"/>
    <rect x="295" y="242" width="170" height="20" rx="4" fill="#F2FBF8"/>
    <text x="380" y="257" text-anchor="middle" font-size="13" fill="#534AB7">certificate_request</text>

    <line x1="596" y1="284" x2="168" y2="284" stroke="#3E3D3A" stroke-width="1.4" marker-end="url(#m-solid)"/>
    <rect x="300" y="270" width="160" height="20" rx="4" fill="#F2FBF8"/>
    <text x="380" y="285" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">server_hello_done</text>

    <!-- Phase 3 -->
    <line x1="164" y1="332" x2="592" y2="332" stroke="#534AB7" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#m-opt)"/>
    <rect x="320" y="318" width="120" height="20" rx="4" fill="#FDF7EE"/>
    <text x="380" y="333" text-anchor="middle" font-size="13" fill="#534AB7">certificate</text>

    <line x1="164" y1="360" x2="592" y2="360" stroke="#3E3D3A" stroke-width="1.4" marker-end="url(#m-solid)"/>
    <rect x="290" y="346" width="180" height="20" rx="4" fill="#FDF7EE"/>
    <text x="380" y="361" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">client_key_exchange</text>

    <line x1="164" y1="388" x2="592" y2="388" stroke="#534AB7" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#m-opt)"/>
    <rect x="305" y="374" width="150" height="20" rx="4" fill="#FDF7EE"/>
    <text x="380" y="389" text-anchor="middle" font-size="13" fill="#534AB7">certificate_verify</text>

    <!-- Phase 4 -->
    <line x1="164" y1="436" x2="592" y2="436" stroke="#3E3D3A" stroke-width="1.4" marker-end="url(#m-solid)"/>
    <rect x="300" y="422" width="160" height="20" rx="4" fill="#F2F7FE"/>
    <text x="380" y="437" text-anchor="middle" font-size="13" font-weight="500" fill="#1E4E8C">change_cipher_spec</text>

    <line x1="164" y1="460" x2="592" y2="460" stroke="#3E3D3A" stroke-width="1.4" marker-end="url(#m-solid)"/>
    <rect x="336" y="446" width="88" height="20" rx="4" fill="#F2F7FE"/>
    <text x="380" y="461" text-anchor="middle" font-size="13" font-weight="500" fill="#1E4E8C">finished</text>

    <line x1="596" y1="486" x2="168" y2="486" stroke="#3E3D3A" stroke-width="1.4" marker-end="url(#m-solid)"/>
    <rect x="300" y="472" width="160" height="20" rx="4" fill="#F2F7FE"/>
    <text x="380" y="487" text-anchor="middle" font-size="13" font-weight="500" fill="#1E4E8C">change_cipher_spec</text>

    <line x1="596" y1="510" x2="168" y2="510" stroke="#3E3D3A" stroke-width="1.4" marker-end="url(#m-solid)"/>
    <rect x="336" y="496" width="88" height="20" rx="4" fill="#F2F7FE"/>
    <text x="380" y="511" text-anchor="middle" font-size="13" font-weight="500" fill="#1E4E8C">finished</text>
  </g>
</svg>
