<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780" role="img">
  <title>SSL 握手协议流程</title>
  <desc>展示 SSL 握手协议的四个阶段共 13 条消息：建立安全能力、服务器认证与密钥交换、客户端认证与密钥交换以及切换密码规范与结束确认。</desc>
  <defs>
    <marker id="ssl-hs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Time arrow -->
    <line x1="48" y1="74" x2="48" y2="758" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ssl-hs-arrow)"/>
    <text x="8" y="408" text-anchor="start" font-size="15" font-weight="600" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">时</text>
    <text x="8" y="432" text-anchor="start" font-size="15" font-weight="600" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="2" stroke-linejoin="round">间</text>

    <!-- Participants -->
    <rect x="92" y="8" width="112" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="148" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">客户端</text>

    <rect x="432" y="8" width="112" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="488" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">服务器</text>

    <!-- Phase Bands (x=64..712, w=648) -->
    <rect x="64" y="64" width="648" height="114" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" data-role="group"/>
    <text x="548" y="114" font-size="15" font-weight="600" fill="#1e40af">阶段 1：</text>
    <text x="548" y="138" font-size="15" font-weight="600" fill="#1e40af">建立安全能力</text>

    <rect x="64" y="190" width="648" height="214" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1" data-role="group"/>
    <text x="548" y="274" font-size="15" font-weight="600" fill="#115e59">阶段 2：</text>
    <text x="548" y="298" font-size="15" font-weight="600" fill="#115e59">服务器认证</text>
    <text x="548" y="322" font-size="15" font-weight="600" fill="#115e59">与密钥交换</text>

    <rect x="64" y="416" width="648" height="164" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" data-role="group"/>
    <text x="548" y="476" font-size="15" font-weight="600" fill="#92400e">阶段 3：</text>
    <text x="548" y="500" font-size="15" font-weight="600" fill="#92400e">客户端认证</text>
    <text x="548" y="524" font-size="15" font-weight="600" fill="#92400e">与密钥交换</text>

    <rect x="64" y="592" width="648" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" data-role="group"/>
    <text x="548" y="676" font-size="15" font-weight="600" fill="#1f2937">阶段 4：结束</text>

    <line x1="148" y1="50" x2="148" y2="764" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="488" y1="50" x2="488" y2="764" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Phase 1 arrows -->
    <line x1="148" y1="106" x2="484" y2="106" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">client_hello</text>

    <line x1="488" y1="156" x2="152" y2="156" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">server_hello</text>

    <!-- Phase 2 arrows -->
    <line x1="488" y1="232" x2="152" y2="232" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="220" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">certificate</text>

    <line x1="488" y1="282" x2="152" y2="282" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="270" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">server_key_exchange</text>

    <line x1="488" y1="332" x2="152" y2="332" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="320" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">certificate_request</text>

    <line x1="488" y1="382" x2="152" y2="382" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="370" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">server_hello_done</text>

    <!-- Phase 3 arrows -->
    <line x1="148" y1="458" x2="484" y2="458" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="446" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">certificate</text>

    <line x1="148" y1="508" x2="484" y2="508" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="496" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">client_key_exchange</text>

    <line x1="148" y1="558" x2="484" y2="558" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="546" text-anchor="middle" font-size="15" font-weight="400" fill="#1e40af">certificate_verify</text>

    <!-- Phase 4 arrows (re-spaced cleanly inside 592..772) -->
    <line x1="148" y1="628" x2="484" y2="628" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="616" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">change_cipher_spec</text>

    <line x1="148" y1="670" x2="484" y2="670" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="658" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">finished</text>

    <line x1="488" y1="712" x2="152" y2="712" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="700" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">change_cipher_spec</text>

    <line x1="488" y1="754" x2="152" y2="754" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ssl-hs-arrow)"/>
    <text x="318" y="742" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">finished</text>
  </g>
</svg>
