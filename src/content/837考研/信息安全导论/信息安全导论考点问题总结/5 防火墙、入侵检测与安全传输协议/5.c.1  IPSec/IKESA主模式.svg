<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456" role="img">
  <title>IKE SA 主模式协商过程</title>
  <desc>展示 IKE SA 主模式的六个报文三阶段交互流程：a. 策略协商（1~2）、b. 密钥交换（3~4）、c. 认证交换（5~6）。</desc>
  <defs>
    <marker id="ike-main-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Participants -->
    <rect x="116" y="8" width="128" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="180" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#1e40af">发起方</text>

    <rect x="476" y="8" width="128" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="540" y="35" text-anchor="middle" font-size="16" font-weight="600" fill="#115e59">响应方</text>

    <!-- Phase Bands -->
    <rect x="8" y="66" width="704" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" data-role="group"/>
    <text x="24" y="92" font-size="15" font-weight="600" fill="#1e40af">a. 策略协商</text>

    <rect x="8" y="198" width="704" height="120" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1" data-role="group"/>
    <text x="24" y="224" font-size="15" font-weight="600" fill="#115e59">b. 密钥交换</text>

    <rect x="8" y="330" width="704" height="118" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" data-role="group"/>
    <text x="24" y="356" font-size="15" font-weight="600" fill="#92400e">c. 认证交换</text>

    <line x1="180" y1="50" x2="180" y2="440" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="540" y1="50" x2="540" y2="440" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>

    <!-- Messages (arrows separated by 52px inside each band) -->
    <line x1="180" y1="118" x2="536" y2="118" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ike-main-arrow)"/>
    <text x="360" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">1. 安全参数的提议值列表</text>

    <line x1="540" y1="168" x2="184" y2="168" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ike-main-arrow)"/>
    <text x="360" y="156" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">2. 可接受安全参数的选择</text>

    <line x1="180" y1="250" x2="536" y2="250" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#ike-main-arrow)"/>
    <text x="360" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">3. DH 公开值、nonceᵢ</text>

    <line x1="540" y1="300" x2="184" y2="300" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#ike-main-arrow)"/>
    <text x="360" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">4. DH 公开值、nonceᵣ</text>

    <line x1="180" y1="382" x2="536" y2="382" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ike-main-arrow)"/>
    <text x="360" y="370" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">5. 认证者</text>

    <line x1="540" y1="430" x2="184" y2="430" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ike-main-arrow)"/>
    <text x="360" y="418" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">6. 认证者</text>
  </g>
</svg>
