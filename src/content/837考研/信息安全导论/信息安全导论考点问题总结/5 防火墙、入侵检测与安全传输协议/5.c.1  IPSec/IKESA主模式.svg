<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="IKE SA 主模式协商过程">
  <defs>
    <marker id="m-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#0B0B0B">主模式协商过程</text>

    <!-- Phase Bands -->
    <rect x="20" y="96" width="720" height="96" rx="8" fill="#EEEDFE" fill-opacity="0.45" stroke="#534AB7" stroke-width="0.6"/>
    <text x="36" y="116" font-size="12" font-weight="600" fill="#3C3489">a. 策略协商</text>

    <rect x="20" y="204" width="720" height="96" rx="8" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-width="0.6"/>
    <text x="36" y="224" font-size="12" font-weight="600" fill="#085041">b. 密钥交换</text>

    <rect x="20" y="312" width="720" height="96" rx="8" fill="#FAEEDA" fill-opacity="0.45" stroke="#854F0B" stroke-width="0.6"/>
    <text x="36" y="332" font-size="12" font-weight="600" fill="#633806">c. 认证交换</text>

    <!-- Lifelines -->
    <line x1="160" y1="84" x2="160" y2="408" stroke="#898781" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="600" y1="84" x2="600" y2="408" stroke="#898781" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- Participants -->
    <rect x="100" y="46" width="120" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
    <text x="160" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">发起方</text>
    <rect x="540" y="46" width="120" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
    <text x="600" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">响应方</text>

    <!-- 1 & 2 -->
    <line x1="164" y1="134" x2="592" y2="134" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <rect x="275" y="121" width="210" height="22" rx="4" fill="#F8F7FE"/>
    <text x="380" y="137" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">1. 安全参数的提议值列表</text>

    <line x1="596" y1="172" x2="168" y2="172" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <rect x="275" y="159" width="210" height="22" rx="4" fill="#F8F7FE"/>
    <text x="380" y="175" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">2. 可接受安全参数的选择</text>

    <!-- 3 & 4 -->
    <line x1="164" y1="242" x2="592" y2="242" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <rect x="290" y="229" width="180" height="22" rx="4" fill="#F2FBF8"/>
    <text x="380" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">3. DH 公开值、nonceᵢ</text>

    <line x1="596" y1="280" x2="168" y2="280" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <rect x="290" y="267" width="180" height="22" rx="4" fill="#F2FBF8"/>
    <text x="380" y="283" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">4. DH 公开值、nonceᵣ</text>

    <!-- 5 & 6 -->
    <line x1="164" y1="350" x2="592" y2="350" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <rect x="330" y="337" width="100" height="22" rx="4" fill="#FDF7EE"/>
    <text x="380" y="353" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">5. 认证者</text>

    <line x1="596" y1="388" x2="168" y2="388" stroke="#898781" stroke-width="1.5" marker-end="url(#m-arr)"/>
    <rect x="330" y="375" width="100" height="22" rx="4" fill="#FDF7EE"/>
    <text x="380" y="391" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">6. 认证者</text>
  </g>
</svg>
