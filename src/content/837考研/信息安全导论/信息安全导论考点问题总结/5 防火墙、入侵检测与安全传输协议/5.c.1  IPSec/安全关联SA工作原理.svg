<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img">
  <title>安全关联 SA 的工作原理</title>
  <desc>展示 IPSec 接收方向与发送方向的数据包处理流程，以及 SAD 与 SPD 之间的双向指针联动机制。</desc>
  <defs>
    <marker id="ipsec-sa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <!-- Top Flow Labels -->
    <text x="232" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">交上层处理</text>
    <text x="488" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">发送</text>

    <!-- Processing Boxes Row 1 -->
    <rect x="184" y="64" width="96" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="232" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">SP 处理</text>
    <line x1="232" y1="64" x2="232" y2="34" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <rect x="440" y="64" width="96" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="488" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">SA 处理</text>
    <line x1="488" y1="64" x2="488" y2="34" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <!-- Processing Boxes Row 2 + Packet Pills -->
    <rect x="8" y="136" width="144" height="40" rx="20" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="80" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">IP数据包(接收)</text>
    <line x1="152" y1="156" x2="180" y2="156" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <rect x="184" y="136" width="96" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="232" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">SA 处理</text>
    <line x1="232" y1="136" x2="232" y2="108" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <rect x="440" y="136" width="96" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="488" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">SP 处理</text>
    <line x1="488" y1="136" x2="488" y2="108" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <rect x="568" y="136" width="144" height="40" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="640" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">IP数据包(发送)</text>
    <line x1="568" y1="156" x2="540" y2="156" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <!-- Lookup Paths (唯一标识 & 选择器) -->
    <line x1="40" y1="176" x2="40" y2="216" stroke="#14b8a6" stroke-width="1.5"/>
    <polygon points="28,216 52,216 40,236" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="232" font-size="15" font-weight="400" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">唯一标识</text>
    <path d="M40 236 V348 H108" fill="none" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <line x1="680" y1="176" x2="680" y2="216" stroke="#3b82f6" stroke-width="1.5"/>
    <polygon points="668,216 692,216 680,236" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="660" y="232" text-anchor="end" font-size="15" font-weight="400" fill="#92400e" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">选择器</text>
    <path d="M680 236 V348 H612" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <!-- Vertical DB to Processing Links -->
    <line x1="232" y1="276" x2="232" y2="180" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>
    <line x1="488" y1="276" x2="488" y2="180" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <!-- Cross Pointers between SAD/SPD and Top Processing -->
    <path d="M292 276 V232 H384 V84 H436" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>
    <path d="M428 276 V252 H336 V84 H284" fill="none" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#ipsec-sa-arrow)"/>

    <!-- SAD Table -->
    <rect x="112" y="276" width="204" height="148" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="140" y1="276" x2="140" y2="424" stroke="#94a3b8" stroke-width="1"/>
    <line x1="140" y1="312" x2="316" y2="312" stroke="#94a3b8" stroke-width="1"/>
    <line x1="140" y1="348" x2="316" y2="348" stroke="#94a3b8" stroke-width="1"/>
    <line x1="140" y1="384" x2="316" y2="384" stroke="#94a3b8" stroke-width="1"/>
    <text x="228" y="300" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">#0 SA</text>
    <text x="228" y="336" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">#1 SA</text>
    <text x="228" y="372" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">#2 SA</text>
    <text x="228" y="408" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">…</text>

    <!-- SPD Table -->
    <rect x="404" y="276" width="204" height="148" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="432" y1="276" x2="432" y2="424" stroke="#94a3b8" stroke-width="1"/>
    <line x1="432" y1="312" x2="608" y2="312" stroke="#94a3b8" stroke-width="1"/>
    <line x1="432" y1="348" x2="608" y2="348" stroke="#94a3b8" stroke-width="1"/>
    <line x1="432" y1="384" x2="608" y2="384" stroke="#94a3b8" stroke-width="1"/>
    <text x="520" y="300" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">#0 SP</text>
    <text x="520" y="336" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">#1 SP</text>
    <text x="520" y="372" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">#2 SP</text>
    <text x="520" y="408" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">…</text>

    <!-- Bidirectional Pointers -->
    <line x1="320" y1="294" x2="400" y2="294" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#ipsec-sa-arrow)" marker-end="url(#ipsec-sa-arrow)"/>
    <line x1="320" y1="330" x2="400" y2="330" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#ipsec-sa-arrow)" marker-end="url(#ipsec-sa-arrow)"/>
    <line x1="320" y1="366" x2="400" y2="366" stroke="#94a3b8" stroke-width="1.5" marker-start="url(#ipsec-sa-arrow)" marker-end="url(#ipsec-sa-arrow)"/>
    <text x="360" y="408" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">双向指针</text>

    <!-- Database Captions -->
    <text x="214" y="448" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">安全关联数据库 SAD</text>
    <text x="506" y="448" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">安全策略数据库 SPD</text>
  </g>
</svg>
