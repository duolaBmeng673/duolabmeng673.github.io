    <rect x="8" y="478" width="100" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="58" y="503" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">新 IPv6</text>
    <text x="58" y="524" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">头</text>
    <rect x="112" y="478" width="88" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
