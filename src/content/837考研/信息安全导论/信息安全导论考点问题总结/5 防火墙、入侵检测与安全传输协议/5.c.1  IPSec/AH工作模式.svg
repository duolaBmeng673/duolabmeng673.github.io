    <text x="360" y="524" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">IPv6 头</text>
    <rect x="420" y="478" width="88" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="464" y="505" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">扩展头</text>
    <rect x="512" y="478" width="200" height="62" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="612" y="505" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">数据</text>
