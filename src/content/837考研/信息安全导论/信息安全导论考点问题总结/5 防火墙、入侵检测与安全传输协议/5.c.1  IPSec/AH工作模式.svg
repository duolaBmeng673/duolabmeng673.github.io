<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -13 848 417" width="848" height="417" role="img" aria-label="AH 工作模式：传输模式与隧道模式数据包结构及认证范围">
  <defs>
    <marker id="ah-l" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M8 1L2 5L8 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="420" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#0B0B0B">AH 工作模式（传输模式 vs 隧道模式）</text>

    <!-- Row 1: IPv4 传输模式 -->
    <text x="20" y="96" font-size="13" font-weight="500" fill="#444441">IPv4 传输模式</text>
    <line x1="142" y1="54" x2="142" y2="70" stroke="#898781" stroke-width="1.2"/>
    <line x1="478" y1="54" x2="478" y2="70" stroke="#898781" stroke-width="1.2"/>
    <line x1="148" y1="62" x2="472" y2="62" stroke="#534AB7" stroke-width="1.3" marker-start="url(#ah-l)" marker-end="url(#ah-r)"/>
    <rect x="245" y="51" width="130" height="20" rx="4" fill="#FFFFFF"/>
    <text x="310" y="65" text-anchor="middle" font-size="11.5" font-weight="500" fill="#534AB7">除可变域外的认证</text>
    <g text-anchor="middle" font-size="12.5" font-weight="500">
      <rect x="142" y="74" width="104" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
      <text x="194" y="97" fill="#444441">IPv4 头</text>
      <rect x="250" y="74" width="84" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
      <text x="292" y="97" fill="#3C3489">AH 头</text>
      <rect x="338" y="74" width="140" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
      <text x="408" y="97" fill="#085041">数据</text>
    </g>

    <!-- Row 2: IPv4 隧道模式 -->
    <text x="20" y="186" font-size="13" font-weight="500" fill="#444441">IPv4 隧道模式</text>
    <line x1="142" y1="144" x2="142" y2="160" stroke="#898781" stroke-width="1.2"/>
    <line x1="592" y1="144" x2="592" y2="160" stroke="#898781" stroke-width="1.2"/>
    <line x1="148" y1="152" x2="586" y2="152" stroke="#534AB7" stroke-width="1.3" marker-start="url(#ah-l)" marker-end="url(#ah-r)"/>
    <rect x="287" y="141" width="160" height="20" rx="4" fill="#FFFFFF"/>
    <text x="367" y="155" text-anchor="middle" font-size="11.5" font-weight="500" fill="#534AB7">除新包头可变域外的认证</text>
    <g text-anchor="middle" font-size="12.5" font-weight="500">
      <rect x="142" y="164" width="108" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="196" y="187" fill="#633806">新 IPv4 头</text>
      <rect x="254" y="164" width="80" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
      <text x="294" y="187" fill="#3C3489">AH 头</text>
      <rect x="338" y="164" width="114" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
      <text x="395" y="187" fill="#444441">原始 IPv4 头</text>
      <rect x="456" y="164" width="136" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
      <text x="524" y="187" fill="#085041">数据</text>
    </g>

    <!-- Row 3: IPv6 传输模式 -->
    <text x="20" y="276" font-size="13" font-weight="500" fill="#444441">IPv6 传输模式</text>
    <line x1="142" y1="234" x2="142" y2="250" stroke="#898781" stroke-width="1.2"/>
    <line x1="592" y1="234" x2="592" y2="250" stroke="#898781" stroke-width="1.2"/>
    <line x1="148" y1="242" x2="586" y2="242" stroke="#534AB7" stroke-width="1.3" marker-start="url(#ah-l)" marker-end="url(#ah-r)"/>
    <rect x="302" y="231" width="130" height="20" rx="4" fill="#FFFFFF"/>
    <text x="367" y="245" text-anchor="middle" font-size="11.5" font-weight="500" fill="#534AB7">除可变域外的认证</text>
    <g text-anchor="middle" font-size="12.5" font-weight="500">
      <rect x="142" y="254" width="104" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
      <text x="194" y="277" fill="#444441">IPv6 头</text>
      <rect x="250" y="254" width="96" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
      <text x="298" y="277" fill="#444441">扩展头</text>
      <rect x="350" y="254" width="84" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
      <text x="392" y="277" fill="#3C3489">AH 头</text>
      <rect x="438" y="254" width="154" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
      <text x="515" y="277" fill="#085041">数据</text>
    </g>

    <!-- Row 4: IPv6 隧道模式 -->
    <text x="20" y="366" font-size="13" font-weight="500" fill="#444441">IPv6 隧道模式</text>
    <line x1="142" y1="324" x2="142" y2="340" stroke="#898781" stroke-width="1.2"/>
    <line x1="820" y1="324" x2="820" y2="340" stroke="#898781" stroke-width="1.2"/>
    <line x1="148" y1="332" x2="814" y2="332" stroke="#534AB7" stroke-width="1.3" marker-start="url(#ah-l)" marker-end="url(#ah-r)"/>
    <rect x="401" y="321" width="160" height="20" rx="4" fill="#FFFFFF"/>
    <text x="481" y="335" text-anchor="middle" font-size="11.5" font-weight="500" fill="#534AB7">除新包头可变域外的认证</text>
    <g text-anchor="middle" font-size="12.5" font-weight="500">
      <rect x="142" y="344" width="102" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="193" y="367" fill="#633806">新 IPv6 头</text>
      <rect x="248" y="344" width="80" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
      <text x="288" y="367" fill="#633806">扩展头</text>
      <rect x="332" y="344" width="76" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
      <text x="370" y="367" fill="#3C3489">AH 头</text>
      <rect x="412" y="344" width="108" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
      <text x="466" y="367" fill="#444441">原始 IPv6 头</text>
      <rect x="524" y="344" width="80" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
      <text x="564" y="367" fill="#444441">扩展头</text>
      <rect x="608" y="344" width="212" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
      <text x="714" y="367" fill="#085041">数据</text>
    </g>
  </g>
</svg>
