    <rect x="8" y="76" width="180" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="98" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">IPv4 头</text>
    <rect x="192" y="76" width="160" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="272" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">AH 头</text>
    <rect x="356" y="76" width="356" height="42" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="534" y="103" text-anchor="middle" font-size="15" font-weight="600" fill="#115e59">数据</text>
