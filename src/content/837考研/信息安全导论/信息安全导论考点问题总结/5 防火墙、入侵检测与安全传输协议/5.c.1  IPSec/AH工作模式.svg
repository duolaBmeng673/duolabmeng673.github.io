    <text x="360" y="317" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">除可变域外的认证</text>
    <rect x="8" y="344" width="140" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
