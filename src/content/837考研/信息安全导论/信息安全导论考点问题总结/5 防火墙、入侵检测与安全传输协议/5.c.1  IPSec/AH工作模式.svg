<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" width="720" height="548" role="img">
  <title>AH 工作模式：传输模式与隧道模式</title>
  <desc>展示 IPv4 和 IPv6 下 IPSec AH 传输模式与隧道模式的数据包封装结构及认证范围。</desc>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif">
    <text x="8" y="24" font-size="16" font-weight="600" fill="#1f2937" paint-order="stroke" stroke="#f7f6f2" stroke-width="3" stroke-linejoin="round">IPv4 传输模式</text>
    <line x1="8" y1="60" x2="8" y2="74" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
