    <line x1="144" y1="344" x2="697" y2="344" stroke="#898781" stroke-width="1.5" marker-end="url(#a-arr)"/>
    <rect x="352" y="328" width="140" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
    <text x="422" y="347" text-anchor="middle" font-size="13.5" font-weight="500" fill="#633806">3. 验证载荷</text>
