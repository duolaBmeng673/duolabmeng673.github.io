  <defs>
    <marker id="a-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="422" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#0B0B0B">野蛮模式协商过程</text>

    <line x1="140" y1="108" x2="140" y2="392" stroke="#898781" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="705" y1="108" x2="705" y2="392" stroke="#898781" stroke-width="1.2" stroke-dasharray="4,3"/>

    <rect x="75" y="66" width="130" height="42" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
    <text x="140" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">发起方</text>
    <rect x="640" y="66" width="130" height="42" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
    <text x="705" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">响应方</text>

    <line x1="144" y1="168" x2="697" y2="168" stroke="#898781" stroke-width="1.5" marker-end="url(#a-arr)"/>
    <rect x="242" y="152" width="360" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
    <text x="422" y="171" text-anchor="middle" font-size="13.5" font-weight="500" fill="#3C3489">1. 安全参数提议、DH 公开值、认证数据等</text>

    <line x1="701" y1="256" x2="148" y2="256" stroke="#898781" stroke-width="1.5" marker-end="url(#a-arr)"/>
